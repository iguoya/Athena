<?xml version="1.0" encoding="UTF-8"?>
<!--
  firmware 的应用图标：领域代表图标，直接取自知名图标集，不自造。
  出处：Lucide Icons「cpu"，ISC 许可，https://lucide.dev（stroke 色为本应用领域色，线条原样取自图标集）
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面
  三处同源（ADR 0065）。改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#0d9488"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M12 20v2" />
  <path d="M12 2v2" />
  <path d="M17 20v2" />
  <path d="M17 2v2" />
  <path d="M2 12h2" />
  <path d="M2 17h2" />
  <path d="M2 7h2" />
  <path d="M20 12h2" />
  <path d="M20 17h2" />
  <path d="M20 7h2" />
  <path d="M7 20v2" />
  <path d="M7 2v2" />
  <rect x="4" y="4" width="16" height="16" rx="2" />
  <rect x="8" y="8" width="8" height="8" rx="1" />
</svg>
