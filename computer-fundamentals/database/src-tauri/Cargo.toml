[package]
name = "athena-database"
version = "0.1.0"
description = "Athena 数据库 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_database_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
# bundled：SQLite 源码随应用一起编译，实验零外部依赖（ADR 0047：
# Windows 上没有系统 sqlite3，链系统库走不通）。
rusqlite = { version = "0.41", features = ["bundled"] }
