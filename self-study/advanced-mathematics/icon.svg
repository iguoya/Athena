<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#00695C"/>
  <!-- 坐标轴 -->
  <g stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M100 400 H420" />
    <path d="M140 440 V120" />
  </g>
  <!-- 曲线 y = f(x) 与曲边梯形阴影 -->
  <path d="M160 380 C 220 360 240 200 300 180 C 340 168 370 190 400 170 L400 400 L160 400 Z" fill="#80CBC4" fill-opacity="0.55"/>
  <path d="M160 380 C 220 360 240 200 300 180 C 340 168 370 190 400 170" stroke="#FFC107" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- 积分限竖线 -->
  <g stroke="#ffffff" stroke-width="8" stroke-dasharray="2 14">
    <path d="M160 380 V400"/>
    <path d="M400 170 V400"/>
  </g>
  <text x="256" y="480" text-anchor="middle" fill="#B2DFDB" font-family="Noto Sans SC, sans-serif" font-size="40" font-weight="700">高等数学</text>
</svg>
