# 课程与 practice/earth 的 Tauri 壳（ADR 0140）。
# launcher 另有自己的工作区（含 launcher-core），不能再嵌进这一层；
# 两边的 workspace.dependencies 必须逐字相同，由 scripts/check.py 比对。
[workspace]
resolver = "2"
members = [
  "packages/athena-course-shell",
  "practice/earth/src-tauri",
  "postgraduate/algorithms/src-tauri",
  "postgraduate/ascent/src-tauri",
  "programming/c-plus-plus/src-tauri",
  "programming/chinese-chess/src-tauri",
  "programming/snake/src-tauri",
  "mentor/competitions/src-tauri",
  "mentor/jiuzhou/src-tauri",
  "postgraduate/cs408/src-tauri",
  "postgraduate/data-structures/src-tauri",
  "computer-fundamentals/database/src-tauri",
  "artificial-intelligence/deep-learning/src-tauri",
  "artificial-intelligence/edge-ai/src-tauri",
  "programming/design-patterns/src-tauri",
  "certification/embedded/src-tauri",
  "electronics/firmware/src-tauri",
  "guide/gtkmm/src-tauri",
  "guide/selinger-linear-algebra/src-tauri",
  "guide/siefken-linear-algebra/src-tauri",
  "programming/linux/src-tauri",
  "artificial-intelligence/llm-app/src-tauri",
  "artificial-intelligence/llm-finetune/src-tauri",
  "artificial-intelligence/machine-learning/src-tauri",
  "postgraduate/mathematics/src-tauri",
  "tools/math-tools/src-tauri",
  "electronics/microcontroller/src-tauri",
  "postgraduate/network/src-tauri",
  "postgraduate/organization/src-tauri",
  "postgraduate/os/src-tauri",
  "mentor/polaris/src-tauri",
  "programming/python/src-tauri",
  "electronics/rtos/src-tauri",
  "certification/software/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

# 成员自己的 [profile] 在虚拟工作区里不生效，统一写在这里。
# 与 launcher/Cargo.toml 的同名表逐字相同，由 scripts/check.py 比对。
[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
