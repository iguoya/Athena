[package]
name = "athena-linear-algebra-video"
version = "0.1.0"
description = "Athena 线性代数（工）·视频课"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_linear_algebra_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：自带 SQLite 源码一起编，不依赖目标机器上有没有 libsqlite3（Windows 没有系统库，ADR 0047）。
rusqlite = { version = "0.41", features = ["bundled"] }
dirs-next = "2"
