<?xml version="1.0" encoding="UTF-8"?>
<!--
  大众线性代数·视频课的图标：坐标轴上的一条向量方向线（线性代数）加一个播放三角（视频课）。
  原创图形，无第三方素材。
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面三处同源（主仓库 ADR 0065）。
  改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <g fill="none" stroke="#2a8a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21h18M3 21V3"/>
    <path d="M6 18 15 9" stroke="#6bbcbc"/>
    <path d="M6 6l1.7 0M6 6l0 1.7M15 9l-1.7 0M15 9l0 1.7"/>
    <path d="M15.5 4.5v6l5-3z" fill="#2a8a8a" stroke="#1f6e6e"/>
  </g>
</svg>
