<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>驾考进度</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1f2329; --secondary: #6b7280;
      --line: #e5e7eb; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418; --card: #1b1f24; --ink: #e6e8ea; --secondary: #9aa1ab;
        --line: #2a2f36; --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 3vw 48px; background: var(--bg); color: var(--ink);
      font: 18px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    /* 2K 及以上充分铺开；超宽屏（4K）也别无限拉 */
    main { max-width: 2200px; margin: 0 auto; }
    h1 { font-size: 1.625rem; margin: 0 0 4px; }
    .meta { color: var(--secondary); font-size: 1rem; margin-bottom: 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card .num { font-size: 1.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .card .label { color: var(--secondary); font-size: 1rem; margin-top: 2px; }
    .tabs { display: flex; gap: 8px; margin: 26px 0 0; flex-wrap: wrap; }
    .tabs button {
      font: inherit; font-size: 1.125rem; padding: 8px 22px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--secondary); cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    /* 科目内二级视图标签：小一号、带边距，与一级科目切换显式区隔 */
    .view-tabs { margin: 22px 0 0; }
    .view-tabs button { font-size: 1rem; padding: 6px 18px; }
    section { margin-top: 28px; }
    section > h2, .block > h2 { font-size: 1.3125rem; margin: 0 0 10px; }
    h2 small { color: var(--secondary); font-weight: 400; font-size: 1rem; margin-left: 8px; }
    .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; height: 280px; }
    .chart.tall { height: 320px; }
    /* 图表网格：窄屏单列，中屏两列，宽屏（≥1500px，含 2K）三列铺满 */
    .grid { display: grid; gap: 28px 14px; grid-template-columns: 1fr; margin-top: 28px; }
    /* 子项默认 min-width:auto 会被 ECharts 的 canvas 固有宽度撑开，轨道就不均分了 */
    .grid > section, .grid > .block { margin-top: 0; min-width: 0; }
    @media (min-width: 960px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .span2 { grid-column: span 2; }
    }
    @media (min-width: 1500px) {
      .grid { grid-template-columns: 1fr 1fr 1fr; }
      .grid .span2 { grid-column: span 2; }
      .grid .span3 { grid-column: span 3; }
    }
    ul.list { list-style: none; margin: 0; padding: 0; }
    ul.list li {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 10px 16px; margin-bottom: 8px; display: flex; justify-content: space-between;
      gap: 12px; font-size: 1rem; flex-wrap: wrap;
    }
    ul.list li .sub { color: var(--secondary); }
    ul.list time { color: var(--secondary); white-space: nowrap; }
    .empty { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 22px; color: var(--secondary); text-align: center; }
    .error-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 28px; text-align: center; color: var(--secondary); margin-top: 24px; }
  </style>
</head>
<body>
<main>
  <h1>驾考进度</h1>
  <div class="meta" id="meta">读取中…</div>

  <div class="cards" id="cards" hidden></div>

  <div class="tabs" id="tabs" hidden></div>

  <div id="tab-overview">
    <section id="daily-section" hidden>
      <h2>最近 30 天<small>柱是作答量，线是正确率</small></h2>
      <div class="chart" id="daily"></div>
    </section>

    <div class="grid">
      <section id="calendar-section" hidden>
        <h2>练习日历<small>颜色越深练得越多</small></h2>
        <div class="chart" id="calendar" style="height: auto; padding: 16px 8px;"></div>
      </section>

      <div class="block" id="sunburst-block" hidden>
        <h2>作答分布<small>外圈是章节</small></h2>
        <div class="chart tall" id="sunburst"></div>
      </div>

      <div class="block" id="radar-block" hidden>
        <h2 id="radar-title">章节正确率</h2>
        <div class="chart tall" id="radar"></div>
      </div>

      <section id="exams-section" class="span2" hidden>
        <h2>模拟考成绩</h2>
        <div class="chart" id="exams"></div>
      </section>

      <section id="subjects-section" hidden>
        <h2>各科目</h2>
        <div class="chart" id="subjects"></div>
      </section>

      <section id="achievements-section" class="span2 span3" hidden>
        <h2>成就</h2>
        <ul class="list" id="achievements"></ul>
      </section>
    </div>
  </div>

  <div id="tab-subjects"></div>
  <div id="tab-diagnosis" hidden></div>

  <div class="error-box" id="error" hidden></div>
</main>

<script src="{{ url_for('static', filename='echarts.min.js') }}"></script>
<script>
"use strict";

const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const ink = css("--ink"), secondary = css("--secondary"), line = css("--line");
const accent = css("--accent"), ok = css("--ok"), bad = css("--bad"), warn = css("--warn");
const cardBg = css("--card");

const charts = [];
function chart(el) {
  const c = echarts.init(el);
  charts.push(c);
  return c;
}
window.addEventListener("resize", () => charts.forEach(c => c.resize()));

const BASE_TEXT = { color: secondary, fontSize: 15 };
const pct = v => v == null ? "—" : Math.round(v * 100) + "%";
const rateColor = r => r == null ? secondary : r >= 0.9 ? ok : r >= 0.8 ? accent : bad;

// 概览数字从 0 滚到目标值：数字动效让「总量」这类抽象大数有实感
function countUp(el, target, format) {
  if (!isFinite(target) || target <= 0) { el.textContent = format(target); return; }
  const start = performance.now(), duration = 700;
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = format(target * eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let DATA;
const rendered = {};

/* ---------------------------------------------------------------- 总览 */

function renderOverview() {
  const data = DATA;

  // ---- 最近 30 天：柱是题量，线是正确率
  if (data.daily.some(d => d.attempts > 0)) {
    document.getElementById("daily-section").hidden = false;
    chart(document.getElementById("daily")).setOption({
      grid: { left: 56, right: 48, top: 28, bottom: 28 },
      tooltip: { trigger: "axis" },
      legend: { textStyle: BASE_TEXT, top: 0 },
      xAxis: { type: "category", data: data.daily.map(d => d.date.slice(5)),
               axisLabel: BASE_TEXT, axisLine: { lineStyle: { color: line } } },
      yAxis: [
        { type: "value", minInterval: 1, axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
        { type: "value", max: 100, min: 0, axisLabel: BASE_TEXT, splitLine: { show: false } },
      ],
      series: [
        { name: "作答", type: "bar", data: data.daily.map(d => d.attempts),
          itemStyle: { color: accent, borderRadius: [3, 3, 0, 0] } },
        { name: "正确率", type: "line", yAxisIndex: 1,
          data: data.daily.map(d => d.attempts ? Math.round(d.correct / d.attempts * 100) : null),
          smooth: true, showSymbol: false, itemStyle: { color: ok }, connectNulls: false,
          tooltip: { valueFormatter: v => v == null ? "—" : v + "%" } },
      ],
    });
  }

  // ---- 练习日历：热力格子，全历史跨度
  if (data.calendar.length) {
    const days = data.calendar.map(d => d[0]);
    const first = new Date(days[0]);
    const rangeStart = new Date(first.getFullYear(), first.getMonth(), 1).toISOString().slice(0, 10);
    const rangeEnd = new Date().toISOString().slice(0, 10);
    const months = (new Date(rangeEnd).getYear() - new Date(rangeStart).getYear()) * 12
                 + new Date(rangeEnd).getMonth() - new Date(rangeStart).getMonth() + 1;
    const el = document.getElementById("calendar");
    el.style.height = (months * 32 + 68) + "px";
    document.getElementById("calendar-section").hidden = false;
    chart(el).setOption({
      visualMap: {
        min: 0, max: Math.max(...data.calendar.map(d => d[1])), type: "continuous",
        orient: "horizontal", left: "center", bottom: 0, itemWidth: 12,
        text: ["多", "少"], textStyle: BASE_TEXT, inRange: { color: [line, accent] },
      },
      calendar: {
        range: [rangeStart, rangeEnd], cellSize: [null, 26], splitLine: { show: false },
        itemStyle: { color: "transparent", borderColor: line, borderWidth: 1 },
        yearLabel: { show: false }, dayLabel: { color: secondary, fontSize: 14, nameMap: "ZH" },
        monthLabel: { color: secondary, fontSize: 14, nameMap: "ZH" },
      },
      series: [{ type: "heatmap", coordinateSystem: "calendar", data: data.calendar,
                 itemStyle: { borderRadius: 4 } }],
    });
  }

  // ---- 作答分布旭日
  if (data.sunburst.length) {
    document.getElementById("sunburst-block").hidden = false;
    chart(document.getElementById("sunburst")).setOption({
      tooltip: { formatter: p => `${p.treePathInfo.map(i => i.name).slice(0, -1).join(" · ")}：${p.value} 次作答` },
      series: [{
        type: "sunburst", radius: ["12%", "88%"], data: data.sunburst,
        label: { color: ink, fontSize: 15, minAngle: 12 },
        levels: [
          {},
          { r0: "12%", r: "46%", label: { rotate: "tangential", fontSize: 17, fontWeight: 600 } },
          { r0: "46%", r: "88%", itemStyle: { opacity: 0.75 }, label: { rotate: 0 } },
        ],
        itemStyle: { borderColor: cardBg, borderWidth: 1.5 },
      }],
    });
  }

  // ---- 主修科目章节正确率雷达
  if (data.radar.indicators.length >= 3) {
    document.getElementById("radar-block").hidden = false;
    document.getElementById("radar-title").textContent = data.radar.subject + "章节正确率";
    chart(document.getElementById("radar")).setOption({
      tooltip: { formatter: p => p.name ? `${p.name}<br>${p.value} 分` : "" },
      radar: {
        indicator: data.radar.indicators, radius: "56%", splitNumber: 4,
        axisName: { color: secondary, fontSize: 14 },
        axisLine: { lineStyle: { color: line } },
        splitLine: { lineStyle: { color: line } },
        splitArea: { show: false },
      },
      series: [{ type: "radar", data: [{
        value: data.radar.values, name: "正确率",
        areaStyle: { color: accent, opacity: 0.25 },
        lineStyle: { color: accent }, itemStyle: { color: accent }, symbolSize: 4,
      }] }],
    });
  }

  // ---- 各科目横条
  const withAttempts = data.subjects.filter(s => s.attempts > 0);
  if (withAttempts.length) {
    document.getElementById("subjects-section").hidden = false;
    chart(document.getElementById("subjects")).setOption({
      grid: { left: 130, right: 70, top: 10, bottom: 28 },
      tooltip: {
        formatter: p => {
          const s = withAttempts[p[0].dataIndex];
          return `${s.full_title}<br>作答 ${s.attempts} · 正确率 ${pct(s.rate)}`
            + (s.exams ? `<br>模拟考 ${s.exams} 场 · 平均 ${s.exam_avg} 分` : "");
        },
      },
      xAxis: { type: "value", max: 100, axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", data: withAttempts.map(s => s.title),
               axisLabel: { color: ink, fontSize: 17 }, axisLine: { lineStyle: { color: line } } },
      series: [{
        type: "bar", data: withAttempts.map(s => ({ value: Math.round(s.rate * 100),
          itemStyle: { color: rateColor(s.rate), borderRadius: [0, 3, 3, 0] } })),
        label: { show: true, position: "right", fontSize: 15, color: secondary,
                 formatter: p => pct(withAttempts[p.dataIndex].rate) },
        barWidth: 20,
      }],
    });
  }

  // ---- 模拟考 + 成就
  renderExams("exams", "exams-section", data.exams);
  if (data.achievements.length) {
    document.getElementById("achievements-section").hidden = false;
    document.getElementById("achievements").innerHTML = data.achievements
      .map(a => `<li><span>${a.label}</span><time>${a.at.slice(0, 10)}</time></li>`)
      .join("");
  }
}

// 模拟考柱图（总览与科目页共用）
function renderExams(elId, sectionId, exams) {
  if (!exams.length) return;
  document.getElementById(sectionId).hidden = false;
  chart(document.getElementById(elId)).setOption({
    grid: { left: 44, right: 24, top: 28, bottom: 28 },
    tooltip: {
      formatter: p => {
        const e = exams[p[0].dataIndex];
        return `${e.subject} · ${e.at.replace("T", " ")}<br>${e.score} 分${e.passed ? " · 及格" : " · 未过"}`;
      },
    },
    xAxis: { type: "category", data: exams.map((_, i) => i + 1),
             axisLabel: BASE_TEXT, axisLine: { lineStyle: { color: line } } },
    yAxis: { type: "value", max: 100, min: 0, axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
    series: [{
      type: "bar",
      data: exams.map(e => ({ value: e.score,
        itemStyle: { color: e.passed ? ok : bad, borderRadius: [3, 3, 0, 0] } })),
      markLine: {
        silent: true, symbol: "none",
        lineStyle: { color: secondary, type: "dashed" },
        label: { formatter: "90 分", color: secondary, fontSize: 15 },
        data: [{ yAxis: 90 }],
      },
    }],
  });
}

/* ---------------------------------------------------------------- 科目深挖 */

// 章节短名映射（矩阵 tooltip 用）
const TOPIC_TITLES_MAP = {};
function TOPIC_TITLE(topic) { return TOPIC_TITLES_MAP[topic] ?? topic; }

function renderSubject(sid) {
  const d = DATA.details[sid];
  if (!d) return;
  const w = d.wrong;
  const exams = DATA.exams.filter(e => e.subject === d.title);
  const p = sid;  // 元素 id 前缀，避免与总览冲突
  document.getElementById("tab-subjects").insertAdjacentHTML("beforeend", `
    <div id="tab-${p}" hidden>
      <div class="cards" id="${p}-cards"></div>
      <section id="${p}-advice-section" style="margin-top: 20px;" hidden>
        <h2>数据说明与建议<small>由上面的记录派生，数字变了建议跟着变</small></h2>
        <ul class="list" id="${p}-advice"></ul>
      </section>
      <div class="tabs view-tabs" id="${p}-views" hidden></div>
      <div class="view" id="${p}-view-wrong">
        <div class="grid">
          <section class="span2">
            <h2>错题消化曲线<small>同一道题第 n 次作答时的正确率——重练到第几遍才稳</small></h2>
            <div class="chart" id="${p}-curve"></div>
          </section>
          <div class="block">
            <h2>错题状态<small>最近两次连对算攻克</small></h2>
            <div class="chart tall" id="${p}-status"></div>
          </div>
          <section class="span3">
            <h2>章节练习与错题<small>条是作答量，颜色是正确率，右侧标注错过的题</small></h2>
            <div class="chart" id="${p}-chapters" style="height: 420px;"></div>
          </section>
          <section>
            <h2>顽固错题<small>错得最多的十道</small></h2>
            <ul class="list" id="${p}-stubborn"></ul>
          </section>
          <section id="${p}-drill-section">
            <h2>错题重练<small>错题本与考前复习里的作答</small></h2>
            <div class="chart" id="${p}-drill"></div>
          </section>
        </div>
      </div>
      <div class="view" id="${p}-view-exam" hidden>
        <div class="grid">
          <section class="span3" id="${p}-examchapters-section" hidden>
            <h2>模拟考章节丢分<small>条是考试里丢分的题数，颜色是考试正确率</small></h2>
            <div class="chart" id="${p}-examchapters" style="height: 420px;"></div>
          </section>
          <section class="span3" id="${p}-sessions-section" hidden>
            <h2>每场丢分的章节构成<small>柱是一场考试，颜色是丢分所在章节</small></h2>
            <div class="chart" id="${p}-sessions" style="height: 400px;"></div>
          </section>
          <section class="span3" id="${p}-gap-section" hidden>
            <h2>练习 vs 考试<small>同一章的两根条：平时练习与模拟考的正确率，落差大的是应试短板</small></h2>
            <div class="chart" id="${p}-gap" style="height: 420px;"></div>
          </section>
          <section id="${p}-repeat-section" hidden>
            <h2>跨场重复丢分<small>不止一场考试都错的题</small></h2>
            <ul class="list" id="${p}-repeat"></ul>
          </section>
          <section class="span3" id="${p}-exams-section">
            <h2>${d.title}模拟考成绩<small>90 分及格线，过没过用颜色分</small></h2>
            <div class="chart" id="${p}-exams"></div>
            <div class="empty" id="${p}-exams-empty" hidden>还没有${d.title}的模拟考记录</div>
          </section>
        </div>
      </div>
      <div class="view" id="${p}-view-chapters" hidden>
        <div class="grid">
          <section class="span3" id="${p}-matrix-section">
            <h2>章节 × 日期<small>格子是当天该章的正确率，灰格没练</small></h2>
            <div class="chart" id="${p}-matrix" style="height: 420px;"></div>
          </section>
        </div>
      </div>
    </div>`);

  // ---- 科目概览卡
  const totalAttempts = d.chapters.reduce((s, c) => s + c.attempts, 0);
  const totalCorrect = d.chapters.reduce((s, c) => s + c.correct, 0);
  const drills = d.wrong_drill.reduce((s, x) => s + x.attempts, 0);
  const avg = exams.length ? Math.round(exams.reduce((s, e) => s + e.score, 0) / exams.length) : null;
  const cards = [
    [totalAttempts, v => Math.round(v).toLocaleString("zh-CN"), "作答"],
    [totalAttempts ? totalCorrect / totalAttempts : 0, v => totalAttempts ? pct(v) : "—", "正确率"],
    [w.questions, v => Math.round(v).toLocaleString("zh-CN"), "答过的题"],
    [w.ever_wrong, v => Math.round(v).toLocaleString("zh-CN"), "错过的题"],
    [w.fixed, v => Math.round(v).toLocaleString("zh-CN"), "已攻克"],
    [w.still, v => Math.round(v).toLocaleString("zh-CN"), "仍错着"],
    [drills, v => Math.round(v).toLocaleString("zh-CN"), "错题重练"],
    [exams.length, v => avg == null ? Math.round(v) : Math.round(v), avg == null ? "模拟考场数" : `模拟考 · 均分 ${avg}`],
  ];
  const box = document.getElementById(p + "-cards");
  box.innerHTML = cards.map(() => `<div class="card"><div class="num">0</div><div class="label"></div></div>`).join("");
  [...box.querySelectorAll(".card")].forEach((card, i) => {
    const [target, format, label] = cards[i];
    card.querySelector(".label").textContent = label;
    countUp(card.querySelector(".num"), target, format);
  });

  // ---- 错题消化曲线（样本 <5 的点不画：一两个题的正确率只是噪声）
  const curve = w.repeat_curve.filter(c => c.count >= 5);
  chart(document.getElementById(p + "-curve")).setOption({
    grid: { left: 56, right: 24, top: 32, bottom: 36 },
    tooltip: {
      formatter: q => {
        const c = curve[q[0].dataIndex];
        return `第 ${c.n} 次作答：正确率 ${pct(c.rate)}<br>样本 ${c.count} 题`;
      },
    },
    xAxis: { type: "category", name: "第 n 次", nameTextStyle: BASE_TEXT,
             data: curve.map(c => c.n), axisLabel: BASE_TEXT, axisLine: { lineStyle: { color: line } } },
    yAxis: { type: "value", min: 40, max: 100,
             axisLabel: { ...BASE_TEXT, formatter: "{value}%" }, splitLine: { lineStyle: { color: line } } },
    series: [{
      type: "line", data: curve.map(c => Math.round(c.rate * 100)),
      label: { show: true, color: secondary, fontSize: 15, formatter: q => curve[q.dataIndex].count + " 题" },
      lineStyle: { color: accent, width: 3 }, itemStyle: { color: accent }, symbolSize: 8,
      areaStyle: { color: accent, opacity: 0.08 },
      markLine: { silent: true, symbol: "none", lineStyle: { color: ok, type: "dashed" },
                  label: { formatter: "90%", color: ok, fontSize: 15 }, data: [{ yAxis: 90 }] },
    }],
  });

  // ---- 错题状态环
  const never = w.questions - w.ever_wrong;
  chart(document.getElementById(p + "-status")).setOption({
    tooltip: { formatter: q => `${q.name}：${q.value} 题（${pct(q.value / w.questions)}）` },
    series: [{
      type: "pie", radius: ["45%", "72%"], center: ["50%", "52%"],
      label: { color: ink, fontSize: 15, formatter: q => `${q.name} ${q.value}` },
      data: [
        { name: "从未错过", value: never, itemStyle: { color: line } },
        { name: "已攻克", value: w.fixed, itemStyle: { color: ok } },
        { name: "仍错着", value: w.still, itemStyle: { color: bad } },
      ],
    }],
  });

  // ---- 章节练习与错题横条
  const chapters = d.chapters.filter(c => c.attempts > 0);
  chart(document.getElementById(p + "-chapters")).setOption({
    grid: { left: 200, right: 150, top: 10, bottom: 28 },
    tooltip: {
      formatter: q => {
        const c = chapters[q[0].dataIndex];
        return `${c.title}<br>作答 ${c.attempts} 次 · 答过 ${c.questions} 题<br>`
          + `正确率 ${pct(c.rate)} · 错过 ${c.wrong_questions} 题`;
      },
    },
    xAxis: { type: "value", axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
    yAxis: { type: "category", inverse: true, data: chapters.map(c => c.title),
             axisLabel: { color: ink, fontSize: 16 }, axisLine: { lineStyle: { color: line } } },
    series: [{
      type: "bar", data: chapters.map(c => ({ value: c.attempts,
        itemStyle: { color: rateColor(c.rate), borderRadius: [0, 3, 3, 0] } })),
      label: { show: true, position: "right", fontSize: 15, color: secondary,
               formatter: q => `${pct(chapters[q.dataIndex].rate)} · 错过 ${chapters[q.dataIndex].wrong_questions}` },
      barWidth: 20,
    }],
  });

  // ---- 模拟考章节丢分（kind='exam' 的数据要有才画，driver ADR 0057）
  const examChapters = chapters.filter(c => c.exam_attempts > 0);
  if (examChapters.length) {
    document.getElementById(p + "-examchapters-section").hidden = false;
    chart(document.getElementById(p + "-examchapters")).setOption({
      grid: { left: 200, right: 110, top: 10, bottom: 28 },
      tooltip: {
        formatter: q => {
          const c = examChapters[q[0].dataIndex];
          return `${c.title}<br>考试作答 ${c.exam_attempts} 次 · 正确率 ${pct(c.exam_rate)}<br>丢分 ${c.exam_wrong_questions} 题`;
        },
      },
      xAxis: { type: "value", minInterval: 1, axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", inverse: true, data: examChapters.map(c => c.title),
               axisLabel: { color: ink, fontSize: 16 }, axisLine: { lineStyle: { color: line } } },
      series: [{
        type: "bar", data: examChapters.map(c => ({ value: c.exam_wrong_questions,
          itemStyle: { color: rateColor(c.exam_rate), borderRadius: [0, 3, 3, 0] } })),
        label: { show: true, position: "right", fontSize: 15, color: secondary,
                 formatter: q => `丢 ${examChapters[q.dataIndex].exam_wrong_questions} · ${pct(examChapters[q.dataIndex].exam_rate)}` },
        barWidth: 20,
      }],
    });
  }

  // ---- 每场丢分的章节构成（堆叠柱：哪场败在哪章）
  const sessions = d.exam.sessions;
  if (sessions.length) {
    document.getElementById(p + "-sessions-section").hidden = false;
    const titles = [...new Set(sessions.flatMap(s => s.misses.map(m => m.title)))];
    chart(document.getElementById(p + "-sessions")).setOption({
      grid: { left: 44, right: 20, top: 40, bottom: 28 },
      tooltip: {
        formatter: qs => {
          const s = sessions[qs[0].dataIndex];
          const detail = qs.map(q => `${q.marker}${q.seriesName}：${q.value} 题`).join("<br>");
          return `第 ${qs[0].dataIndex + 1} 场 · ${s.at.slice(0, 10)} · ${s.score} 分${s.passed ? "（及格）" : ""}<br>${detail}`;
        },
      },
      legend: { textStyle: BASE_TEXT, top: 0, type: "scroll" },
      xAxis: { type: "category", data: sessions.map((_, i) => `第 ${i + 1} 场`),
               axisLabel: BASE_TEXT, axisLine: { lineStyle: { color: line } } },
      yAxis: { type: "value", minInterval: 1, name: "丢分题数", nameTextStyle: BASE_TEXT,
               axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
      series: titles.map(t => ({
        name: t, type: "bar", stack: "miss", barWidth: 26,
        itemStyle: { borderRadius: 3 },
        data: sessions.map(s => s.misses.find(m => m.title === t)?.count ?? 0),
      })),
    });
  }

  // ---- 练习 vs 考试正确率对照（有考试数据的章才画）
  const gapChapters = chapters.filter(c => c.exam_attempts > 0);
  if (gapChapters.length) {
    document.getElementById(p + "-gap-section").hidden = false;
    chart(document.getElementById(p + "-gap")).setOption({
      grid: { left: 200, right: 70, top: 36, bottom: 28 },
      tooltip: { trigger: "axis", valueFormatter: v => v == null ? "—" : v + "%" },
      legend: { textStyle: BASE_TEXT, top: 0 },
      xAxis: { type: "value", max: 100, axisLabel: { ...BASE_TEXT, formatter: "{value}%" },
               splitLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", inverse: true, data: gapChapters.map(c => c.title),
               axisLabel: { color: ink, fontSize: 15 }, axisLine: { lineStyle: { color: line } } },
      series: [
        { name: "平时练习", type: "bar", barWidth: 14, itemStyle: { color: accent, borderRadius: 3 },
          label: { show: true, position: "right", fontSize: 14, color: secondary, formatter: q => pct(gapChapters[q.dataIndex].rate) },
          data: gapChapters.map(c => Math.round((c.rate ?? 0) * 100)) },
        { name: "模拟考", type: "bar", barWidth: 14, itemStyle: { color: warn, borderRadius: 3 },
          label: { show: true, position: "right", fontSize: 14, color: secondary, formatter: q => pct(gapChapters[q.dataIndex].exam_rate) },
          data: gapChapters.map(c => c.exam_rate == null ? null : Math.round(c.exam_rate * 100)) },
      ],
    });
  }

  // ---- 跨场重复丢分
  const repeatBox = document.getElementById(p + "-repeat");
  if (d.exam.repeat_misses.length) {
    document.getElementById(p + "-repeat-section").hidden = false;
    repeatBox.innerHTML = d.exam.repeat_misses.map(r =>
      `<li><span>#${r.no} · ${r.title}</span><span class="sub">${r.sessions} 场考试都丢分</span></li>`).join("");
  }

  // ---- 数据说明与建议：全部由已派生的量规则化生成，数字变建议跟着变
  const advice = [];
  if (sessions.length) {
    const last = sessions[sessions.length - 1];
    advice.push(last.passed
      ? `最近一场 ${last.score} 分（及格）。保持节奏，考前把仍错着的 ${w.still} 题过一遍。`
      : `最近一场 ${last.score} 分，距 90 分线差 ${90 - last.score} 分：丢分集中处见「每场丢分的章节构成」。`);
  } else {
    advice.push("还没有模拟考记录。章节练熟后来一场，考试维度的统计就会在这里展开。");
  }
  const withExam = chapters.filter(c => c.exam_attempts >= 20);
  if (withExam.length) {
    const weakest = [...withExam].sort((a, b) => (a.exam_rate ?? 1) - (b.exam_rate ?? 1))[0];
    advice.push(`${weakest.title}：考试正确率 ${pct(weakest.exam_rate)}，是模拟考里最弱的一章，建议优先补练。`);
    const gapped = [...withExam].sort((a, b) => ((a.rate ?? 0) - (a.exam_rate ?? 0)) - ((b.rate ?? 0) - (b.exam_rate ?? 0)));
    const worst = gapped[gapped.length - 1];
    if (worst && worst.id !== weakest.id && (worst.rate ?? 0) - (worst.exam_rate ?? 0) >= 0.05) {
      advice.push(`${worst.title}：平时 ${pct(worst.rate)}、考试 ${pct(worst.exam_rate)}，落差最大——平时会、考场上丢，多用模拟考节奏练它。`);
    }
  }
  if (d.exam.repeat_misses.length) {
    const r = d.exam.repeat_misses[0];
    advice.push(`#${r.no}（${r.title}）在 ${r.sessions} 场考试都丢分，属于最该优先消灭的题。`);
  }
  if (d.exam.pace && d.exam.pace.exam_avg_ms && d.exam.pace.practice_avg_ms) {
    const examS = d.exam.pace.exam_avg_ms / 1000, pracS = d.exam.pace.practice_avg_ms / 1000;
    if (examS < pracS * 0.7) {
      advice.push(`考试每题 ${examS.toFixed(1)} 秒、平时 ${pracS.toFixed(1)} 秒：考试节奏明显偏快，答完留点时间回查。`);
    }
  }
  if (w.stubborn.length) {
    // 消化曲线的结论只引用样本充足的点：最后一个 ≥20 题的点，单题样本的正确率没有说服力
    const solid = [...w.repeat_curve].reverse().find(c => c.count >= 20);
    if (solid) {
      advice.push(`错题消化：重练到第 ${solid.n} 次正确率 ${pct(solid.rate)}（${solid.count} 题样本）——重练有效；仍错着的 ${w.still} 题里，先消灭反复错的顽固题。`);
    } else {
      advice.push(`仍错着 ${w.still} 题：先消灭「顽固错题」里反复错的那些，重练才有效率。`);
    }
  }
  document.getElementById(p + "-advice-section").hidden = false;
  document.getElementById(p + "-advice").innerHTML = advice.map(t => `<li><span>${t}</span></li>`).join("");

  // ---- 章节 × 日期热力矩阵
  if (d.chapter_days.length) {
    const days = [...new Set(d.chapter_days.map(x => x.day))].sort();
    const titles = chapters.map(c => c.title);
    const cells = d.chapter_days.map(x => [days.indexOf(x.day), titles.indexOf(TOPIC_TITLE(x.topic)),
      x.attempts ? Math.round(x.correct / x.attempts * 100) : 0]);
    chart(document.getElementById(p + "-matrix")).setOption({
      grid: { left: 200, right: 100, top: 10, bottom: 60 },
      tooltip: {
        formatter: q => {
          const x = d.chapter_days[q[0].dataIndex];
          return `${TOPIC_TITLE(x.topic)} · ${x.day}<br>${x.correct}/${x.attempts} 正确`;
        },
      },
      visualMap: {
        min: 50, max: 100, orient: "vertical", right: 10, top: "center", itemWidth: 14,
        text: ["稳", "生"], textStyle: BASE_TEXT,
        inRange: { color: [bad, warn, ok] },
      },
      xAxis: { type: "category", data: days.map(x => x.slice(5)), axisLabel: BASE_TEXT,
               axisLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", inverse: true, data: titles,
               axisLabel: { color: ink, fontSize: 15 }, axisLine: { lineStyle: { color: line } } },
      series: [{ type: "heatmap", data: cells,
                 itemStyle: { borderColor: cardBg, borderWidth: 2, borderRadius: 3 },
                 label: { show: days.length <= 20, fontSize: 13, color: "#fff" } }],
    });
  } else {
    document.getElementById(p + "-matrix-section").hidden = true;
  }

  // ---- 顽固错题榜
  document.getElementById(p + "-stubborn").innerHTML = w.stubborn.length
    ? w.stubborn.map(s =>
        `<li><span>#${s.no} · ${s.title}</span><span class="sub">错 ${s.wrongs}/${s.total} 次 · ${s.fixed ? "已攻克" : "仍错着"}</span></li>`).join("")
    : `<li><span>没有反复答错的题</span></li>`;

  // ---- 错题重练横条（wrong / review 场景）
  if (d.wrong_drill.length) {
    chart(document.getElementById(p + "-drill")).setOption({
      grid: { left: 200, right: 80, top: 10, bottom: 28 },
      tooltip: { formatter: q => {
        const x = d.wrong_drill[q[0].dataIndex];
        return `${x.title}：重练 ${x.attempts} 次 · 正确率 ${pct(x.rate)}`;
      } },
      xAxis: { type: "value", axisLabel: BASE_TEXT, splitLine: { lineStyle: { color: line } } },
      yAxis: { type: "category", inverse: true, data: d.wrong_drill.map(x => x.title),
               axisLabel: { color: ink, fontSize: 15 }, axisLine: { lineStyle: { color: line } } },
      series: [{
        type: "bar", data: d.wrong_drill.map(x => ({ value: x.attempts,
          itemStyle: { color: rateColor(x.rate), borderRadius: [0, 3, 3, 0] } })),
        label: { show: true, position: "right", fontSize: 15, color: secondary,
                 formatter: q => pct(d.wrong_drill[q.dataIndex].rate) },
        barWidth: 18,
      }],
    });
  } else {
    document.getElementById(p + "-drill-section").hidden = true;
  }

  // ---- 该科目模拟考
  if (exams.length) {
    document.getElementById(p + "-exams-empty").remove();
    renderExams(p + "-exams", p + "-exams-section", exams);
  } else {
    document.getElementById(p + "-exams").remove();
    document.getElementById(p + "-exams-empty").hidden = false;
  }

  // ---- 二级视图标签：错题 / 模拟考 / 章节节奏，一屏一组
  const views = document.getElementById(p + "-views");
  const defs = [
    ["wrong", "错题与消化"],
    ["exam", "模拟考"],
    ["chapters", "章节节奏"],
  ];
  views.hidden = false;
  views.innerHTML = defs.map(([key, label], i) =>
    `<button role="tab" data-view="${key}" aria-selected="${i === 0}">${label}</button>`).join("");
  views.addEventListener("click", e => {
    const btn = e.target.closest("button[data-view]");
    if (btn) showView(p, btn.dataset.view);
  });
}

// 科目内视图切换；按科目记住上次所在视图
const subjectView = {};
function showView(p, view) {
  document.querySelectorAll(`#${p}-views button`).forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.view === view)));
  for (const [, id] of [["wrong", `${p}-view-wrong`], ["exam", `${p}-view-exam`], ["chapters", `${p}-view-chapters`]])
    document.getElementById(id).hidden = id !== `${p}-view-${view}`;
  subjectView[p] = view;
  history.replaceState(null, "", `#${p}.${view}`);
  requestAnimationFrame(() => charts.forEach(c => c.resize()));
}

/* ---------------------------------------------------------------- 学习诊断
   口径同客户端 lib/diagnosis.dart（ADR 0076 决策 10），按单个学习者算；首次切到该标签才取数。
   服务端读不到题库内容：不做「与全国错误率比」和多选漏选/多选的方向，页面上明说。 */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const diag = { loaded: false, charts: [], user: null };

function loadDiagnosis(user) {
  const box = document.getElementById("tab-diagnosis");
  if (!diag.loaded) box.innerHTML = `<div class="empty">读取中…</div>`;
  const url = "diagnosis.json" + (user ? "?user=" + encodeURIComponent(user) : "");
  fetch(url)
    .then(r => r.ok ? r.json() : Promise.reject(new Error("http " + r.status)))
    .then(d => { diag.loaded = true; diag.user = d.selected; renderDiagnosis(d); })
    .catch(() => { box.innerHTML = `<div class="empty">学习诊断暂时拿不到，稍后再试。</div>`; });
}

function renderDiagnosis(d) {
  const box = document.getElementById("tab-diagnosis");
  diag.charts.forEach(c => { const i = charts.indexOf(c); if (i >= 0) charts.splice(i, 1); c.dispose(); });
  diag.charts = [];
  if (!d.diagnosis) { box.innerHTML = `<div class="empty">还没有任何作答记录，诊断从第一次练习之后开始。</div>`; return; }
  const g = d.diagnosis;
  const picker = d.learners.length > 1
    ? `<label class="meta">学习者 <select id="diag-user">${d.learners.map(p =>
        `<option value="${esc(p.id)}"${p.id === d.selected ? " selected" : ""}>${esc(p.name)}（${p.attempts} 次作答）</option>`).join("")}</select></label>`
    : `<div class="meta">${esc(d.learners[0].name)} · ${g.attempts} 次作答</div>`;
  const note = `<div class="meta">口径与客户端「强化练习」页下半的学习诊断一致。<b>与全国错误率比</b>、<b>多选漏选/多选</b>的方向需要题库内容，这里算不了，请在客户端看。</div>`;

  const c = g.causes;
  const causeTotal = Object.values(c.counts).reduce((a, b) => a + b, 0);
  const causeHtml = c.median_ms == null
    ? `<div class="empty">答对的题还不到 20 道，算不出你自己的平时用时，先不下结论（已有 ${c.sample} 次有效用时）。</div>`
    : `<div class="chart" id="diag-causes"></div>
       <ul class="list">${["careless", "unknown", "shaky", "ordinary"].filter(k => c.counts[k]).map(k =>
         `<li><span><b>${c.labels[k]} ${c.counts[k]}</b><span class="sub"> · ${esc(c.advice[k])}</span></span>
          <span class="sub">${(c.by_cause[k] || []).map(t => esc(t.title) + " " + t.n).join("、") || ""}</span></li>`).join("")
         || `<li>没有明显的错因偏向</li>`}</ul>
       <div class="meta">你答对一题的中位用时 ${(c.median_ms / 1000).toFixed(1)} 秒；比它快 40% 以上算「快」，慢 60% 以上算「慢」。共 ${causeTotal} 条需要关注。</div>`;

  const cf = g.confusion;
  const confHtml = cf.with_chosen === 0
    ? `<div class="empty">答错时所选选项还没有记录（较早的作答没存），这一项暂时没有数据。</div>`
    : `<ul class="list">${cf.repeated.length
        ? cf.repeated.map(r => `<li><span>${esc(r.serial)} <span class="sub">${esc(r.topic)}</span></span><span>反复选 ${esc(r.chosen)}，${r.times} 次</span></li>`).join("")
        : `<li>没有反复选同一个错选项的题。</li>`}</ul>
       <div class="meta">${cf.with_chosen} 次答错有所选记录（共 ${cf.wrong_total} 次答错）；其中多选题答错 ${cf.multi_wrong} 次。</div>`;

  const vg = g.variant_gap;
  const outHtml = g.outcomes.length === 0
    ? `<div class="empty">还没有强化练习的作答（需要带「选题理由」的记录）。</div>`
    : `<div class="chart" id="diag-outcomes"></div>` + (vg
        ? `<div class="meta"><b>变式差距</b>：复测原题答对 ${pct(vg.retest_rate)}（${vg.retest_n} 次），同考点变式答对 ${pct(vg.variant_rate)}（${vg.variant_n} 次），
           差 ${Math.round(vg.gap * 100)} 个百分点。${vg.enough ? (vg.gap >= 0.2 ? "差得多，说明记住的更像是那几道题，而不是考点。" : "差距不大，记住的多半是考点本身。") : "样本不足 10 次，只当线索。"}</div>`
        : "");

  box.innerHTML = `${picker}${note}
    <div class="grid">
      <section class="span2"><h2>记忆保持<small>答对之后，隔多久再做还答得对</small></h2>
        <div class="chart" id="diag-retention"></div></section>
      <section><h2>错因<small>用时对比自己的中位数</small></h2>${causeHtml}</section>
      <section><h2>选错的方式</h2>${confHtml}</section>
      <section class="span2"><h2>强化练习成效<small>按选题理由看</small></h2>${outHtml}</section>
    </div>`;
  const sel = document.getElementById("diag-user");
  if (sel) sel.addEventListener("change", () => loadDiagnosis(sel.value));

  const mk = id => { const el = document.getElementById(id); if (!el) return null; const ch = chart(el); diag.charts.push(ch); return ch; };
  mk("diag-retention")?.setOption({
    textStyle: BASE_TEXT, grid: { left: 50, right: 20, top: 30, bottom: 36 },
    tooltip: { trigger: "axis", formatter: ps => { const b = g.retention[ps[0].dataIndex];
      return `${b.label}<br>${b.correct}/${b.n} 答对${b.enough ? "" : "（样本不足）"}`; } },
    xAxis: { type: "category", data: g.retention.map(b => `${b.label}\n(${b.n})`), axisLabel: { color: secondary, fontSize: 13 } },
    yAxis: { type: "value", min: 0, max: 100, axisLabel: { color: secondary, formatter: "{value}%" }, splitLine: { lineStyle: { color: line } } },
    series: [{ type: "bar", barMaxWidth: 46, data: g.retention.map(b => b.rate == null ? "-" : {
      value: Math.round(b.rate * 100), itemStyle: { color: accent, opacity: b.enough ? 1 : 0.35 } }),
      label: { show: true, position: "top", color: ink, formatter: p => p.value + "%" } }],
  });
  mk("diag-causes")?.setOption({
    textStyle: BASE_TEXT, grid: { left: 70, right: 30, top: 10, bottom: 20 },
    xAxis: { type: "value", axisLabel: { color: secondary }, splitLine: { lineStyle: { color: line } } },
    yAxis: { type: "category", inverse: true, data: ["careless", "unknown", "shaky", "ordinary"].map(k => c.labels[k]), axisLabel: { color: ink } },
    series: [{ type: "bar", barMaxWidth: 28, label: { show: true, position: "right", color: ink },
      data: ["careless", "unknown", "shaky", "ordinary"].map((k, i) => ({ value: c.counts[k], itemStyle: { color: [warn, bad, accent, secondary][i] } })) }],
  });
  mk("diag-outcomes")?.setOption({
    textStyle: BASE_TEXT, grid: { left: 150, right: 50, top: 10, bottom: 20 },
    tooltip: { formatter: p => { const o = g.outcomes[p.dataIndex]; return `${o.label}<br>${o.correct}/${o.n}`; } },
    xAxis: { type: "value", min: 0, max: 100, axisLabel: { color: secondary, formatter: "{value}%" }, splitLine: { lineStyle: { color: line } } },
    yAxis: { type: "category", inverse: true, data: g.outcomes.map(o => `${o.label}（${o.n}）`), axisLabel: { color: ink, fontSize: 13 } },
    series: [{ type: "bar", barMaxWidth: 26, label: { show: true, position: "right", color: ink, formatter: p => p.value + "%" },
      data: g.outcomes.map(o => ({ value: Math.round(o.rate * 100), itemStyle: { color: ok, opacity: o.n >= 10 ? 1 : 0.4 } })) }],
  });
}

/* ---------------------------------------------------------------- 装配 */

function render(data) {
  DATA = data;
  const o = data.overview;
  document.getElementById("meta").textContent =
    "数据截至 " + (o.last_day ?? "—") + " · 生成于 " + data.generated_at.replace("T", " ").replace(/\+.*$/, "");

  const cards = [
    [o.attempts, v => Math.round(v).toLocaleString("zh-CN"), "累计作答"],
    // 百分比以「83」为目标滚动而不是 0.83——后者四舍五入全程只会显示 0%/1%
    [o.rate == null ? 0 : Math.round(o.rate * 100), v => o.rate == null ? "—" : Math.round(v) + "%", "总正确率"],
    [o.streak, v => (o.streak >= 1 ? Math.round(v) + " 天" : "—"), "连续练习"],
    [o.avg_duration_ms ? o.avg_duration_ms / 1000 : 0, v => o.avg_duration_ms ? (v).toFixed(1) + " 秒" : "—", "平均用时"],
    [o.exams, v => Math.round(v), "模拟考场数"],
    [o.drills + o.rehearsals, v => Math.round(v), "练车 / 演练"],
    [o.achievements, v => Math.round(v), "成就"],
  ];
  const box = document.getElementById("cards");
  box.hidden = false;
  box.innerHTML = cards.map(() => `<div class="card"><div class="num">0</div><div class="label"></div></div>`).join("");
  [...box.querySelectorAll(".card")].forEach((card, i) => {
    const [target, format, label] = cards[i];
    card.querySelector(".label").textContent = label;
    countUp(card.querySelector(".num"), target, format);
  });

  // 标签页：总览 + 有数据的科目（理论考试只有科目一、科目四；科目二是场地、科目三是路考）
  for (const d of Object.values(data.details))
    for (const c of d ? d.chapters : []) TOPIC_TITLES_MAP[c.id] = c.title;
  const tabsBar = document.getElementById("tabs");
  const tabs = ["overview", ...Object.keys(data.details).filter(k => data.details[k]), "diagnosis"];
  tabsBar.hidden = false;
  tabsBar.innerHTML = tabs.map(t =>
    `<button role="tab" data-tab="${t}" aria-selected="false">${t === "overview" ? "总览" : t === "diagnosis" ? "学习诊断" : data.details[t].title}</button>`
  ).join("");
  tabsBar.addEventListener("click", e => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) activate(btn.dataset.tab);
  });
  window.addEventListener("hashchange", () => activate(...parseHash()));

  renderOverview();
  activate(...parseHash(tabs));
}

// hash 两级：#总览 或 #科目.视图；非法值回退
function parseHash(tabs) {
  const [tab, view] = location.hash.slice(1).split(".");
  const validTab = tab === "overview" || tab === "diagnosis" || (DATA.details && DATA.details[tab]) ? tab : "overview";
  if (tabs && !tabs.includes(validTab)) return ["overview", null];
  return [validTab, view || subjectView[validTab] || null];
}

function activate(tab, view = null) {
  if (!DATA) return;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.getElementById("tab-overview").hidden = tab !== "overview";
  document.querySelectorAll("#tab-subjects > div").forEach(el => el.hidden = true);
  document.getElementById("tab-diagnosis").hidden = tab !== "diagnosis";
  if (tab === "diagnosis") {
    if (!diag.loaded) loadDiagnosis(null);
    if (location.hash !== "#diagnosis") history.replaceState(null, "", "#diagnosis");
  } else if (tab !== "overview") {
    if (!rendered[tab]) { rendered[tab] = true; renderSubject(tab); }
    const el = document.getElementById("tab-" + tab);
    if (el) el.hidden = false;
    showView(tab, view && document.getElementById(`tab-${tab}-view-${view}`) ? view : subjectView[tab] || "wrong");
  } else if (("#" + tab) !== location.hash) {
    history.replaceState(null, "", "#" + tab);
  }
  // 懒渲染的图在容器刚显示后量到尺寸
  requestAnimationFrame(() => charts.forEach(c => c.resize()));
}

function fail(message) {
  document.getElementById("meta").textContent = "";
  const box = document.getElementById("error");
  box.hidden = false;
  box.textContent = message;
}

fetch("data.json")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("http " + r.status)))
  .then(render)
  .catch(() => fail("进度数据暂时拿不到（数据库未配置、不可用或尚未初始化）。内网稍后再试，或先在内网用驾考客户端连接一次以建表。"));
</script>
