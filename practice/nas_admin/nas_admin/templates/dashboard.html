{% extends base_template %}

{% block content %}
<style>
  .driver-link:hover { background: rgba(37,99,235,.14); }
</style>
<div style="padding: 1rem; font-size: 18px;">
  <h3 style="margin: 0 0 1rem; font-size: 24px;">AthenaNAS 后台管理</h3>

  <div style="font-size: 18px; opacity: .65; margin: 0 0 .5rem;">实践统计</div>
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
    <a class="driver-link" href="/driver/" style="display: flex; flex-direction: column; justify-content: center; gap: .35rem; border: 1px solid rgba(37,99,235,.45); border-radius: .5rem; padding: .9rem 1rem; text-decoration: none; color: inherit; background: rgba(37,99,235,.06);">
      <strong style="font-size: 21px;">驾考进度</strong>
      <span style="font-size: 17px; opacity: .85;">练习日历 · 成绩曲线 · 成就墙</span>
      <span style="font-size: 17px; color: #2563eb;">打开 →</span>
    </a>
  </div>

  <hr style="border: none; border-top: 1px solid rgba(128,128,128,.3); margin: 1.25rem 0 1rem;">

  <div style="font-size: 18px; opacity: .65; margin: 0 0 .5rem;">系统信息</div>
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
    {% for title, value in cards %}
    <div style="border: 1px solid rgba(128,128,128,.35); border-radius: .5rem; padding: .9rem 1rem;">
      <div style="font-size: 17px; opacity: .7; margin-bottom: .3rem;">{{ title }}</div>
      <div style="font-size: 20px; word-break: break-all;">{{ value }}</div>
    </div>
    {% endfor %}
  </div>
  <p style="margin-top: 1.5rem; opacity: .7; font-size: 17px;">
    骨架阶段：认证用 FAB 自带登录（右上角），功能页从这里长出来。
    探活：<a href="/api/health">/api/health</a>
  </p>
</div>
{% endblock %}
