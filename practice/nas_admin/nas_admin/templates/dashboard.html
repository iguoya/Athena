{% extends base_template %}

{% block content %}
<div style="padding: 1rem; font-size: 16px;">
  <h3 style="margin: 0 0 1rem; font-size: 20px;">AthenaNAS 后台管理</h3>
  <a href="/driver/" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 0 0 1rem; padding: .9rem 1.1rem; border: 1px solid rgba(37,99,235,.4); border-left: 4px solid #2563eb; border-radius: .5rem; text-decoration: none; color: inherit;">
    <span><strong style="font-size: 18px;">驾考进度</strong><span style="opacity: .7; font-size: 15px; margin-left: .6rem;">练习日历 · 成绩曲线 · 成就墙</span></span>
    <span style="opacity: .6;">打开 →</span>
  </a>
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem;">
    {% for title, value in cards %}
    <div style="border: 1px solid rgba(128,128,128,.35); border-radius: .5rem; padding: .9rem 1rem;">
      <div style="font-size: 15px; opacity: .7; margin-bottom: .3rem;">{{ title }}</div>
      <div style="font-size: 18px; word-break: break-all;">{{ value }}</div>
    </div>
    {% endfor %}
  </div>
  <p style="margin-top: 1.5rem; opacity: .7; font-size: 15px;">
    骨架阶段：认证用 FAB 自带登录（右上角），功能页从这里长出来。
    探活：<a href="/api/health">/api/health</a>
  </p>
</div>
{% endblock %}
