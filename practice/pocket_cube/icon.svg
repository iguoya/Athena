<?xml version="1.0" encoding="UTF-8"?>
<!--
  PocketCube 2 阶魔方的图标。
  Fluent Emoji 里没有魔方，按它的画风自己画：等距视角三面各 2×2 贴纸，渐变加左上高光。
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面三处同源
  （ADR 0065）。改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
<title>PocketCube</title>
<defs>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF27A"/><stop offset="1" stop-color="#FFC400"/></linearGradient>
<linearGradient id="gLeft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6B"/><stop offset="1" stop-color="#D9261C"/></linearGradient>
<linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CB2FF"/><stop offset="1" stop-color="#1257D6"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3F57"/><stop offset="1" stop-color="#171925"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
