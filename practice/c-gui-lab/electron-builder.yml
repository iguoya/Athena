# electron-builder 配置：Windows NSIS 一档（macOS / Linux 按 ADR 0049 排除：
# 原生程序绑定 Win32/DX11/GDI，launcher 的 APPS 表也只认 .exe）。
#
# 应用 JS 代码进 asar；七个原生 exe 与收好的 MinGW 运行库 DLL 走
# extraResources 放 resources/native——exe 不能从 asar 里 spawn（launcher/main.js
# 的 NATIVE_ROOT 在打包态指向这里）。filter 白名单只收运行时需要的文件，
# CMake 的 CMakeFiles/、cmake_install.cmake、静态库（liblvgl_ext.a）与
# imgui.ini（运行时自生成）都挡在外面；style.css 是 gtk-style 的运行时资源，
# 必须带上。
appId: app.athena.c-gui-lab
productName: C GUI Lab
executableName: athena-c-gui-lab
directories:
  output: dist
asar: true
files:
  - package.json
  - launcher/**/*
extraResources:
  - from: build/apps
    to: native
    filter:
      - "**/*.exe"
      - "**/*.dll"
      - "**/*.css"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: athena-c-gui-lab-${version}-windows-x64-setup.${ext}
