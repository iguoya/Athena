[package]
name = "athena-course-shell"
version = "0.1.0"
description = "Athena 课程应用共用的 Tauri 壳：内容路径、本地进度库、C++ 即时编译运行（ADR 0161）"
authors = ["Athena"]
edition = "2021"

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# bundled：自带 SQLite 源码一起编，不依赖目标机器上有没有 libsqlite3。
# Windows 上没有系统 sqlite3，链系统库这条路走不通（ADR 0047）。
rusqlite = { version = "0.41", features = ["bundled"] }
dirs-next = "2"
