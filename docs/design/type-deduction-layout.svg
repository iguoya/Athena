<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1320" viewBox="0 0 900 1320" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .ink { fill: #212529; }
    .muted { fill: #6c757d; }
    .h { font-size: 19px; font-weight: 700; fill: #212529; }
    .n { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .t { font-size: 15px; fill: #343a40; }
    .s { font-size: 13.5px; fill: #6c757d; }
    .card { fill: #ffffff; stroke: #ced4da; stroke-width: 1.4; }
    .prose { fill: #e9ecef; }
    .figure { fill: #d1e7dd; stroke: #198754; stroke-width: 1.2; }
    .quiz { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.2; }
    .lab { fill: #cfe2ff; stroke: #0a58ca; stroke-width: 1.2; }
  </style>

  <rect width="900" height="1320" fill="#f8f9fa"/>
  <text x="40" y="46" class="h" font-size="22">类型推导学习页 · 纵向编排方案</text>
  <text x="40" y="72" class="s">开发用布局方案，不是应用截图。只表达阅读顺序与局部图文关系，不固定屏幕高度、分栏比例或一屏容量。</text>

  <!-- 阅读顺序轴 -->
  <line x1="62" y1="108" x2="62" y2="1258" stroke="#ced4da" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="40" y="1290" class="s">↓ 一条连续阅读线；小节标题只用于定位</text>

  <!-- 1 为什么需要推导 -->
  <circle cx="62" cy="140" r="15" fill="#0a58ca"/><text x="62" y="146" class="n" text-anchor="middle">1</text>
  <rect x="100" y="108" width="760" height="120" rx="10" class="card"/>
  <text x="124" y="138" class="h">为什么需要推导</text>
  <rect x="124" y="152" width="430" height="12" rx="6" class="prose"/>
  <rect x="124" y="172" width="470" height="12" rx="6" class="prose"/>
  <rect x="124" y="192" width="330" height="12" rx="6" class="prose"/>
  <rect x="600" y="146" width="236" height="62" rx="8" class="figure"/>
  <text x="718" y="182" class="t" text-anchor="middle">初始化信息 → 推导 → 意图</text>
  <text x="124" y="218" class="s">情境讲解交代学习价值；不以“先猜输出”开场</text>

  <!-- 2 推导没有替你决定什么 -->
  <circle cx="62" cy="278" r="15" fill="#0a58ca"/><text x="62" y="284" class="n" text-anchor="middle">2</text>
  <rect x="100" y="246" width="760" height="196" rx="10" class="card"/>
  <text x="124" y="276" class="h">推导没有替你决定什么</text>
  <rect x="124" y="292" width="360" height="12" rx="6" class="prose"/>
  <rect x="124" y="312" width="330" height="12" rx="6" class="prose"/>
  <rect x="124" y="336" width="360" height="74" rx="8" fill="#f1f3f5" stroke="#dee2e6"/>
  <text x="140" y="360" class="t" font-family="ui-monospace, Menlo, monospace">auto        copy  = original;</text>
  <text x="140" y="381" class="t" font-family="ui-monospace, Menlo, monospace">auto&amp;       alias = original;</text>
  <text x="140" y="402" class="t" font-family="ui-monospace, Menlo, monospace">const auto&amp; view  = original;</text>
  <rect x="512" y="292" width="324" height="118" rx="8" class="figure"/>
  <rect x="540" y="330" width="96" height="44" rx="6" fill="#ffffff" stroke="#198754"/>
  <text x="588" y="358" class="t" text-anchor="middle">original</text>
  <rect x="712" y="330" width="96" height="44" rx="6" fill="#ffffff" stroke="#198754"/>
  <text x="760" y="358" class="t" text-anchor="middle">copy</text>
  <text x="674" y="316" class="s" text-anchor="middle">对象身份示意图</text>
  <text x="674" y="396" class="s" text-anchor="middle">名字用标签，不画成第二个整数格</text>
  <text x="124" y="432" class="s">三段讲解各自紧邻对应图示，读完再给简短对照表</text>

  <!-- 3 值怎样变化 -->
  <circle cx="62" cy="492" r="15" fill="#0a58ca"/><text x="62" y="498" class="n" text-anchor="middle">3</text>
  <rect x="100" y="460" width="760" height="232" rx="10" class="card"/>
  <text x="124" y="490" class="h">值怎样变化 · 可控逐步演示</text>
  <text x="124" y="512" class="s">概念演示：按已核对的语言规则编排，不代表真实内存或耗时</text>
  <rect x="124" y="524" width="712" height="104" rx="8" class="figure"/>
  <text x="480" y="580" class="t" text-anchor="middle">整行宽的对象图（Cairo 自绘）· 每步只改变一个条件</text>
  <rect x="124" y="640" width="88" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="168" y="660" class="t" text-anchor="middle">上一步</text>
  <rect x="220" y="640" width="88" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="264" y="660" class="t" text-anchor="middle">播放</text>
  <rect x="316" y="640" width="88" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="360" y="660" class="t" text-anchor="middle">下一步</text>
  <rect x="412" y="640" width="88" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="456" y="660" class="t" text-anchor="middle">重置</text>
  <text x="520" y="660" class="s">步骤 n / 6 + 当前步骤解释；可展开静态状态表</text>

  <!-- 4 学后小练习 -->
  <circle cx="62" cy="742" r="15" fill="#ffc107"/><text x="62" y="748" class="n" text-anchor="middle" fill="#212529">4</text>
  <rect x="100" y="710" width="760" height="132" rx="10" class="card"/>
  <text x="124" y="740" class="h">学后小练习</text>
  <rect x="124" y="754" width="712" height="72" rx="8" class="quiz"/>
  <text x="144" y="778" class="t">换一个条件：通过 original 改成 120，view 读到多少？</text>
  <text x="144" y="802" class="s">学后确认题，不作前测、不更新熟练度；不答题也能继续阅读，反馈解释原因</text>

  <!-- 5 对照真实实验 -->
  <circle cx="62" cy="892" r="15" fill="#0a58ca"/><text x="62" y="898" class="n" text-anchor="middle">5</text>
  <rect x="100" y="860" width="760" height="120" rx="10" class="card"/>
  <text x="124" y="890" class="h">对照真实实验</text>
  <rect x="124" y="904" width="470" height="12" rx="6" class="prose"/>
  <rect x="124" y="924" width="420" height="12" rx="6" class="prose"/>
  <text x="124" y="962" class="s">先说明进入后看哪里，返回后解释观察时点差异</text>
  <rect x="668" y="900" width="168" height="44" rx="8" class="lab"/>
  <text x="752" y="928" class="t" text-anchor="middle">验证 auto →</text>

  <!-- 6 用于真实选择 -->
  <circle cx="62" cy="1030" r="15" fill="#0a58ca"/><text x="62" y="1036" class="n" text-anchor="middle">6</text>
  <rect x="100" y="998" width="760" height="152" rx="10" class="card"/>
  <text x="124" y="1028" class="h">用于真实选择</text>
  <rect x="124" y="1042" width="330" height="92" rx="8" class="figure"/>
  <text x="289" y="1076" class="t" text-anchor="middle">选型流程图</text>
  <text x="289" y="1100" class="s" text-anchor="middle">分支条件与适用前提同图可读</text>
  <text x="484" y="1064" class="t">① 保存当前值供以后比较</text>
  <text x="484" y="1090" class="t">② 修改已有的那个整数</text>
  <text x="484" y="1116" class="t">③ 只观察，禁止在本处赋值</text>
  <text x="484" y="1140" class="s">让读者说明依据，不再做机械选择题</text>

  <!-- 7 小结与下一单元 -->
  <circle cx="62" cy="1200" r="15" fill="#198754"/><text x="62" y="1206" class="n" text-anchor="middle">7</text>
  <rect x="100" y="1168" width="760" height="90" rx="10" class="card"/>
  <text x="124" y="1198" class="h">小结与下一单元</text>
  <rect x="124" y="1212" width="470" height="12" rx="6" class="prose"/>
  <text x="124" y="1246" class="s">先讲判断方法与易错点，再引出 decltype 的目的；边界段默认展开，不折叠</text>
  <rect x="668" y="1196" width="168" height="40" rx="8" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="752" y="1221" class="t" text-anchor="middle">decltype 单元</text>
</svg>
