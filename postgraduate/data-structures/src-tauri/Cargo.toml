[package]
name = "athena-data-structures"
version = "0.1.0"
description = "Athena 数据结构与算法独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_data_structures_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
athena-course-shell = { path = "../../../packages/athena-course-shell" }
tauri = { workspace = true }
# 插件在共用 crate 里注册，但 tauri-build 只从应用的**直接依赖**里收集插件权限；
# 删掉它，capabilities/default.json 里的 "opener:default" 就找不到，构建失败。
tauri-plugin-opener = "2"
