<?xml version="1.0" encoding="UTF-8"?>
<!--
  启动器图块用的图标：北极星（八芒星），白字形。
  总是配 app.json 的 icon.accent 作底色，所以颜色定死为白。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="#ffffff">
  <title>北极星</title>
  <!-- 主十字 -->
  <path d="M12 2.2 L13.1 10.9 L21.8 12 L13.1 13.1 L12 21.8 L10.9 13.1 L2.2 12 L10.9 10.9 Z"/>
  <!-- 斜十字，稍短，合成八芒星 -->
  <path d="M12 4.8 L12.7 11.3 L19.2 12 L12.7 12.7 L12 19.2 L11.3 12.7 L4.8 12 L11.3 11.3 Z" opacity="0.92"/>
  <circle cx="12" cy="12" r="1.6"/>
</svg>
