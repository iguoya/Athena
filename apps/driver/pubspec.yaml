name: athena_driver
description: 驾考学习（科目一与科目四）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  sqflite_common_ffi: ^2.3.6
  sqlite3_flutter_libs: ^0.5.39
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - content/curriculum.json
    - content/sources/catalog.json
    - content/signs.json
    - content/questions/subject1.json
    - content/questions/subject4.json
    - content/images/subject1/
