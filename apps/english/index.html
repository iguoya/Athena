<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英语学习</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- 结构照搬 docs/ui-sketch/english-learning-roadmap.html：class 名与层级保持一致，
         样式表才能原样套用。静态文案留在这里，按数据变化的部分留空容器给 main.ts。 -->
    <div id="english-stage-map" data-view="overview">
      <section class="english-window">
        <header class="english-topbar">
          <div class="english-brand">
            <div class="english-mark">E2</div>
            <div>
              <h1 id="app-title">英语学习</h1>
              <p class="english-subtitle" id="app-subtitle"></p>
            </div>
          </div>
          <div class="english-actions">
            <button type="button" class="english-back-stage" id="back-stage">← 返回路线</button>
            <label class="english-voice-pick english-overview-action">语速
              <select id="voice-rate" aria-label="朗读语速"></select>
            </label>
            <label class="english-voice-pick english-overview-action">美式音色
              <select id="voice-name" aria-label="美式英语朗读音色"></select>
            </label>
            <button type="button" class="english-overview-action" id="voice-try">试听</button>
            <button type="button" class="english-review-button english-overview-action" id="btn-due">今日复习 0</button>
            <button type="button" class="english-overview-action" id="btn-mistakes">错题本 0</button>
            <button type="button" class="english-overview-action" id="btn-continue" data-primary>继续当前任务</button>
          </div>
        </header>

        <div class="english-body">
          <aside class="english-roadmap" aria-label="能力路线">
            <div class="english-roadmap-title">能力路线</div>
            <div class="english-stage-list" id="stage-list"></div>
            <div class="english-target" id="endpoint"></div>
          </aside>

          <main class="english-main">
            <div class="english-current-head">
              <div>
                <h2 id="stage-title"></h2>
                <p class="english-goal" id="stage-goal"></p>
              </div>
              <div class="english-stage-badge" id="stage-badge"></div>
            </div>

            <section class="english-outcomes" id="outcomes" aria-label="学习成果"></section>

            <section class="english-gate" id="gate" aria-label="阶段通过条件"></section>

            <div class="english-tracks" id="tracks"></div>

            <div class="english-criteria" aria-label="学习约定">
              <div class="english-criterion">
                <strong>练习与考核分开</strong>
                <span>练习即时解析；考核使用独立平行材料，交卷后统一反馈。</span>
              </div>
              <div class="english-criterion">
                <strong>教材综合取用</strong>
                <span>词频、公开材料和教辅摘录一起权衡，题仍自写。</span>
              </div>
              <div class="english-criterion">
                <strong>听说读写协同</strong>
                <span>听原声或朗读、跟读回听、阅读判断，再口述或写下来。</span>
              </div>
              <div class="english-criterion">
                <strong>看得见成果</strong>
                <span>连续天数、稳住的条目和徽章都记在上面，不是为了打卡。</span>
              </div>
            </div>

            <div class="english-lock-note" id="lock-note" role="status"></div>
          </main>
        </div>

        <div class="english-practice" id="practice">
          <aside class="english-practice-side" aria-label="本课条目">
            <div class="english-practice-summary">
              <strong id="practice-list-title"></strong>
              <span id="practice-count"></span>
            </div>
            <div class="english-item-list" id="item-list"></div>
          </aside>
          <main class="english-practice-main">
            <p class="english-crumb" id="practice-crumb"></p>
            <h2 id="practice-title"></h2>
            <p class="english-practice-goal" id="practice-goal"></p>
            <blockquote class="english-context" id="practice-context"></blockquote>
            <section class="english-question" id="question" aria-live="polite"></section>
          </main>
        </div>

        <div class="english-mistakes" id="mistakes">
          <aside class="english-mistake-side" aria-label="错题列表">
            <div class="english-practice-summary">
              <strong>错题本</strong>
              <span id="mistake-count"></span>
            </div>
            <div class="english-item-list" id="mistake-list"></div>
          </aside>
          <main class="english-mistake-main" id="mistake-detail"></main>
        </div>
      </section>
    </div>
  </body>
</html>
