[package]
name = "athena-english"
version = "0.1.0"
description = "Athena 英语学习独立应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_english_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
dirs-next = "2"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
