[package]
name = "lumi"
version = "0.1.0"
description = "拾阶 · Ascent 英语学习"
edition = "2021"

[lib]
name = "lumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
