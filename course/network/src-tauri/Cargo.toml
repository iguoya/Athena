[package]
name = "athena-network"
version = "0.1.0"
description = "Athena 计算机网络与信息安全 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_network_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
# 网络实验的异步运行时：真 socket 端点、并发收发。
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util"] }
