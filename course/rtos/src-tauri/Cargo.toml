[package]
name = "athena-rtos"
version = "0.1.0"
description = "Athena 实时操作系统（RTOS） 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_rtos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
# 串口观测：真板 FreeRTOS 的任务输出经串口看（白名单枚举/收发）。
serialport = "4"
