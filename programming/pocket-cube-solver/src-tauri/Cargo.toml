[package]
name = "athena-pocket-cube-solver"
version = "0.1.0"
description = "Athena 二阶魔方：从初学者的层先法出发，按章节写出能解任意状态的程序，教程壳用 Tauri"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_pocket_cube_solver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
