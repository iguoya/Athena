[package]
name = "athena-python"
version = "0.1.0"
description = "Athena Python 与 AI 工具链 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_python_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
