[package]
name = "athena-launcher-webui"
version = "0.1.0"
description = "Athena 启动器 Web 前端（Tauri 2 + React + Three.js，ADR 0125）"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_launcher_webui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建的内嵌页面开关：`tauri build` 自动启用；直接 cargo build --release 时要手动加
# --features custom-protocol，否则二进制工作在 dev 模式、运行时去连 vite 开发服务器。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 启动器的清单发现、布局纯函数、进程编排全部来自 core（ADR 0125：执行路径只有 core 一处）。
launcher-core = { path = "../../core" }

[profile.dev]
debug = 1
incremental = true
