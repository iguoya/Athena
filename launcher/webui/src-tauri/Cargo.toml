[package]
name = "athena-launcher-webui"
version = "0.1.0"
description = "Athena 启动器 Web 前端（Tauri 2 + React + Three.js，ADR 0125）"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_launcher_webui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建的内嵌页面开关：`tauri build` 自动启用；直接 cargo build --release 时要手动加
# --features custom-protocol，否则二进制工作在 dev 模式、运行时去连 vite 开发服务器。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
# 启动器的清单发现、布局纯函数、进程编排全部来自 core（ADR 0125：执行路径只有 core 一处）。
launcher-core = { path = "../../core" }
tauri-plugin-autostart = "2"
# 安装模式下没装的应用点击后指路 Releases 页（ADR 0173）。
tauri-plugin-opener = "2"
# 应用内自动更新（ADR 0172、0173）：与其它 Tauri 应用同一套，版本在 launcher 工作区的公共依赖表。
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# 裸二进制没有 .app，Dock 不读 Info.plist。运行时给 NSApplication 设虎头。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = "0.3"
