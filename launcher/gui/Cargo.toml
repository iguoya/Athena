[package]
name = "athena-launcher"
description = "Athena 跨平台启动器：一张列表列出全部学习应用，点一下就打开"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
launcher-core = { path = "../core" }
# unstable-winit-030：Windows 任务栏要的大图标（ICON_BIG）Slint 不会设，得拿到底层
# winit 窗口自己补（见 src/app_icon.rs）。
slint = { version = "1.17", features = ["unstable-winit-030"] }
# 托盘与菜单：三平台同一套 API（macOS NSStatusItem、Windows Shell_NotifyIcon、
# Linux StatusNotifierItem / AppIndicator）。事件走全局 channel，所以不必和
# Slint 的事件循环做深度集成，在定时器里 try_recv 就行。
tray-icon = "0.25"
muda = "0.20"
# 各应用的图标是 SVG，运行时渲染成位图交给界面。
resvg = "0.45"
opener = "0.8.5"

[target.'cfg(target_os = "macos")'.dependencies]
# 两件事：把窗口带到眼前（macOS 不会自动把别的 Space 上的窗口移过来，应用不
# activate 的话，点了托盘菜单像是没反应）；给裸二进制设 Dock 图标（没有 .app
# bundle 就没有 Info.plist 指路，Dock 只会显示通用的 exec 图标）。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 的托盘必须活在 GTK 线程里，这层依赖只为那条路径。
gtk = "0.18"

[build-dependencies]
slint-build = "1.17"
# 从 tiger.svg 渲虎头：托盘、标题栏、任务栏共用同一份。
resvg = "0.45"

[target.'cfg(target_os = "windows")'.build-dependencies]
# 把同一份虎头编进 exe 资源段。标题栏走 Window.icon，
# 任务栏 / 资源管理器认这个；两边像素来源相同。
ico = "0.5"
winresource = "0.1"
