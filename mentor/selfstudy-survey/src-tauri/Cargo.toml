[package]
name = "athena-selfstudy-survey"
version = "0.1.0"
description = "Athena 自考专业调查：计算机、电子信息类自考本科全国调查"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_selfstudy_survey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
# conf 有了 plugins 节后，generate_context! 展开会用到 ::serde_json
serde_json = { workspace = true }
tauri-plugin-opener = "2"
