[package]
name = "athena-polaris"
version = "0.2.0"
description = "北极星：计算机与电子信息的路线图与指南针"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_polaris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
# 保证只有一个北极星窗口（ADR 0007 的要求，ADR 0015 决策 4 换了机制）。
tauri-plugin-single-instance = "2"
# 出处链接要在系统浏览器里打开核对（ADR 0013 决策 7）；webview 里直接导航会把应用带走。
tauri-plugin-opener = "2"
