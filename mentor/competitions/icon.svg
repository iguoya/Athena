<?xml version="1.0" encoding="UTF-8"?>
<!--
  competitions（赛历）的应用图标：挂绶带的奖牌，竞赛的通用意象。本应用自绘，无第三方素材。
  改完跑 `launcher icons` 重新生成 icon.renders 声明的位图（ADR 0065 三处同源）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <!-- 绶带：左红右蓝交叉 -->
  <polygon points="150,40 236,40 300,232 214,232" fill="#DC2626"/>
  <polygon points="362,40 276,40 212,232 298,232" fill="#2563EB"/>
  <polygon points="276,40 362,40 330,136 290,100" fill="#1D4ED8"/>
  <!-- 奖牌 -->
  <circle cx="256" cy="330" r="142" fill="url(#gold)"/>
  <circle cx="256" cy="330" r="108" fill="none" stroke="#FFFBEB" stroke-opacity="0.7" stroke-width="12"/>
  <polygon points="256,250 279,303 336,307 292,344 306,400 256,370 206,400 220,344 176,307 233,303" fill="#FFFBEB"/>
</svg>
