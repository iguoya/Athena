[package]
name = "athena-mathematics-compass"
version = "0.1.0"
description = "Athena 数学罗盘：数学学习导引"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_mathematics_compass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
# conf 有了 plugins 节后，generate_context! 展开会用到 ::serde_json
serde_json = { workspace = true }
tauri-plugin-opener = "2"
