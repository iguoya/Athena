name: 新增应用提议
description: 想新开一门课程或一个项目应用
title: "[提议] "
labels: ["应用提议"]
body:
  - type: input
    id: what
    attributes:
      label: 想做什么
      description: 一句话，例如「Rust 程序设计」
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 是哪一类
      description: 判据见 AGENTS.md：要不要教会人什么、要不要证明学习者进步了。
      options:
        - 学习应用（要教会、要证明进步）
        - 图谱/参考类（只呈现信息供查阅）
        - 项目应用（practice/，做能跑的东西）
        - 还没想好
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 和现有应用的边界在哪里，为什么不能并入已有的。
