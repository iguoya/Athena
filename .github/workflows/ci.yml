name: CI

# 什么时候跑：**推送即跑**，纯文档改动除外（ADR 0050）。
#
# 早跑一次的价值不只是抓 bug，更是对开发过程本身的约束——知道每次提交都会被
# 十几个平台组合验一遍，写的时候就不会把「先推上去回头再说」当默认选项。
# 成本确实存在（三个 Tauri 应用各要在三平台编一遍 Rust 壳），但 cargo 缓存之后
# 只有首次昂贵；真正的纯浪费是改一行 Markdown 也拉起全部 runner，所以用
# paths-ignore 把那类提交排除掉，其余照跑。
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 跨应用的内容出处检查（ADR 0043）：纯文本规则，和平台无关，跑一个就够。
  sources:
    name: 内容出处
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify
        run: python3 scripts/check.py --sources-only

  # C++ 教程：GTK4 + Meson。三个平台各装各的依赖，跑的是同一条 Python 入口。
  cpp-macos:
    name: C++ 教程（macOS）
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg

      - name: Verify
        run: python3 scripts/check.py cpp --build-dir build --buildtype debugoptimized

  # 这一档不按 ADR 0051 降级：apps/cpp 的 Windows 已经被 ADR 0049 排除，
  # macOS 与 Ubuntu 是它仅有的两个支持平台。再把 Ubuntu 放松，就只剩一个平台
  # 在验证了——声明支持就要验证（ADR 0047），这跟优先级排序不冲突。
  cpp-ubuntu:
    name: C++ 教程（Ubuntu）
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler \
            librsvg2-common xvfb

      - name: Verify
        # GTK 资源测试要构造控件，需要一个显示后端；无头 CI 用 xvfb 提供。
        run: xvfb-run -a python3 scripts/check.py cpp --build-dir build --buildtype debugoptimized

  # apps/cpp 不支持 Windows：GTK4 在 MSYS2 上卡在 giomm 2.86 与 glib 2.90 的
  # 头文件冲突，是上游问题、不由我们决定，成本过高就整体排除（ADR 0049）。
  # 这里不留探测 job——一个永远红着的"实验性"格子不产生决策价值，只让人以为
  # 我们还在支持 Windows。真要重新评估，那该是一次有意识的决定。

  # 留着当探测位，监测的是一个**具体且预期会变**的条件：MSYS2 把 glibmm 更新到
  # 2.89+（ADR 0049 实测更正）。
  #
  # 属于我们自己的两处 POSIX 专有写法（LC_MESSAGES、M_PI）已经修完。剩下的不是
  # 我们的问题，也不是上游没修——glib 2.89.2 起若干类型改成 final type，glibmm
  # 2.89.0（2026-08-10）就已经跟着改了包装方式。卡住的是 MSYS2 仓库里 glib 已到
  # 2.90、glibmm 还停在 2.86 这个脱节窗口。包一跟上，这一格自己就绿了。
  #
  # meson.build 里加了 glib 与 glibmm 的配套检查，所以现在会在**配置期**直接说
  # 「两者不配套」，而不是到编译期吐一串看不懂的 conflicting declaration。
  #
  # 这和 ADR 0049 说的「不留假装在支持的探测位」不冲突：那条针对的是没人读、
  # 不产生决策价值的格子；这里监测的条件明确，判据也明确。
  cpp-windows:
    name: C++ 教程（Windows，探测上游）
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-python

      - name: Verify
        run: python scripts/check.py cpp --build-dir build --buildtype debugoptimized

  # C 语言教程：Qt Quick + CMake。跑的是应用自己的 scripts/check.py。
  c:
    name: C 语言教程（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04]
    # Linux 降级（ADR 0051）。macOS 这一档仍是正式门槛，Windows 见下一个 job。
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6 cmake ninja

      - name: Install Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev

      - name: Verify
        # Homebrew 的 Qt 是 keg-only，不在默认搜索路径里；CMAKE_PREFIX_PATH
        # 指过去即可，不必把 Qt 灌进全局 PATH。
        run: python3 scripts/check.py c
        env:
          CMAKE_PREFIX_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/qt@6' || '' }}

  # Windows 上的 Qt 走 aqtinstall：官方安装器是交互式的，CI 里用不了，而
  # aqtinstall 是个 pip 包，不必引第三方 action。
  #
  # 这个 job 起初是 continue-on-error 的探测位，2026-09-15 修掉两处问题后转正：
  # 一是给 aqt 传了 -m qtdeclarative（Qt 6 里 Quick 属于基础包，不是可选 module），
  # 二是 runner 的 PATH 里有 MinGW，CMake 挑中 g++ 去链 MSVC 构建的 Qt。
  # Windows 是优先平台（ADR 0051），它的 job 就该是正式门槛。
  c-windows:
    name: C 语言教程（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_VERSION: "6.8.1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC
        # 装的是 MSVC 构建的 Qt（win64_msvc2022_64），但 runner 的 PATH 里还有
        # MinGW，CMake 会挑中 g++，链接时撞上符号修饰不兼容：
        # `undefined reference to __imp__Z9qt_assertPKcS0_i`。把 MSVC 的环境
        # 导进来，CMake 才会选 cl.exe。
        #
        # 这里引了第三方 action，和上面 Qt 用 pip 包 aqtinstall 的取向不同——
        # 设置 MSVC 环境没有同等简洁的替代，手写 vcvars 导出要自己维护一套
        # 变量过滤，反而更脆。
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt and Ninja
        # Ninja 是单配置生成器：产物落在 build/ 而不是 build/Debug/，和另外
        # 两个平台、和 app.json 的 dev.run 保持同一个位置。
        #
        # 不传 -m qtdeclarative：Qt 6 里 Quick/Qml 属于基础包，不是可选 module，
        # 传了 aqt 会报「packages not found while parsing XML」直接失败。
        run: |
          python -m pip install --quiet aqtinstall ninja
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O ${{ github.workspace }}\Qt

      - name: Verify
        run: python scripts/check.py c
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\Qt\6.8.1\msvc2022_64

  # 三个 Tauri 应用：前端 + Rust 壳。每个应用跑自己的 scripts/check.py，
  # 和本地是同一条命令（ADR 0007）。
  tauri:
    name: ${{ matrix.app }}（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [dsa, english, mathematics]
        os: [macos-15, windows-latest, ubuntu-26.04]
    # Linux 降级：回归了报出来，但不阻塞整体结论（ADR 0051）
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install Tauri system dependencies (Ubuntu)
        # Linux 上 Tauri 的 WebView 是系统 WebKitGTK，得先装；macOS 与 Windows
        # 用系统自带的 WKWebView / WebView2，不需要这一步。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libgtk-3-dev libayatana-appindicator3-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/${{ matrix.app }}/src-tauri/target
          key: tauri-${{ matrix.app }}-${{ matrix.os }}-${{ hashFiles(format('apps/{0}/src-tauri/Cargo.lock', matrix.app)) }}

      - name: Verify
        run: python3 scripts/check.py ${{ matrix.app }}

  # 驾驶学习：Flutter 桌面。三个平台各编各的桌面目标，入口仍是应用自己的
  # scripts/check.py（ADR 0007）。
  driving:
    name: 驾驶学习（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop targets
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Verify
        run: python3 scripts/check.py driving

  # 启动器：纯 Rust，三平台同一套源码。
  launcher:
    name: 启动器（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-26.04]
    # Linux 降级：回归了报出来，但不阻塞整体结论（ADR 0051）
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libfontconfig1-dev libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/target
          key: launcher-${{ matrix.os }}-${{ hashFiles('launcher/Cargo.lock') }}

      - name: Build
        run: cargo build --manifest-path launcher/Cargo.toml --all-targets
