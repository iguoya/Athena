name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C++ 教程：GTK4 + Meson。三个平台各装各的依赖，跑的是同一条 Python 入口。
  cpp-macos:
    name: C++ 教程（macOS）
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg

      - name: Verify
        run: python3 scripts/check.py cpp --build-dir build --buildtype debugoptimized

  cpp-ubuntu:
    name: C++ 教程（Ubuntu）
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler \
            librsvg2-common xvfb

      - name: Verify
        # GTK 资源测试要构造控件，需要一个显示后端；无头 CI 用 xvfb 提供。
        run: xvfb-run -a python3 scripts/check.py cpp --build-dir build --buildtype debugoptimized

  # Windows 上的 GTK4 构建目前卡在上游：MSYS2 现行的 giomm 2.86 与 glib 2.90
  # 头文件冲突（GDBusActionGroupClass 重复声明），和本仓库的代码无关——依赖
  # 全部找得到，Blueprint 也编得过，倒在 gtkmm 自己的头文件上。保留这个 job
  # 持续探测，上游修好就会自动变绿；在那之前不让它阻塞整体结论。
  cpp-windows:
    name: C++ 教程（Windows，实验性）
    runs-on: windows-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-python

      - name: Verify
        run: python scripts/check.py cpp --build-dir build --buildtype debugoptimized

  # 启动器：纯 Rust，三平台同一套源码。
  launcher:
    name: 启动器（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libfontconfig1-dev libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/target
          key: launcher-${{ matrix.os }}-${{ hashFiles('launcher/Cargo.lock') }}

      - name: Build
        run: cargo build --manifest-path launcher/Cargo.toml --all-targets
