name: CI

# 什么时候跑：**显式触发**（ADR 0064，取代 ADR 0050 的「推送即跑」）。
#
# - 手动：`gh workflow run ci.yml`（全量）或 `gh workflow run ci.yml -f app=driver`
#   （只跑一个应用），也可以在 Actions 页面点 Run workflow 选。
# - 打版本 tag：发布前全量验一遍，tag 本身就是显式动作。
#
# 日常提交不触发：提交前该走的是本地 `python3 scripts/check.py`（ADR 0007），
# 远程矩阵留给「要确认跨平台」的时候——改了平台相关代码、动了依赖、准备发布。
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      app:
        description: 只跑哪个应用（all 为全量，sources 只跑跨应用检查）
        type: choice
        default: all
        options: [all, sources, comms-console, c-plus-plus, chinese-chess, snake, pocket-cube-solver, qt, gtkmm-lab, pocket_cube, cpp, machine, polaris, data-structures, algorithms, mathematics, ascent, math-tools, gtkmm, driver, software, nas_admin, launcher, c-gui-lab, embedded, database, design-patterns, os, network, firmware, microcontroller, rtos, linux, organization, cs408, python, machine-learning, deep-learning, llm-app, llm-finetune, competitions, earth, edge-ai, jiuzhou, octave-manual, selinger-linear-algebra, siefken-linear-algebra, sympy-tutorial, chen-linear-algebra, axler-linear-algebra, linear-algebra, advanced-mathematics]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Windows 上 Actions 的 Python 管道默认 cp1252，打印中文会 UnicodeEncodeError
# （2026-10-07 的 gtkmm、math-tools 就是这样失败的）。只改 stdio，不动文件路径。
env:
  PYTHONIOENCODING: utf-8

jobs:
  # 跨应用检查：内容出处（ADR 0043）、skill 两处一致、GitHub 工作流。纯文本规则，
  # 和平台无关，跑一个就够。
  sources:
    name: 跨应用检查
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # 发布计划演练要读上一个 tag 的各应用清单
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 版本与本地 winget 装的一致；官方脚本把可执行文件下到当前目录
      - name: Install actionlint and shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify
        run: python3 scripts/check.py --sources-only

      # 发布计划演练（ADR 0171）：release.yml 只在打 tag 时才跑、没法单独试，所以把它的
      # plan 作业对最近一个 tag 演练一遍——矩阵形状或清单坏了，发版前就能在这里看到。
      - name: Rehearse release plan
        shell: bash
        run: |
          base="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || true)"
          if [[ -z "$base" ]]; then
            echo "::notice::仓库里还没有 v*.*.* tag，跳过演练"
            exit 0
          fi
          python3 scripts/release_plan.py matrix --base "$base" --head HEAD > "$RUNNER_TEMP/plan.json"
          python3 - "$RUNNER_TEMP/plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          need = {"app", "root", "os", "platform", "bundles"}
          for key in ("cpp", "driver", "ascent", "c-gui-lab"):
              assert isinstance(plan[key], bool), key
          for item in plan["tauri"]["include"]:
              assert need <= item.keys(), item
          print("演练通过：", len(plan["tauri"]["include"]), "个 Tauri 构建项")
          PY

  # GTK4 + gtkmm + Meson：魔方（pocket_cube）与拆出的旧 C++ 窗口（cpp，ADR 0141）。
  # C++ 教程走下面的 tauri 矩阵。三个平台各装各的依赖，跑的是同一条 Python 入口。
  cpp-macos:
    name: ${{ matrix.app }}（macOS）
    if: contains(fromJSON('["all","pocket_cube","cpp"]'), inputs.app || 'all')
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON((inputs.app || 'all') == 'all' && '["pocket_cube","cpp"]' || format('["{0}"]', inputs.app)) }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg

      - name: Verify
        run: python3 scripts/check.py ${{ matrix.app }} --build-dir build --buildtype debugoptimized

  # 声明支持就要验证（ADR 0047）。pocket_cube 三个平台都跑，不把 Ubuntu 降级。
  cpp-ubuntu:
    name: ${{ matrix.app }}（Ubuntu）
    if: contains(fromJSON('["all","pocket_cube","cpp"]'), inputs.app || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON((inputs.app || 'all') == 'all' && '["pocket_cube","cpp"]' || format('["{0}"]', inputs.app)) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler \
            librsvg2-common xvfb

      - name: Verify
        # GTK 资源测试要构造控件，需要一个显示后端；无头 CI 用 xvfb 提供。
        run: xvfb-run -a python3 scripts/check.py ${{ matrix.app }} --build-dir build --buildtype debugoptimized

  # 2026-09-15 打通并转正。曾经卡住的那三个 conflicting declaration 是 glib 2.90
  # 与 MSYS2 现有 glibmm 2.86 的名字冲突，由 compat/glib_final_type_shim.h 绕开；
  # 同批修掉的还有我们自己的两处 POSIX 专有写法（LC_MESSAGES、M_PI）和缺失的
  # .gitattributes（CRLF 让按字节匹配的测试挂了）。详见 ADR 0049。
  cpp-windows:
    name: ${{ matrix.app }}（Windows）
    if: contains(fromJSON('["all","pocket_cube","cpp"]'), inputs.app || 'all')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON((inputs.app || 'all') == 'all' && '["pocket_cube","cpp"]' || format('["{0}"]', inputs.app)) }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-python

      - name: Verify
        run: python scripts/check.py ${{ matrix.app }} --build-dir build --buildtype debugoptimized

  # Qt Quick / CMake 应用：各自跑自己的 scripts/check.py。
  # （polaris 已随 ADR 0015 迁到 Tauri 2，见下面的 tauri 矩阵。）
  qt-quick:
    name: ${{ matrix.app }}（${{ matrix.os }}）
    if: contains(fromJSON('["all","machine"]'), inputs.app || 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04]
        # 手动只选一个应用时矩阵只留它；tag 触发时 inputs 为空，按全量。
        app: ${{ fromJSON((inputs.app || 'all') == 'all' && '["machine"]' || format('["{0}"]', inputs.app)) }}
    # Linux 降级（ADR 0051）。macOS 这一档仍是正式门槛，Windows 见下一个 job。
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6 cmake ninja

      - name: Install Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev

      - name: Verify
        # Homebrew 的 Qt 是 keg-only，不在默认搜索路径里；CMAKE_PREFIX_PATH
        # 指过去即可，不必把 Qt 灌进全局 PATH。
        run: python3 scripts/check.py ${{ matrix.app }}
        env:
          CMAKE_PREFIX_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/qt@6' || '' }}

  # Windows 上的 Qt Quick 应用走 aqtinstall：官方安装器是交互式的，CI 里用不了，而
  # aqtinstall 是个 pip 包，不必引第三方 action。
  #
  # 这个 job 起初是 continue-on-error 的探测位，2026-09-15 修掉两处问题后转正：
  # 一是给 aqt 传了 -m qtdeclarative（Qt 6 里 Quick 属于基础包，不是可选 module），
  # 二是 runner 的 PATH 里有 MinGW，CMake 挑中 g++ 去链 MSVC 构建的 Qt。
  # Windows 是优先平台（ADR 0051），它的 job 就该是正式门槛。
  qt-quick-windows:
    name: ${{ matrix.app }}（Windows）
    if: contains(fromJSON('["all","machine"]'), inputs.app || 'all')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_VERSION: "6.8.1"
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON((inputs.app || 'all') == 'all' && '["machine"]' || format('["{0}"]', inputs.app)) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSVC
        # 装的是 MSVC 构建的 Qt（win64_msvc2022_64），但 runner 的 PATH 里还有
        # MinGW，CMake 会挑中 g++，链接时撞上符号修饰不兼容：
        # `undefined reference to __imp__Z9qt_assertPKcS0_i`。把 MSVC 的环境
        # 导进来，CMake 才会选 cl.exe。
        #
        # 原先用 ilammy/msvc-dev-cmd，但它至今只有 node20 版本，Node 20 已被
        # GitHub 弃用。它做的事本身很简单：vswhere 找到 VS，跑 vcvars64.bat，
        # 把前后有变化的环境变量写进 GITHUB_ENV。这里照原样手写，不再依赖它。
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "vswhere 没找到带 VC 工具集的 Visual Studio" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat 失败（退出码 $LASTEXITCODE）" }
          foreach ($line in $lines) {
            $name, $value = $line -split '=', 2
            if ($name -and $before[$name] -ne $value) {
              "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Install Qt and Ninja
        # Ninja 是单配置生成器：产物落在 build/ 而不是 build/Debug/，和另外
        # 两个平台、和 app.json 的 dev.run 保持同一个位置。
        #
        # 不传 -m qtdeclarative：Qt 6 里 Quick/Qml 属于基础包，不是可选 module，
        # 传了 aqt 会报「packages not found while parsing XML」直接失败。
        run: |
          python -m pip install --quiet aqtinstall ninja
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O ${{ github.workspace }}\Qt

      - name: Verify
        run: python scripts/check.py ${{ matrix.app }}
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\Qt\6.8.1\msvc2022_64

  # Tauri 应用：前端 + Rust 壳。每个应用跑自己的 scripts/check.py，
  # 和本地是同一条命令（ADR 0007）。polaris 随 ADR 0015 从 Qt 矩阵迁入。
  # 应用间的差异按 matrix.app 写成表达式，不用 include：app 列表会被 inputs.app
  # 过滤，合并不进去的 include 条目会被当成新组合追加，单跑一个应用时冒出别的。
  # 拾阶用 pnpm（它的 lock 依赖 pnpm 的版本约束）；gtkmm 的原生演示要 gtkmm C++
  # 工具链，交给下面的 gtkmm-native，这里跳过。
  tauri:
    name: ${{ matrix.app }}（${{ matrix.os }}）
    if: >-
      contains(fromJSON('["all","algorithms","ascent","c-plus-plus","chinese-chess","competitions","cs408","database",
      "data-structures","deep-learning","design-patterns","earth","edge-ai","embedded","firmware",
      "comms-console","gtkmm","jiuzhou","linux","llm-app","llm-finetune","math-tools","mathematics",
      "machine-learning","microcontroller","network","organization","os","polaris",
      "pocket-cube-solver","qt","gtkmm-lab","python","rtos","snake","software","octave-manual","selinger-linear-algebra","siefken-linear-algebra","sympy-tutorial","chen-linear-algebra","chen-linear-algebra-mooc","weng-c-programming","axler-linear-algebra",
        "linear-algebra","advanced-mathematics"]'), inputs.app || 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: >-
          ${{ fromJSON((inputs.app || 'all') == 'all' && '["algorithms","ascent","c-plus-plus","chinese-chess","competitions","cs408","database",
          "data-structures","deep-learning","design-patterns","earth","edge-ai","embedded","firmware",
          "comms-console","gtkmm","jiuzhou","linux","llm-app","llm-finetune","math-tools","mathematics",
          "machine-learning","microcontroller","network","organization","os","polaris",
          "pocket-cube-solver","qt","gtkmm-lab","python","rtos","snake","software","octave-manual","selinger-linear-algebra","siefken-linear-algebra","sympy-tutorial","chen-linear-algebra","chen-linear-algebra-mooc","weng-c-programming","axler-linear-algebra",
          "linear-algebra","advanced-mathematics"]' || format('["{0}"]', inputs.app)) }}
        os: [macos-15, windows-latest, ubuntu-26.04]
    # Linux 降级：回归了报出来，但不阻塞整体结论（ADR 0051）
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          # 同栈应用共用仓库根这一份锁（ADR 0140）。
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Tauri system dependencies (Ubuntu)
        # Linux 上 Tauri 的 WebView 是系统 WebKitGTK，得先装；macOS 与 Windows
        # 用系统自带的 WKWebView / WebView2，不需要这一步。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libgtk-3-dev libayatana-appindicator3-dev patchelf \
            libspeechd-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: tauri-shared-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch gtkmm upstream docs
        # 结构核对要官方 DocBook（gitignore 的 upstream/），按 upstream.json 的钉点拉取
        if: matrix.app == 'gtkmm'
        run: python3 guide/gtkmm/scripts/fetch_upstream.py

      - name: Verify
        run: python3 scripts/check.py ${{ matrix.app }} ${{ matrix.app == 'gtkmm' && '--skip-native' || '' }}

  # gtkmm 的演示与实验是 gtkmm-4.0 的 C++ CMake 工程，check.py 编译后跑 --self-check
  # （构造控件树即退出，不弹窗）。Linux 一档在这里，Windows 一档（MSYS2
  # MINGW64）在下面的 gtkmm-native-windows；
  gtkmm-native:
    name: gtkmm 原生演示（ubuntu-26.04）
    if: contains(fromJSON('["all","gtkmm"]'), inputs.app || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # 教程壳在仓库根 pnpm 工作区里（ADR 0140），check.py 要用 pnpm 跑前端检查。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake ninja-build pkg-config g++ libgtkmm-4.0-dev xvfb gettext
          pnpm install --frozen-lockfile

      - name: Fetch gtkmm upstream docs
        run: python3 guide/gtkmm/scripts/fetch_upstream.py

      - name: Verify
        run: xvfb-run -a python3 scripts/check.py gtkmm --skip-rust

  # Windows 一档：MSYS2 MINGW64 的 gtkmm-4.0 + CMake/Ninja，check.py 照旧在宿主 pwsh 里
  # 跑（pnpm、Python 用 runner 自带的），只是把 MINGW64 的 bin 排在 PATH 前面，让
  # CMake 找到 g++、pkg-config 找到 gtkmm 的 .pc。本机同样的 PATH 已验证全绿（2026-10-19）。
  # 系统 PATH 里的 pkg-config 可能来自别的软件，所以 PKG_CONFIG_PATH 显式指过去。
  gtkmm-native-windows:
    name: gtkmm 原生演示（windows-latest）
    if: contains(fromJSON('["all","gtkmm"]'), inputs.app || 'all')
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up MSYS2 MINGW64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtkmm-4.0
            mingw-w64-x86_64-gettext-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch gtkmm upstream docs
        run: python guide/gtkmm/scripts/fetch_upstream.py

      - name: Verify
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_ROOT "mingw64"
          $env:PATH = "$mingw\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$mingw\lib\pkgconfig"
          python scripts/check.py gtkmm --skip-rust

  # macOS 一档：Homebrew 的 gtkmm4 + CMake/Ninja。步骤与 Windows 一档对齐
  # （checkout → pnpm/Node → 装依赖 → fetch_upstream → check.py --skip-rust）。
  # gettext 的 msgfmt 给 check_po_gnu 用；bin 经 brew --prefix 显式入 PATH。
  gtkmm-native-macos:
    name: gtkmm 原生演示（macos-15）
    if: contains(fromJSON('["all","gtkmm"]'), inputs.app || 'all')
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Homebrew dependencies
        run: |
          # 包名来源：https://formulae.brew.sh/formula/{gtkmm4,cmake,ninja,pkgconf,gettext}
          # pkgconf 即官方 pkg-config 继任公式（brew 别名仍认 pkg-config）。
          brew install gtkmm4 cmake ninja pkgconf gettext

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch gtkmm upstream docs
        run: python3 guide/gtkmm/scripts/fetch_upstream.py

      - name: Verify
        run: |
          # gettext 若仍 keg-only，msgfmt 不在默认 PATH；用 opt 前缀兼容已 link 的情况。
          # 拆开赋值，避免 SC2155（declare+assign 合一会掩盖 brew --prefix 失败码）。
          gettext_bin="$(brew --prefix gettext)/bin"
          export PATH="${gettext_bin}:${PATH}"
          # 无 xvfb：macOS runner 无 X11。无头 Quartz 风险见本文件头注释。
          python3 scripts/check.py gtkmm --skip-rust

  # 驾考学习：Flutter 桌面。三个平台各编各的桌面目标，入口仍是应用自己的
  # scripts/check.py（ADR 0007）。
  driver:
    name: 驾考学习（${{ matrix.os }}）
    if: contains(fromJSON('["all","driver"]'), inputs.app || 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-26.04, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop targets
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      # 数据层是客户端本地 SQLite（ADR 0069）：测试各开临时库文件，
      # 不再需要任何外部数据库服务（撤销 ADR 0068 时代为测试装的 PostgreSQL）。
      - name: Verify
        run: python3 scripts/check.py driver

  # 启动器：纯 Rust，三平台同一套源码。
  launcher:
    name: 启动器（${{ matrix.os }}）
    if: contains(fromJSON('["all","launcher"]'), inputs.app || 'all')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-26.04]
    # Linux 降级：回归了报出来，但不阻塞整体结论（ADR 0051）
    continue-on-error: ${{ matrix.os == 'ubuntu-26.04' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # webui（Tauri 2 + React）的页面资产要先构建，cargo 编译时内嵌（ADR 0125）。
      # Linux 不编 webui：Tauri 2 需要 webkit2gtk 全套，Linux 支持未承诺（ADR 0051），
      # 只编 core 纯逻辑兜底。
      - name: Set up pnpm
        if: runner.os != 'Linux'
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        if: runner.os != 'Linux'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build webui frontend
        if: runner.os != 'Linux'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir launcher/webui run build

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: launcher-${{ matrix.os }}-${{ hashFiles('launcher/Cargo.lock', 'Cargo.lock') }}

      # Linux 只编 core：工作区里的 webui 是 Tauri，需要 webkit2gtk 与 glib 全套。
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo build --manifest-path launcher/Cargo.toml -p launcher-core --all-targets
          else
            cargo build --manifest-path launcher/Cargo.toml --all-targets
          fi

  # 驾考后台：Flask 服务，check.py 自建 .venv 装依赖后用 test_client 打健康检查、登录页
  # 与仪表盘壳。应用启动就 create_all，必须连上 PostgreSQL：CI 起一个与生产同大版本
  # （17）的空库，账号只在这台 runner 上存在。服务容器只有 Linux runner 支持；生产本来
  # 就在软路由（Linux）上，Windows 开发机走本地 check.py。
  nas-admin:
    name: 驾考后台（ubuntu-26.04）
    if: contains(fromJSON('["all","nas_admin"]'), inputs.app || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nas_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NAS_ADMIN_DATABASE_URL: postgresql://ci:ci@localhost:5432/nas_admin

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify
        run: python scripts/check.py nas_admin

  # C GUI Lab 的原生程序是 Windows 专用（ucrt64 预设、GDI 演示），CI 不编译它们；
  # 这里只验证跨平台成立的部分：目录结构完整与 Electron 主进程语法。名字写明，
  # 不冒充完整验证。
  c-gui-lab:
    name: C GUI Lab（结构与 Electron 语法，不含原生编译）
    if: contains(fromJSON('["all","c-gui-lab"]'), inputs.app || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify
        run: python3 scripts/check.py c-gui-lab --skip-build

  # Windows 原生编译一档：把 third_party 从锁文件取回（scripts/fetch-third-party.py，
  # 校验 sha256、打补丁），再用 MSYS2 UCRT64 编出七个原生程序。这是安装包作业的前置，
  # 先在这里验证「CI 上拉得到源码、编得出来」。macOS / Linux 按 ADR 0049 排除（Win32 / DX11 / GDI 目标）。
  # CMakePresets 写死 C:/msys64，runner 上 MSYS2 的位置不同，所以用 -D 覆盖编译器。
  c-gui-lab-native:
    name: C GUI Lab 原生编译（windows-latest）
    if: contains(fromJSON('["all","c-gui-lab"]'), inputs.app || 'all')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-lld

      - name: Fetch third_party
        working-directory: practice/c-gui-lab
        run: python scripts/fetch-third-party.py

      - name: Configure and build
        working-directory: practice/c-gui-lab
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ucrt = Join-Path $env:MSYS2_ROOT "ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$ucrt\bin\gcc.exe" -DCMAKE_CXX_COMPILER="$ucrt\bin\g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in "gtk-style", "imgui-style", "lvgl-style", "raygui-demo", "nuklear-demo", "nuklear-gdi-demo", "microui-demo") {
            if (-not (Test-Path "build\apps\$app\$app.exe")) { throw "missing $app.exe" }
          }

  # 安装包一档（T-101，zcode 起草）：在 c-gui-lab-native 通过之后，收 DLL、electron-builder
  # 出 NSIS、静默安装到临时目录并跑安装布局的 --selftest。只在 ci.yml 里验证，不进
  # release.yml（release 只在 tag 上跑，没法单独触发；验证通过后再搬）。
  c-gui-lab-package:
    name: C GUI Lab Windows 安装包（编译、收 DLL、打包、静默安装、自检）
    if: contains(fromJSON('["all","c-gui-lab"]'), inputs.app || 'all')
    needs: c-gui-lab-native
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: practice/c-gui-lab

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice/c-gui-lab/package-lock.json

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ntldd

      - name: Fetch third_party
        run: python scripts/fetch-third-party.py

      - name: Install Electron dependencies
        run: npm ci

      - name: Configure and build native apps
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $ucrt = Join-Path $env:MSYS2_ROOT "ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig"
          # CMakePresets 写死 C:/msys64，runner 上 MSYS2 位置不同，用 -D 覆盖编译器
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$ucrt\bin\gcc.exe" -DCMAKE_CXX_COMPILER="$ucrt\bin\g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in "gtk-style", "imgui-style", "lvgl-style", "raygui-demo", "nuklear-demo", "nuklear-gdi-demo", "microui-demo") {
            if (-not (Test-Path "build\apps\$app\$app.exe")) { throw "missing $app.exe" }
          }

      # 把 UCRT64 运行库 DLL 收到各 exe 旁（Windows 加载 DLL 先查应用程序目录，
      # 旁路即可生效），然后复查无缺失。runner 的 MSYS2 位置不定，所以按
      # setup-msys2 输出的实际路径过滤，不写死 C:\msys64。
      - name: Bundle and verify MinGW runtime DLLs
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          UCRT="$(cygpath -m "$MSYS2_ROOT")/ucrt64"
          # Git Bash 的 PATH 要 unix 风格（/d/a/...），带盘符的 D:/... 里的冒号会被拆开；
          # 而 awk 里按 root 前缀过滤 ntldd 的输出要 mixed 风格（D:/...），两种写法各用各的。
          ucrt_unix="$(cygpath -u "$UCRT")"
          export PATH="${ucrt_unix}/bin:$PATH"
          for exe in build/apps/*/*.exe; do
            dir="$(dirname "$exe")"
            ntldd -R "$exe" \
              | awk -v root="$UCRT" '{gsub(/\\/, "/")} /=>/ && index($3, root) == 1 {print $3}' \
              | while read -r dll; do cp -n "$dll" "$dir/"; done
          done
          missing=0
          for exe in build/apps/*/*.exe; do
            while read -r name; do
              case "$name" in
                ext-ms-*|api-ms-*) ;;
                *)
                  # 只有 UCRT64 的 bin 里确有这个 DLL 却没收到，才是真缺口；
                  # 其余（AzureAttestManager、wpaxholder 等）是 Windows 自带组件的延迟加载项，
                  # runner 上没有也不影响，安装机由系统提供。
                  if [ -f "${ucrt_unix}/bin/${name}" ]; then
                    echo "::error::$exe 依赖的 $name 在 UCRT64 里有，但没收集到"; missing=1
                  else
                    echo "notice: $exe 的 $name 不在 UCRT64，按系统组件处理"
                  fi ;;
              esac
            done < <(ntldd -R "$exe" | awk '/=> not found/ {print $1}')
          done
          exit "$missing"

      # 应用 JS 进 asar；原生 exe 与 DLL 按 electron-builder.yml 的 extraResources
      # 放 resources/native（launcher 打包态从这里找，见 launcher/main.js 的
      # NATIVE_ROOT 与 electron-builder.yml 头注）。
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer exists
        shell: bash
        run: ls -l dist/athena-c-gui-lab-*-windows-x64-setup.exe

      # NSIS 静默参数：/S 静默；/D= 指定目录且必须是最后一个参数、不能加引号，
      # 路径含空格时解析失败。RUNNER_TEMP（D:\a\_temp）无空格，不要换含空格的目录。
      - name: Silent-install to temp dir
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/athena-c-gui-lab-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "安装包未生成" }
          $dest = Join-Path $env:RUNNER_TEMP "c-gui-lab-installed"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装退出码 $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dest "athena-c-gui-lab.exe"))) { throw "安装目录未找到主程序" }
          "INSTALLED=$dest" >> $env:GITHUB_ENV

      # 安装布局的真验证：selftest 逐个 spawn 七个 exe 并确认 4 秒后仍存活。
      - name: Run packaged selftest
        shell: pwsh
        run: |
          # Electron 是 GUI 子系统程序，pwsh 里直接 & 调用不会等它退出，$LASTEXITCODE 也是空的
          # （首跑就栽在这）。改成 Start-Process -Wait 等它结束，输出重定向到文件，
          # 成败以退出码与 SELFTEST-OK 标记两者同时成立为准。
          $exe = Join-Path $env:INSTALLED "athena-c-gui-lab.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.out.txt"
          $err = Join-Path $env:RUNNER_TEMP "selftest.err.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "安装布局 selftest 失败（exit $($p.ExitCode)）" }
          if (-not (Select-String -Path $out -Pattern "SELFTEST-OK" -Quiet)) { throw "selftest 输出里没有 SELFTEST-OK" }

      - name: Upload installer for inspection
        uses: actions/upload-artifact@v7
        with:
          name: athena-c-gui-lab-windows-x64-ci
          path: practice/c-gui-lab/dist/athena-c-gui-lab-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
