name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg

      - name: Verify
        run: scripts/check.sh --build-dir build --buildtype debugoptimized
