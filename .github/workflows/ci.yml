name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg

      - name: Verify
        run: scripts/check.sh --build-dir build --buildtype debugoptimized

  ubuntu:
    name: Ubuntu build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libwebkitgtk-6.0-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler \
            librsvg2-common xvfb

      - name: Verify
        # GTK 资源测试要构造控件，需要一个显示后端；无头 CI 用 xvfb 提供。
        run: xvfb-run -a scripts/check.sh --build-dir build --buildtype debugoptimized
