# 驾考学习(subjects/driver)的发布流水线:打 driver-v* tag 或手动触发,构建
# 三平台包并发成 GitHub Release——机制同拾阶(ascent-release.yml),差异只在
# 构建栈(Flutter)与产物形态(zip/dmg/tar.gz,见 Package 步骤)。
#
# 发版节奏与拾阶一致:
#   git tag driver-v8.0.1 && git push origin driver-v8.0.1
#   或 gh workflow run driver-release.yml -f version=8.0.1
#
# 版本号由 tag 决定并写入 pubspec.yaml(同拾阶的 Set version),发版不需要
# 预先改版本提交。Flutter 桌面暂无 Tauri 式应用内更新器,所以没有拾阶那条
# latest.json 更新通道;应用内自动更新要做时再补(需客户端集成更新组件)。
name: Driver release

on:
  push:
    tags: ["driver-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 版本号,如 8.0.1(不带 driver-v 前缀,必须大于已发布的最高版本)
        required: true
        type: string

concurrency:
  group: driver-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-26.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#driver-v}"
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号 '$v' 不是 x.y.z 形式"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set version
        working-directory: subjects/driver
        shell: bash
        run: |
          sed -i.bak -E "s/^version: .+/version: ${{ steps.version.outputs.value }}+1/" pubspec.yaml
          rm pubspec.yaml.bak

      - name: Enable desktop targets
        working-directory: subjects/driver
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Test
        working-directory: subjects/driver
        run: flutter test

      - name: Build
        working-directory: subjects/driver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows --release
          elif [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

      - name: Package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Release 目录自含:athena-driver.exe、dll 与 data/ 同层,压缩即用
            powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/athena-driver-$version-$platform.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls build/macos/Build/Products/Release | grep '\.app$' | head -1)
            hdiutil create -volname "athena-driver" -srcfolder "build/macos/Build/Products/Release/$app" -ov -format UDZO "dist/athena-driver-$version-$platform.dmg"
          else
            tar -czf "dist/athena-driver-$version-$platform.tar.gz" -C build/linux/x64/release/bundle .
          fi

      - name: Verify package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import zipfile,sys; names=zipfile.ZipFile('dist/athena-driver-$version-$platform.zip').namelist(); sys.exit(0 if any(n.endswith('athena-driver.exe') for n in names) else 1)" || { echo 'zip 缺 athena-driver.exe'; exit 1; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil verify "dist/athena-driver-$version-$platform.dmg"
          else
            # 禁止管道匹配:grep -q 提前退出会让写端吃 SIGPIPE,pipefail 下误判失败
            listing=$(tar -tzf "dist/athena-driver-$version-$platform.tar.gz")
            [[ "$listing" == *athena-driver* ]] || { echo 'tar.gz 缺 athena-driver'; exit 1; }
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-driver-${{ matrix.platform }}
          path: subjects/driver/dist/athena-driver-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: athena-driver-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum athena-driver-*.zip athena-driver-*.dmg athena-driver-*.tar.gz > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#driver-v}"
          fi
          assets=(dist/athena-driver-*.zip dist/athena-driver-*.dmg dist/athena-driver-*.tar.gz dist/SHA256SUMS.txt)
          if gh release view "driver-v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 同 tag 重跑时 Release 已存在:同名资产 --clobber 覆盖,说明与标题一并更新。
            gh release upload "driver-v$version" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "driver-v$version" --repo "$GITHUB_REPOSITORY" \
              --notes "自动构建,提交 ${{ github.sha }}" --title "驾考学习 v$version"
          else
            gh release create "driver-v$version" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --notes "自动构建,提交 ${{ github.sha }}" \
              --title "驾考学习 v$version"
          fi
