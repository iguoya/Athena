name: Release

# 增量发版（ADR 0171，修订 ADR 0081）：一个 tag 仍是一次发版，但只构建有改动的应用。
# 应用各有自己的版本号（写在各栈清单里），安装包按应用自己的版本命名；plan 作业按
# 「清单版本与上一个 tag 不同」算出要构建的应用，各构建作业只校验、不改写版本。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 算出这次要构建谁：只比较各应用清单里的版本（依赖图在 prepare 时已经算过并写进了清单，
  # 这里不重复算，重发 tag 时结果稳定）。发版号必须等于 VERSION。
  plan:
    name: Plan release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tauri_any: ${{ steps.plan.outputs.tauri_any }}
      tauri_matrix: ${{ steps.plan.outputs.tauri_matrix }}
      cpp: ${{ steps.plan.outputs.cpp }}
      driver: ${{ steps.plan.outputs.driver }}
      ascent: ${{ steps.plan.outputs.ascent }}
      c_gui_lab: ${{ steps.plan.outputs.c_gui_lab }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # 要读上一个 tag 的各应用清单
          fetch-depth: 0

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [[ "$v" != "$file" ]]; then
            echo "::error::tag 版本 $v 与仓库根 VERSION（$file）不一致"
            exit 1
          fi

      - name: Compute build plan
        id: plan
        shell: bash
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [[ -z "$prev_tag" ]]; then
            echo "::error::找不到上一个 v*.*.* tag，无法比较各应用版本"
            exit 1
          fi
          echo "对比基线：$prev_tag"
          python3 scripts/release_plan.py matrix --base "$prev_tag" --head "$GITHUB_SHA" > plan.json
          cat plan.json
          python3 - <<'PY'
          import json, os
          plan = json.load(open("plan.json", encoding="utf-8"))
          include = plan["tauri"]["include"]
          any_tauri = bool(include)
          if not include:
              # 空矩阵会让工作流语法检查失败；放一个占位项，作业靠 tauri_any 跳过
              include = [{"app": "none", "root": "none", "os": "ubuntu-24.04",
                          "platform": "none", "bundles": "none"}]
          out = {
              "tauri_any": str(any_tauri).lower(),
              "tauri_matrix": json.dumps({"include": include}, separators=(",", ":")),
              "cpp": str(bool(plan["cpp"])).lower(),
              "driver": str(bool(plan["driver"])).lower(),
              "ascent": str(bool(plan["ascent"])).lower(),
              "c_gui_lab": str(bool(plan["c-gui-lab"])).lower(),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          if not any(out[k] == "true" for k in ("tauri_any", "cpp", "driver", "ascent", "c_gui_lab")):
              raise SystemExit("::error::没有任何应用的版本相对上一个 tag 发生变化，没有可发布的内容")
          PY

  macos:
    name: Build ${{ matrix.architecture }}
    needs: plan
    if: needs.plan.outputs.cpp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        working-directory: practice/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg
          adwaita-icon-theme hicolor-icon-theme

      - name: Read version from Meson
        id: version
        shell: bash
        run: |
          meson setup build-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: meson compile -C build-release

      - name: Test
        run: meson test -C build-release --print-errorlogs

      - name: Package app and DMG
        run: |
          python3 scripts/package_macos.py \
            --project-root . \
            --binary build-release/athena-cpp \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify architecture and disk image
        shell: bash
        run: |
          file dist/athena-cpp.app/Contents/MacOS/athena-cpp \
            | grep -q "${{ matrix.architecture }}"
          codesign --verify --deep --strict dist/athena-cpp.app
          hdiutil verify \
            "dist/athena-cpp-${{ steps.version.outputs.version }}-macos-${{ matrix.architecture }}.dmg"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-macos-${{ matrix.architecture }}
          path: practice/cpp/dist/athena-cpp-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    needs: plan
    if: needs.plan.outputs.cpp == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: practice/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler librsvg2-common xvfb \
            squashfs-tools curl ca-certificates

      - name: Read version from Meson
        id: version
        shell: bash
        run: |
          meson setup build-linux-release --buildtype=release -Dstrip=true --prefix /usr
          project_version=$(meson introspect build-linux-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-linux-release
          xvfb-run -a meson test -C build-linux-release --print-errorlogs

      - name: Download pinned AppImage tools
        shell: bash
        run: |
          curl -fL --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 --output appimage-runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage-runtime-x86_64" | sha256sum --check

      - name: Package DEB and AppImage
        run: |
          python3 scripts/package_linux.py \
            --project-root . \
            --build-dir build-linux-release \
            --output-dir dist \
            --linuxdeploy ./linuxdeploy-x86_64.AppImage \
            --appimage-runtime ./appimage-runtime-x86_64 \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Linux packages
        shell: bash
        run: |
          dpkg-deb --info "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb"
          dpkg-deb --contents "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb" \
            > deb-contents.txt
          grep -q './usr/bin/athena-cpp' deb-contents.txt
          appimage="dist/athena-cpp-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          test -x "$appimage"
          offset=$("$appimage" --appimage-offset)
          unsquashfs -o "$offset" -l "$appimage" | grep -q 'squashfs-root/usr/bin/athena-cpp'

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-linux-x86_64
          path: |
            practice/cpp/dist/athena-cpp_*.deb
            practice/cpp/dist/athena-cpp-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows packages
    needs: plan
    if: needs.plan.outputs.cpp == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
        working-directory: practice/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-python

      - name: Read version from Meson
        id: version
        run: |
          meson setup build-windows-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-windows-release --projectinfo \
            | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-windows-release
          meson test -C build-windows-release --print-errorlogs

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package MSI and zip
        run: |
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          python scripts/package_windows.py \
            --project-root . \
            --binary build-windows-release/athena-cpp.exe \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Windows packages
        shell: pwsh
        working-directory: practice/cpp
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/athena-cpp-$version-windows-x64.zip"
          $msi = "dist/athena-cpp-$version-windows-x64.msi"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $msi)) { throw "missing $msi" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "bin/athena-cpp.exe") {
              throw "zip is missing bin/athena-cpp.exe"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-windows-x64
          path: |
            practice/cpp/dist/athena-cpp-*-windows-x64.zip
            practice/cpp/dist/athena-cpp-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

  # 以下两个 job 的机制分别从独立工作流迁回（ADR 0081）：driver 原 driver-release.yml
  # （版本由 tag 写入 pubspec），拾阶原 ascent-release.yml（Tauri 签名构建、更新器走
  # ascent-updates 固定标签）。签名 key 未配置时拾阶整体跳过，不阻塞其余应用发布。
  driver:
    name: Build driver (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.driver == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-26.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      # 版本取自 pubspec（应用自己的版本，ADR 0171）；+构建号不进文件名
      - name: Read app version
        id: version
        working-directory: certification/driver
        shell: bash
        run: |
          v="$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml 里没有 x.y.z 形式的版本：'$v'"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop targets
        working-directory: certification/driver
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Test
        working-directory: certification/driver
        run: flutter test

      - name: Build
        working-directory: certification/driver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows --release
          elif [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

      - name: Package
        working-directory: certification/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Release 目录自含:athena-driver.exe、dll 与 data/ 同层,压缩即用
            powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/athena-driver-$version-$platform.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            apps=(build/macos/Build/Products/Release/*.app)
            hdiutil create -volname "athena-driver" -srcfolder "${apps[0]}" -ov -format UDZO "dist/athena-driver-$version-$platform.dmg"
          else
            tar -czf "dist/athena-driver-$version-$platform.tar.gz" -C build/linux/x64/release/bundle .
          fi

      - name: Verify package
        working-directory: certification/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import zipfile,sys; names=zipfile.ZipFile('dist/athena-driver-$version-$platform.zip').namelist(); sys.exit(0 if any(n.endswith('athena-driver.exe') for n in names) else 1)" || { echo 'zip 缺 athena-driver.exe'; exit 1; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil verify "dist/athena-driver-$version-$platform.dmg"
          else
            # 禁止管道匹配:grep -q 提前退出会让写端吃 SIGPIPE,pipefail 下误判失败
            listing=$(tar -tzf "dist/athena-driver-$version-$platform.tar.gz")
            [[ "$listing" == *athena-driver* ]] || { echo 'tar.gz 缺 athena-driver'; exit 1; }
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-driver-${{ matrix.platform }}
          path: certification/driver/dist/athena-driver-*
          if-no-files-found: error
          retention-days: 7

  ascent:
    name: Build ascent (windows-x64)
    needs: plan
    if: needs.plan.outputs.ascent == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    # tauri-action 要以 draft 形态创建统一 Release，需要写权限
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: postgraduate/ascent
    steps:
      - name: Check signing key
        id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY 没设置，拾阶跳过构建，其余应用照常发布（ADR 0081）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.ready == 'true'
        with:
          version: 10.15.1

      - uses: actions/setup-node@v7
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ready == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: postgraduate/ascent/src-tauri

      # 锁文件在仓库根（ADR 0140）。在应用目录里装会找不到 lockfile。
      - name: Install dependencies
        if: steps.key.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # 上一次失败的 run 会留下同 tag 的 draft，指向旧提交、带着旧资产；移 tag 重跑时
      # tauri-action 可能复用它也可能另建一个，publish 按 tag 找到哪个就不确定了。
      # 只删 draft，已发布的 Release 不碰。
      - name: Drop stale draft release
        if: steps.key.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            echo "删除残留 draft $id（$TAG）"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

      # draft 方式创建统一 Release 并产出 latest.json；资产由 publish job 合流转正（ADR 0081 决策 5）
      - uses: tauri-apps/tauri-action@v1
        if: steps.key.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: postgraduate/ascent
          # Release 属于发版 tag，不属于拾阶自己的版本（ADR 0171）
          tagName: ${{ github.ref_name }}
          releaseName: Athena ${{ github.ref_name }}
          releaseBody: 自动构建，提交 ${{ github.sha }}
          releaseDraft: true
          prerelease: false

      - name: Collect updater manifest
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p postgraduate/ascent/dist
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir postgraduate/ascent/dist

      - name: Upload release assets
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: athena-ascent-windows-x64
          path: |
            .cache/cargo-target/release/bundle/nsis/*.exe
            postgraduate/ascent/dist/latest.json
          if-no-files-found: error
          retention-days: 7

  # 相对成熟的 Tauri 应用进同一矩阵（ADR 0168，延伸 ADR 0081）。
  # 与 athena-cpp、athena-driver、拾阶同版同发。tauri build 先跑 beforeBuildCommand
  # 构建前端，再编 Rust 出 bundle；每平台取一种格式：Windows NSIS、macOS DMG、
  # Linux DEB（AppImage 的 linuxdeploy 在无头 CI 上还有 fuse 依赖，先不发）。
  # 产物改名为 athena-<app>-<版本>-<平台>。中文 productName 的应用用 mainBinaryName
  # 把二进制收成 athena-<id>，窗口标题仍用中文。
  tauri-apps:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.tauri_any == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 由 plan 作业算出（scripts/release_plan.py matrix，名单在 scripts/release_apps.json）
        include: ${{ fromJSON(needs.plan.outputs.tauri_matrix).include }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/cargo-target
          key: tauri-release-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libgtk-3-dev libayatana-appindicator3-dev patchelf             libspeechd-dev

      # 版本取自应用自己的 tauri.conf.json（ADR 0171）；plan 作业已保证它与上一个 tag 不同
      - name: Read app version
        id: version
        working-directory: ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}
        shell: bash
        run: |
          v="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tauri.conf.json 里没有 x.y.z 形式的版本：'$v'"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 各应用共用同一份 cargo 缓存（含 bundle 目录），上一个应用的安装包会被还原回来，
      # 导致收集时出现多个产物。构建前清掉，只留本应用这次产出的。
      - name: Clear stale bundles
        shell: bash
        run: rm -rf .cache/cargo-target/release/bundle

      # 更新器工件需要签名（ADR 0172）。密钥没配置时降级为不出更新工件，安装包照常发，
      # 与拾阶「密钥缺失不阻塞发版」（ADR 0081 决策 4）同一做法。
      - name: Build and bundle
        working-directory: ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY 没设置，本次不生成更新器工件（安装包照常）。"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build --bundles "${{ matrix.bundles }}" "${extra[@]}"

      - name: Collect and rename artifacts
        working-directory: ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          app="${{ matrix.app }}"
          mkdir -p dist
          # 工作目录是 <分组>/<应用>。Windows 的 bash 里 GITHUB_WORKSPACE 是 D:\...，
          # 拼进 cp 之后反斜杠路径找不到文件（v9 能拷走是因为用了相对路径
          # src-tauri/target）。cargo 现在把产物放在仓库根 .cache/cargo-target
          # （ADR 0140），用 pwd 拿本 shell 认识的路径。
          repo="$(cd ../.. && pwd)"
          bundle="$repo/.cache/cargo-target/release/bundle"
          echo "bundle dir: $bundle"
          if [ ! -d "$bundle" ]; then
            echo "::error::没有找到安装包目录 $bundle"
            exit 1
          fi
          shopt -s nullglob
          case "$RUNNER_OS" in
            Windows)
              files=("$bundle"/nsis/*-setup.exe)
              dest="dist/athena-${app}-${version}-${platform}-setup.exe" ;;
            macOS)
              files=("$bundle"/dmg/*.dmg)
              dest="dist/athena-${app}-${version}-${platform}.dmg" ;;
            Linux)
              files=("$bundle"/deb/*.deb)
              dest="dist/athena-${app}_${version}_amd64.deb" ;;
          esac
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个安装包，实际 ${#files[@]}：${files[*]}"
            find "$bundle" -type f
            exit 1
          fi
          cp "${files[0]}" "$dest"
          # 更新器工件（ADR 0172）：Windows 的 NSIS 安装包自己就是更新工件，旁边有 .sig；
          # macOS 是 .app.tar.gz 加 .sig；Linux 不出（决策 5）。文件名对齐
          # scripts/release_updater.py 的约定，publish 据此生成各应用的通道 json。
          case "$RUNNER_OS" in
            Windows)
              sigs=("$bundle"/nsis/*-setup.exe.sig)
              if [ "${#sigs[@]}" -eq 1 ]; then cp "${sigs[0]}" "$dest.sig"; fi ;;
            macOS)
              tars=("$bundle"/macos/*.app.tar.gz)
              if [ "${#tars[@]}" -eq 1 ] && [ -f "${tars[0]}.sig" ]; then
                cp "${tars[0]}" "dist/athena-${app}-${version}-${platform}.app.tar.gz"
                cp "${tars[0]}.sig" "dist/athena-${app}-${version}-${platform}.app.tar.gz.sig"
              fi ;;
          esac
          ls -l dist

      - name: Verify package
        working-directory: ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          case "$RUNNER_OS" in
            Windows)
              test -f "dist/athena-${{ matrix.app }}-$version-$platform-setup.exe" ;;
            macOS)
              hdiutil verify "dist/athena-${{ matrix.app }}-$version-$platform.dmg" ;;
            Linux)
              dpkg-deb --info "dist/athena-${{ matrix.app }}_${version}_amd64.deb"
              listing=$(dpkg-deb --contents "dist/athena-${{ matrix.app }}_${version}_amd64.deb")
              [[ "$listing" == *usr/bin/* ]] || { echo 'deb 缺 usr/bin 主二进制'; exit 1; } ;;
          esac

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-${{ matrix.app }}-${{ matrix.platform }}
          # deb 按 Debian 惯例用下划线（athena-<app>_<版本>_amd64.deb），只写 -* 会漏掉它
          path: |
            ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}/dist/athena-${{ matrix.app }}-*
            ${{ matrix.dir || format('{0}/{1}', matrix.root, matrix.app) }}/dist/athena-${{ matrix.app }}_*
          if-no-files-found: error
          retention-days: 7

  # c-gui-lab 安装包（ADR 0170 第 4 条）。同一套步骤已在 ci.yml 的 c-gui-lab-package 一档验证过
  # （run 39349483787：静默安装后七个原生程序都起得来）；这里只多了从 tag 写版本号、
  # 产物名对齐 publish 的 athena-* 通配。只有 Windows 一档，macOS / Linux 按 ADR 0049 排除。
  c-gui-lab:
    name: Build c-gui-lab (windows-x64)
    needs: plan
    if: needs.plan.outputs.c_gui_lab == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: practice/c-gui-lab

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      # 版本取自 package.json（应用自己的版本，ADR 0171）；electron-builder 的产物名由它决定
      - name: Read app version
        id: version
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json 里没有 x.y.z 形式的版本：'$v'"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice/c-gui-lab/package-lock.json

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ntldd

      - name: Fetch third_party
        run: python scripts/fetch-third-party.py

      - name: Install Electron dependencies
        run: npm ci

      - name: Configure and build native apps
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $ucrt = Join-Path $env:MSYS2_ROOT "ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$ucrt\lib\pkgconfig;$ucrt\share\pkgconfig"
          # CMakePresets 写死 C:/msys64，runner 上 MSYS2 位置不同，用 -D 覆盖编译器
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$ucrt\bin\gcc.exe" -DCMAKE_CXX_COMPILER="$ucrt\bin\g++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in "gtk-style", "imgui-style", "lvgl-style", "raygui-demo", "nuklear-demo", "nuklear-gdi-demo", "microui-demo") {
            if (-not (Test-Path "build\apps\$app\$app.exe")) { throw "missing $app.exe" }
          }

      # 把 UCRT64 运行库 DLL 收到各 exe 旁（Windows 加载 DLL 先查应用程序目录，
      # 旁路即可生效），然后复查无缺失。runner 的 MSYS2 位置不定，所以按
      # setup-msys2 输出的实际路径过滤，不写死 C:\msys64。
      - name: Bundle and verify MinGW runtime DLLs
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          UCRT="$(cygpath -m "$MSYS2_ROOT")/ucrt64"
          # Git Bash 的 PATH 要 unix 风格（/d/a/...），带盘符的 D:/... 里的冒号会被拆开；
          # 而 awk 里按 root 前缀过滤 ntldd 的输出要 mixed 风格（D:/...），两种写法各用各的。
          ucrt_unix="$(cygpath -u "$UCRT")"
          export PATH="${ucrt_unix}/bin:$PATH"
          for exe in build/apps/*/*.exe; do
            dir="$(dirname "$exe")"
            ntldd -R "$exe" \
              | awk -v root="$UCRT" '{gsub(/\\/, "/")} /=>/ && index($3, root) == 1 {print $3}' \
              | while read -r dll; do cp -n "$dll" "$dir/"; done
          done
          missing=0
          for exe in build/apps/*/*.exe; do
            while read -r name; do
              case "$name" in
                ext-ms-*|api-ms-*) ;;
                *)
                  # 只有 UCRT64 的 bin 里确有这个 DLL 却没收到，才是真缺口；
                  # 其余（AzureAttestManager、wpaxholder 等）是 Windows 自带组件的延迟加载项，
                  # runner 上没有也不影响，安装机由系统提供。
                  if [ -f "${ucrt_unix}/bin/${name}" ]; then
                    echo "::error::$exe 依赖的 $name 在 UCRT64 里有，但没收集到"; missing=1
                  else
                    echo "notice: $exe 的 $name 不在 UCRT64，按系统组件处理"
                  fi ;;
              esac
            done < <(ntldd -R "$exe" | awk '/=> not found/ {print $1}')
          done
          exit "$missing"

      # 应用 JS 进 asar；原生 exe 与 DLL 按 electron-builder.yml 的 extraResources
      # 放 resources/native（launcher 打包态从这里找，见 launcher/main.js 的
      # NATIVE_ROOT 与 electron-builder.yml 头注）。
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer exists
        shell: bash
        run: ls -l dist/athena-c-gui-lab-*-windows-x64-setup.exe

      # NSIS 静默参数：/S 静默；/D= 指定目录且必须是最后一个参数、不能加引号，
      # 路径含空格时解析失败。RUNNER_TEMP（D:\a\_temp）无空格，不要换含空格的目录。
      - name: Silent-install to temp dir
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/athena-c-gui-lab-*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "安装包未生成" }
          $dest = Join-Path $env:RUNNER_TEMP "c-gui-lab-installed"
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "静默安装退出码 $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dest "athena-c-gui-lab.exe"))) { throw "安装目录未找到主程序" }
          "INSTALLED=$dest" >> $env:GITHUB_ENV

      # 安装布局的真验证：selftest 逐个 spawn 七个 exe 并确认 4 秒后仍存活。
      - name: Run packaged selftest
        shell: pwsh
        run: |
          # Electron 是 GUI 子系统程序，pwsh 里直接 & 调用不会等它退出，$LASTEXITCODE 也是空的
          # （首跑就栽在这）。改成 Start-Process -Wait 等它结束，输出重定向到文件，
          # 成败以退出码与 SELFTEST-OK 标记两者同时成立为准。
          $exe = Join-Path $env:INSTALLED "athena-c-gui-lab.exe"
          $out = Join-Path $env:RUNNER_TEMP "selftest.out.txt"
          $err = Join-Path $env:RUNNER_TEMP "selftest.err.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "安装布局 selftest 失败（exit $($p.ExitCode)）" }
          if (-not (Select-String -Path $out -Pattern "SELFTEST-OK" -Quiet)) { throw "selftest 输出里没有 SELFTEST-OK" }

      - name: Upload installer for inspection
        uses: actions/upload-artifact@v7
        with:
          name: athena-c-gui-lab-windows-x64
          path: practice/c-gui-lab/dist/athena-c-gui-lab-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [plan, macos, linux, windows, driver, ascent, tauri-apps, c-gui-lab]
    # 没被 plan 选中的作业是 skipped；默认 success() 会连带跳过 publish，所以显式写：
    # 只要 plan 成功、没有作业失败或被取消，就发布（ADR 0171）。
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # 缺 CHANGELOG 节时要 git log 上一标签..HEAD，需要完整历史与标签。
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: athena-*
          path: dist
          merge-multiple: true

      # 拾阶的签名 key 未配置时没有 athena-ascent_*.exe，nullglob 让空通配直接消失
      - name: Create checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          # 安装包一律 athena- 开头（deb 用下划线，* 照样匹配）。
          # 新增应用不用再改这份清单。
          files=(athena-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist 里没有 athena-* 安装包"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        working-directory: practice/cpp
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 有手写节就用；缺失则统计上一标签至今的提交并写回 CHANGELOG，
          # 再抽出正文。写回只影响本 job 工作树，真正入库靠发版前提交。
          python3 scripts/changelog_notes.py "$version" ../../CHANGELOG.md --write \
            > "${GITHUB_WORKSPACE}/release-notes.md"
          # 页脚链接钉在本标签上，文件日后搬家也不失效；对比链接与 GitHub
          # 自动生成的 Full Changelog 同格式，首个版本没有上一标签就省掉。
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          # 应用各有版本（ADR 0171）：说明里附「本次发布的应用」与「未变化的应用」两张表
          if [ -n "$prev_tag" ]; then
            {
              echo
              python3 "${GITHUB_WORKSPACE}/scripts/release_plan.py" notes --base "$prev_tag" --head "$GITHUB_SHA"
            } >> "${GITHUB_WORKSPACE}/release-notes.md"
          fi
          {
            echo
            echo "---"
            echo
            echo "完整更新日志见仓库 [\`CHANGELOG.md\`](${repo_url}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)。"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: ${repo_url}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } >> "${GITHUB_WORKSPACE}/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          assets=(dist/athena-* dist/SHA256SUMS.txt)
          if [ ${#assets[@]} -lt 2 ]; then
            echo "::error::没有可上传的安装包"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 拾阶 tauri-action 以 draft 建的 Release 落到这里:补齐资产后 --draft=false 转正;
            # tag 重跑时同名资产 --clobber 覆盖,说明与标题一并更新。
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --notes-file release-notes.md --title "Athena $version"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "Athena $version"
          fi

      # 拾阶更新器读固定地址,不依赖 releases/latest(ADR 0018);本版没有拾阶资产时
      # 通道保持上一版 latest.json
      - name: Sync latest.json to the fixed updates tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"; then
            if ! gh release view ascent-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create ascent-updates --repo "$GITHUB_REPOSITORY" \
                --title "拾阶 更新通道" \
                --notes "只存放 latest.json，供应用内更新器读取，请勿删除。" --latest=false
            fi
            gh release upload ascent-updates "$RUNNER_TEMP/latest.json" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "::notice::本版无拾阶资产，ascent-updates 保持上一版 latest.json。"
          fi

      # 更新通道（ADR 0172）：每个应用一个 <id>.json，放在固定标签 app-updates 下。
      # 只推本次构建出了更新工件的应用；没动的应用通道保持上一版，不会被覆盖。
      - name: Publish app update channels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p channels
          python3 scripts/release_updater.py channels --dist dist --tag "$GITHUB_REF_NAME" \
            --out channels --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          # 拾阶的 latest.json 由 tauri-action 产出，双写一份到新通道（决策 7 的过渡期）
          if [ -f "$RUNNER_TEMP/latest.json" ]; then
            cp "$RUNNER_TEMP/latest.json" channels/ascent.json
          fi
          shopt -s nullglob
          files=(channels/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::本版没有出更新工件的应用，app-updates 保持原样。"
            exit 0
          fi
          if ! gh release view app-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create app-updates --repo "$GITHUB_REPOSITORY" \
              --title "应用更新通道" \
              --notes "每个应用一个 <id>.json，供应用内更新器读取，请勿删除。" --latest=false
          fi
          gh release upload app-updates "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
