name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg
          adwaita-icon-theme hicolor-icon-theme

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: meson compile -C build-release

      - name: Test
        run: meson test -C build-release --print-errorlogs

      - name: Package app and DMG
        run: |
          python3 scripts/package_macos.py \
            --project-root . \
            --binary build-release/athena-cpp \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify architecture and disk image
        shell: bash
        run: |
          file dist/athena-cpp.app/Contents/MacOS/athena-cpp \
            | grep -q "${{ matrix.architecture }}"
          codesign --verify --deep --strict dist/athena-cpp.app
          hdiutil verify \
            "dist/athena-cpp-${{ steps.version.outputs.version }}-macos-${{ matrix.architecture }}.dmg"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-macos-${{ matrix.architecture }}
          path: subjects/cpp/dist/athena-cpp-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler librsvg2-common xvfb \
            squashfs-tools curl ca-certificates

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-linux-release --buildtype=release -Dstrip=true --prefix /usr
          project_version=$(meson introspect build-linux-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-linux-release
          xvfb-run -a meson test -C build-linux-release --print-errorlogs

      - name: Download pinned AppImage tools
        shell: bash
        run: |
          curl -fL --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 --output appimage-runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage-runtime-x86_64" | sha256sum --check

      - name: Package DEB and AppImage
        run: |
          python3 scripts/package_linux.py \
            --project-root . \
            --build-dir build-linux-release \
            --output-dir dist \
            --linuxdeploy ./linuxdeploy-x86_64.AppImage \
            --appimage-runtime ./appimage-runtime-x86_64 \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Linux packages
        shell: bash
        run: |
          dpkg-deb --info "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb"
          dpkg-deb --contents "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb" \
            > deb-contents.txt
          grep -q './usr/bin/athena-cpp' deb-contents.txt
          appimage="dist/athena-cpp-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          test -x "$appimage"
          offset=$("$appimage" --appimage-offset)
          unsquashfs -o "$offset" -l "$appimage" | grep -q 'squashfs-root/usr/bin/athena-cpp'

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-linux-x86_64
          path: |
            subjects/cpp/dist/athena-cpp_*.deb
            subjects/cpp/dist/athena-cpp-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-python

      - name: Read and verify version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-windows-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-windows-release --projectinfo \
            | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-windows-release
          meson test -C build-windows-release --print-errorlogs

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package MSI and zip
        run: |
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          python scripts/package_windows.py \
            --project-root . \
            --binary build-windows-release/athena-cpp.exe \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Windows packages
        shell: pwsh
        working-directory: subjects/cpp
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/athena-cpp-$version-windows-x64.zip"
          $msi = "dist/athena-cpp-$version-windows-x64.msi"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $msi)) { throw "missing $msi" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "bin/athena-cpp.exe") {
              throw "zip is missing bin/athena-cpp.exe"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-windows-x64
          path: |
            subjects/cpp/dist/athena-cpp-*-windows-x64.zip
            subjects/cpp/dist/athena-cpp-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

  # 以下两个 job 的机制分别从独立工作流迁回（ADR 0081）：driver 原 driver-release.yml
  # （版本由 tag 写入 pubspec），拾阶原 ascent-release.yml（Tauri 签名构建、更新器走
  # ascent-updates 固定标签）。签名 key 未配置时拾阶整体跳过，不阻塞其余应用发布。
  driver:
    name: Build driver (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-26.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号 '$v' 不是 x.y.z 形式"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # 版本号由 tag 决定写入 pubspec，发版不需要预先改版本提交（ADR 0081 决策 3）
      - name: Set version
        working-directory: subjects/driver
        shell: bash
        run: |
          sed -i.bak -E "s/^version: .+/version: ${{ steps.version.outputs.value }}+1/" pubspec.yaml
          rm pubspec.yaml.bak

      - name: Enable desktop targets
        working-directory: subjects/driver
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Test
        working-directory: subjects/driver
        run: flutter test

      - name: Build
        working-directory: subjects/driver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows --release
          elif [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

      - name: Package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Release 目录自含:athena-driver.exe、dll 与 data/ 同层,压缩即用
            powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/athena-driver-$version-$platform.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls build/macos/Build/Products/Release | grep '\.app$' | head -1)
            hdiutil create -volname "athena-driver" -srcfolder "build/macos/Build/Products/Release/$app" -ov -format UDZO "dist/athena-driver-$version-$platform.dmg"
          else
            tar -czf "dist/athena-driver-$version-$platform.tar.gz" -C build/linux/x64/release/bundle .
          fi

      - name: Verify package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          platform="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import zipfile,sys; names=zipfile.ZipFile('dist/athena-driver-$version-$platform.zip').namelist(); sys.exit(0 if any(n.endswith('athena-driver.exe') for n in names) else 1)" || { echo 'zip 缺 athena-driver.exe'; exit 1; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil verify "dist/athena-driver-$version-$platform.dmg"
          else
            # 禁止管道匹配:grep -q 提前退出会让写端吃 SIGPIPE,pipefail 下误判失败
            listing=$(tar -tzf "dist/athena-driver-$version-$platform.tar.gz")
            [[ "$listing" == *athena-driver* ]] || { echo 'tar.gz 缺 athena-driver'; exit 1; }
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-driver-${{ matrix.platform }}
          path: subjects/driver/dist/athena-driver-*
          if-no-files-found: error
          retention-days: 7

  ascent:
    name: Build ascent (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    # tauri-action 要以 draft 形态创建统一 Release，需要写权限
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      APP_DIR: subjects/ascent
    steps:
      - name: Resolve version
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号 '$v' 不是 x.y.z 形式"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY 没设置，拾阶跳过构建，其余应用照常发布（ADR 0081）。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: subjects/ascent/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ready == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: subjects/ascent/src-tauri

      - name: Install dependencies
        if: steps.key.outputs.ready == 'true'
        working-directory: subjects/ascent
        run: pnpm install --frozen-lockfile

      - name: Set version
        if: steps.key.outputs.ready == 'true'
        working-directory: subjects/ascent
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      # draft 方式创建统一 Release 并产出 latest.json；资产由 publish job 合流转正（ADR 0081 决策 5）
      - uses: tauri-apps/tauri-action@v0
        if: steps.key.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: subjects/ascent
          tagName: v__VERSION__
          releaseName: Athena v__VERSION__
          releaseBody: 自动构建，提交 ${{ github.sha }}
          releaseDraft: true
          prerelease: false

      - name: Collect updater manifest
        if: steps.key.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p subjects/ascent/dist
          gh release download "v${{ steps.version.outputs.value }}" --pattern latest.json --dir subjects/ascent/dist

      - name: Upload release assets
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: athena-ascent-windows-x64
          path: |
            subjects/ascent/src-tauri/target/release/bundle/nsis/*.exe
            subjects/ascent/dist/latest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [macos, linux, windows, driver, ascent]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # 缺 CHANGELOG 节时要 git log 上一标签..HEAD，需要完整历史与标签。
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: athena-*
          path: dist
          merge-multiple: true

      # 拾阶的签名 key 未配置时没有 Lumi_*.exe，nullglob 让空通配直接消失
      - name: Create checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=(athena-cpp-*.dmg athena-cpp-*.AppImage athena-cpp_*.deb
            athena-cpp-*-windows-x64.zip athena-cpp-*-windows-x64.msi
            athena-driver-*.zip athena-driver-*.dmg athena-driver-*.tar.gz
            Lumi_*.exe)
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        working-directory: subjects/cpp
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 有手写节就用；缺失则统计上一标签至今的提交并写回 CHANGELOG，
          # 再抽出正文。写回只影响本 job 工作树，真正入库靠发版前提交。
          python3 scripts/changelog_notes.py "$version" ../../CHANGELOG.md --write \
            > "${GITHUB_WORKSPACE}/release-notes.md"
          # 页脚链接钉在本标签上，文件日后搬家也不失效；对比链接与 GitHub
          # 自动生成的 Full Changelog 同格式，首个版本没有上一标签就省掉。
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo
            echo "---"
            echo
            echo "完整更新日志见仓库 [\`CHANGELOG.md\`](${repo_url}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)。"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full Changelog**: ${repo_url}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } >> "${GITHUB_WORKSPACE}/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          assets=(dist/athena-cpp-*.dmg dist/athena-cpp-*.AppImage dist/athena-cpp_*.deb
            dist/athena-cpp-*-windows-x64.zip dist/athena-cpp-*-windows-x64.msi
            dist/athena-driver-*.zip dist/athena-driver-*.dmg dist/athena-driver-*.tar.gz
            dist/Lumi_*.exe
            dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 拾阶 tauri-action 以 draft 建的 Release 落到这里:补齐资产后 --draft=false 转正;
            # tag 重跑时同名资产 --clobber 覆盖,说明与标题一并更新。
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --notes-file release-notes.md --title "Athena $version"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "Athena $version"
          fi

      # 拾阶更新器读固定地址,不依赖 releases/latest(ADR 0018);本版没有拾阶资产时
      # 通道保持上一版 latest.json
      - name: Sync latest.json to the fixed updates tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"; then
            if ! gh release view ascent-updates --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create ascent-updates --repo "$GITHUB_REPOSITORY" \
                --title "拾阶 更新通道" \
                --notes "只存放 latest.json，供应用内更新器读取，请勿删除。" --latest=false
            fi
            gh release upload ascent-updates "$RUNNER_TEMP/latest.json" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "::notice::本版无拾阶资产，ascent-updates 保持上一版 latest.json。"
          fi
