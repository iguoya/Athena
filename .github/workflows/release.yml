name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Build ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: >-
          brew install
          meson ninja pkg-config
          gtkmm4 gtksourceview5 md4c nlohmann-json googletest
          blueprint-compiler librsvg
          adwaita-icon-theme hicolor-icon-theme

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: meson compile -C build-release

      - name: Test
        run: meson test -C build-release --print-errorlogs

      - name: Package app and DMG
        run: |
          python3 scripts/package_macos.py \
            --project-root . \
            --binary build-release/athena-cpp \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify architecture and disk image
        shell: bash
        run: |
          file dist/athena-cpp.app/Contents/MacOS/athena-cpp \
            | grep -q "${{ matrix.architecture }}"
          codesign --verify --deep --strict dist/athena-cpp.app
          hdiutil verify \
            "dist/athena-cpp-${{ steps.version.outputs.version }}-macos-${{ matrix.architecture }}.dmg"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-macos-${{ matrix.architecture }}
          path: subjects/cpp/dist/athena-cpp-*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build Linux packages
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config \
            libgtkmm-4.0-dev libgtksourceview-5-dev \
            libmd4c-dev nlohmann-json3-dev libsqlite3-dev \
            libgtest-dev blueprint-compiler librsvg2-common xvfb \
            squashfs-tools curl ca-certificates

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-linux-release --buildtype=release -Dstrip=true --prefix /usr
          project_version=$(meson introspect build-linux-release --projectinfo \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-linux-release
          xvfb-run -a meson test -C build-linux-release --print-errorlogs

      - name: Download pinned AppImage tools
        shell: bash
        run: |
          curl -fL --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 --output appimage-runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  appimage-runtime-x86_64" | sha256sum --check

      - name: Package DEB and AppImage
        run: |
          python3 scripts/package_linux.py \
            --project-root . \
            --build-dir build-linux-release \
            --output-dir dist \
            --linuxdeploy ./linuxdeploy-x86_64.AppImage \
            --appimage-runtime ./appimage-runtime-x86_64 \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Linux packages
        shell: bash
        run: |
          dpkg-deb --info "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb"
          dpkg-deb --contents "dist/athena-cpp_${{ steps.version.outputs.version }}_amd64.deb" \
            > deb-contents.txt
          grep -q './usr/bin/athena-cpp' deb-contents.txt
          appimage="dist/athena-cpp-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"
          test -x "$appimage"
          offset=$("$appimage" --appimage-offset)
          unsquashfs -o "$offset" -l "$appimage" | grep -q 'squashfs-root/usr/bin/athena-cpp'

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-linux-x86_64
          path: |
            subjects/cpp/dist/athena-cpp_*.deb
            subjects/cpp/dist/athena-cpp-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: msys2 {0}
        working-directory: subjects/cpp

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm-4.0
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-md4c
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-python

      - name: Read and verify version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          meson setup build-windows-release --buildtype=release -Dstrip=true
          project_version=$(meson introspect build-windows-release --projectinfo \
            | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [[ "$version" != "$project_version" ]]; then
            echo "Tag version $version does not match Meson version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          meson compile -C build-windows-release
          meson test -C build-windows-release --print-errorlogs

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package MSI and zip
        run: |
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          python scripts/package_windows.py \
            --project-root . \
            --binary build-windows-release/athena-cpp.exe \
            --output-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Verify Windows packages
        shell: pwsh
        working-directory: subjects/cpp
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/athena-cpp-$version-windows-x64.zip"
          $msi = "dist/athena-cpp-$version-windows-x64.msi"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          if (-not (Test-Path $msi)) { throw "missing $msi" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            if ($names -notcontains "bin/athena-cpp.exe") {
              throw "zip is missing bin/athena-cpp.exe"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-cpp-windows-x64
          path: |
            subjects/cpp/dist/athena-cpp-*-windows-x64.zip
            subjects/cpp/dist/athena-cpp-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 7

  driver:
    name: Build driver (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-26.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable desktop targets
        working-directory: subjects/driver
        run: flutter config --no-analytics --enable-macos-desktop --enable-linux-desktop --enable-windows-desktop

      - name: Read and verify version
        id: version
        shell: bash
        working-directory: subjects/driver
        run: |
          version="${GITHUB_REF_NAME#v}"
          pubspec_version=$(sed -n 's/^version: \([0-9.]*\)+[0-9]*$/\1/p' pubspec.yaml)
          if [[ "$version" != "$pubspec_version" ]]; then
            echo "Tag version $version does not match pubspec version $pubspec_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: subjects/driver
        run: flutter test

      - name: Build
        working-directory: subjects/driver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            flutter build windows --release
          elif [ "$RUNNER_OS" = "macOS" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

      - name: Package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          platform="${{ matrix.platform }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Release 目录自含:athena-driver.exe、dll 与 data/ 同层,压缩即用
            powershell -NoProfile -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/athena-driver-$version-$platform.zip' -Force"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            app=$(ls build/macos/Build/Products/Release | grep '\.app$' | head -1)
            hdiutil create -volname "athena-driver" -srcfolder "build/macos/Build/Products/Release/$app" -ov -format UDZO "dist/athena-driver-$version-$platform.dmg"
          else
            tar -czf "dist/athena-driver-$version-$platform.tar.gz" -C build/linux/x64/release/bundle .
          fi

      - name: Verify package
        working-directory: subjects/driver
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          platform="${{ matrix.platform }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -c "import zipfile,sys; names=zipfile.ZipFile('dist/athena-driver-$version-$platform.zip').namelist(); sys.exit(0 if any(n.endswith('athena-driver.exe') for n in names) else 1)" || { echo 'zip 缺 athena-driver.exe'; exit 1; }
          elif [ "$RUNNER_OS" = "macOS" ]; then
            hdiutil verify "dist/athena-driver-$version-$platform.dmg"
          else
            tar -tzf "dist/athena-driver-$version-$platform.tar.gz" | grep -q athena-driver
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: athena-driver-${{ matrix.platform }}
          path: subjects/driver/dist/athena-driver-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [macos, linux, windows, driver]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # 缺 CHANGELOG 节时要 git log 上一标签..HEAD，需要完整历史与标签。
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: athena-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum athena-cpp-*.dmg athena-cpp-*.AppImage athena-cpp_*.deb athena-cpp-*-windows-x64.zip athena-cpp-*-windows-x64.msi athena-driver-*.zip athena-driver-*.dmg athena-driver-*.tar.gz > SHA256SUMS.txt

      - name: Build release notes from CHANGELOG
        working-directory: subjects/cpp
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 有手写节就用；缺失则统计上一标签至今的提交并写回 CHANGELOG，
          # 再抽出正文。写回只影响本 job 工作树，真正入库靠发版前提交。
          python3 scripts/changelog_notes.py "$version" ../../CHANGELOG.md --write \
            > "${GITHUB_WORKSPACE}/release-notes.md"
          {
            echo
            echo "---"
            echo
            echo "完整更新日志见仓库 \`CHANGELOG.md\`。"
          } >> "${GITHUB_WORKSPACE}/release-notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/athena-cpp-*.dmg dist/athena-cpp-*.AppImage dist/athena-cpp_*.deb \
            dist/athena-cpp-*-windows-x64.zip dist/athena-cpp-*-windows-x64.msi \
            dist/athena-driver-*.zip dist/athena-driver-*.dmg dist/athena-driver-*.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "Athena $version"
