<?xml version="1.0" encoding="UTF-8"?>
<!--
  Axler 线性代数精读的图标：一个算子把单位圆映成椭圆，主轴方向是特征方向（本书主线是以算子为中心看线性代数）。
  原创图形，无第三方素材。
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面三处同源（主仓库 ADR 0065）。
  改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <g fill="none" stroke="#1e7a46" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="13" r="6.5" stroke="#7cbf97"/>
    <ellipse cx="13" cy="11" rx="8.5" ry="4.5" transform="rotate(-28 13 11)"/>
    <path d="M11 13 20 7.5" stroke="#3d9c63"/>
    <path d="M20 7.5l-2.4.2M20 7.5l-.6 2.3"/>
  </g>
</svg>
