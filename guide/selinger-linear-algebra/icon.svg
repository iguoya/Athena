<?xml version="1.0" encoding="UTF-8"?>
<!--
  Selinger 线性代数精读的图标：一个 2×2 矩阵（方括号 + 四个格子）。原创图形，无第三方素材。
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面三处同源（主仓库 ADR 0065）。
  改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <g fill="none" stroke="#1f5fbf" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3H4v18h3M17 3h3v18h-3"/>
  </g>
  <g fill="#66b3ff"><rect x="8" y="6.5" width="3.2" height="3.2" rx=".6"/><rect x="12.8" y="6.5" width="3.2" height="3.2" rx=".6"/><rect x="8" y="14.3" width="3.2" height="3.2" rx=".6"/></g>
  <rect x="12.8" y="14.3" width="3.2" height="3.2" rx=".6" fill="#1f5fbf"/>
</svg>
