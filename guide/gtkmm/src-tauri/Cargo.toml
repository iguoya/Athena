[package]
name = "athena-gtkmm"
version = "0.1.0"
description = "Athena gtkmm 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_gtkmm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# bundled：自带 SQLite 源码一起编，不依赖目标机器上有没有 libsqlite3。
# Windows 上没有系统 sqlite3，链系统库这条路走不通（ADR 0047）。
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"

[profile.dev]
# 少带调试信息，链接明显快一截；断到行号仍够用
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
