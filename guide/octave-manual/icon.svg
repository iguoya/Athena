<?xml version="1.0" encoding="UTF-8"?>
<!--
  GNU Octave 手册精读的图标：坐标轴上的一条正弦曲线与一个小矩阵括号（Octave 以矩阵为中心）。原创图形，无第三方素材。
  这份 SVG 就是图标本身：透明底、自带颜色，启动器图块、窗口 / 任务栏 / 标题栏、应用界面三处同源（主仓库 ADR 0065）。
  改完跑 `launcher icons` 重新生成 app.json 里 icon.renders 声明的位图。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
  <g fill="none" stroke="#1f6fb5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 21h18M3 21V3"/>
    <path d="M5 14c2-6 4-6 6 0s4 6 6 0" stroke="#5aa0e0"/>
    <path d="M17 4h-2v5h2M20 4h2v5h-2" transform="translate(-2 -1)"/>
  </g>
</svg>
