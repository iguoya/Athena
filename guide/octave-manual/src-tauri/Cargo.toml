[package]
name = "athena-octave-manual"
version = "0.1.0"
description = "Athena GNU Octave 官方手册精读应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_octave_manual_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：自带 SQLite 源码一起编，不依赖目标机器上有没有 libsqlite3（Windows 没有系统库，ADR 0047）。
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"
