<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="960" height="700" rx="24" fill="#f8fafc"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#1e293b">选择不是口号：每一边都有代价</text>
  <text x="40" y="96" font-size="28" fill="#475569">先说清意图，再核对前提与成本</text>

  <g font-size="28">
    <text x="480" y="142" text-anchor="middle" font-size="27" font-weight="700" fill="#64748b">判断轴</text>

    <rect x="48" y="166" width="864" height="82" rx="16" fill="#e6effa"/>
    <text x="78" y="199" font-weight="700" fill="#285a91">明确类型</text>
    <text x="882" y="199" text-anchor="end" font-weight="700" fill="#285a91">交给推导</text>
    <path d="M276 218 H684" stroke="#285a91" stroke-width="4"/>
    <circle cx="480" cy="218" r="9" fill="#285a91"/>
    <text x="480" y="240" text-anchor="middle" font-size="23" fill="#475569">接口意图 ↔ 减少重复</text>

    <rect x="48" y="262" width="864" height="82" rx="16" fill="#e4f2ec"/>
    <text x="78" y="295" font-weight="700" fill="#27674f">保留副本</text>
    <text x="882" y="295" text-anchor="end" font-weight="700" fill="#27674f">共享原对象</text>
    <path d="M276 314 H684" stroke="#27674f" stroke-width="4"/>
    <circle cx="480" cy="314" r="9" fill="#27674f"/>
    <text x="480" y="336" text-anchor="middle" font-size="23" fill="#475569">独立状态 ↔ 生命周期责任</text>

    <rect x="48" y="358" width="864" height="82" rx="16" fill="#efeafa"/>
    <text x="78" y="391" font-weight="700" fill="#684aa0">复制结果</text>
    <text x="882" y="391" text-anchor="end" font-weight="700" fill="#684aa0">允许资源转移</text>
    <path d="M276 410 H684" stroke="#684aa0" stroke-width="4"/>
    <circle cx="480" cy="410" r="9" fill="#684aa0"/>
    <text x="480" y="432" text-anchor="middle" font-size="23" fill="#475569">保留原状态 ↔ 降低复制成本</text>

    <rect x="48" y="454" width="864" height="82" rx="16" fill="#f8d7da"/>
    <text x="78" y="487" font-weight="700" fill="#842029">保留类型边界</text>
    <text x="882" y="487" text-anchor="end" font-weight="700" fill="#842029">接受转换</text>
    <path d="M276 506 H684" stroke="#b02a37" stroke-width="4"/>
    <circle cx="480" cy="506" r="9" fill="#b02a37"/>
    <text x="480" y="528" text-anchor="middle" font-size="23" fill="#475569">提前拒绝误用 ↔ 兼容外部接口</text>

    <rect x="48" y="550" width="864" height="82" rx="16" fill="#fff3cd"/>
    <text x="78" y="583" font-weight="700" fill="#664d03">增加约束</text>
    <text x="882" y="583" text-anchor="end" font-weight="700" fill="#664d03">保留便利</text>
    <path d="M276 602 H684" stroke="#d99b08" stroke-width="4"/>
    <circle cx="480" cy="602" r="9" fill="#d99b08"/>
    <text x="480" y="624" text-anchor="middle" font-size="23" fill="#475569">编译期保证 ↔ 调用写法简洁</text>
  </g>

  <text x="480" y="674" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">落点取决于接口责任，没有脱离场景的固定答案</text>
</svg>
