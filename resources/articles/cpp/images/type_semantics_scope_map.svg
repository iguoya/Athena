<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="960" height="700" rx="24" fill="#f8fafc"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#1e293b">类型与表达式 · 章节思维导图</text>
  <text x="40" y="96" font-size="28" fill="#475569">四组判断汇入同一条阅读主线</text>

  <path d="M480 330 C390 330 390 195 330 195 M480 330 C570 330 570 195 630 195 M480 330 C390 330 390 465 330 465 M480 330 C570 330 570 465 630 465"
        fill="none" stroke="#94a3b8" stroke-width="4"/>

  <rect x="356" y="254" width="248" height="152" rx="76" fill="#fff3cd" stroke="#d99b08" stroke-width="3"/>
  <text x="480" y="316" text-anchor="middle" font-size="32" font-weight="800" fill="#664d03">读一段 C++</text>
  <text x="480" y="357" text-anchor="middle" font-size="29" fill="#664d03">它在建立什么？</text>
  <text x="480" y="390" text-anchor="middle" font-size="29" fill="#664d03">又在使用什么？</text>

  <g>
    <rect x="48" y="126" width="300" height="150" rx="18" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/>
    <text x="74" y="168" font-size="31" font-weight="800" fill="#084298">类型与约束</text>
    <text x="74" y="208" font-size="28" fill="#334155">允许哪些操作</text>
    <text x="74" y="244" font-size="28" fill="#334155">编译器能检查到哪里</text>

    <rect x="612" y="126" width="300" height="150" rx="18" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
    <text x="638" y="168" font-size="31" font-weight="800" fill="#0f5132">对象与初始化</text>
    <text x="638" y="208" font-size="28" fill="#334155">状态如何建立</text>
    <text x="638" y="244" font-size="28" fill="#334155">对象何时仍然有效</text>

    <rect x="48" y="390" width="300" height="150" rx="18" fill="#e8ddf8" stroke="#6f42c1" stroke-width="2"/>
    <text x="74" y="432" font-size="31" font-weight="800" fill="#59359a">推导与表达式</text>
    <text x="74" y="472" font-size="28" fill="#334155">副本还是别名</text>
    <text x="74" y="508" font-size="28" fill="#334155">类型与值类别分别判断</text>

    <rect x="612" y="390" width="300" height="150" rx="18" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
    <text x="638" y="432" font-size="31" font-weight="800" fill="#842029">转换与边界</text>
    <text x="638" y="472" font-size="28" fill="#334155">保留了什么信息</text>
    <text x="638" y="508" font-size="28" fill="#334155">谁承担剩余前提</text>
  </g>

  <rect x="48" y="584" width="864" height="76" rx="18" fill="#eef2f6" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="616" text-anchor="middle" font-size="27" font-weight="700" fill="#334155">边界继续向外连接</text>
  <text x="480" y="647" text-anchor="middle" font-size="26" fill="#475569">引用 · 类与对象 · RAII · 模板与泛型</text>
