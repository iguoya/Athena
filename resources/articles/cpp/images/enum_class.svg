<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #fbfcfe; stroke: #dfe3ea; stroke-width: 1.5; }
    .title { fill: #1f2933; font-weight: 700; }
    .label { fill: #1f2933; }
    .muted { fill: #5b6472; }
    .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2933; }
    .fail { fill: #e0533d; font-weight: 700; }
    .pass { fill: #1f9d57; font-weight: 700; }
    .edge { stroke: #9aa4b2; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="718" height="370" rx="14" class="card"/>
  <text x="28" y="34" class="title" font-size="17">enum class 建立三道边界，把有限状态留在自己的类型里</text>

  <!-- center box -->
  <rect x="270" y="150" width="180" height="72" rx="10" fill="#eef4ff" stroke="#c7dbff"/>
  <text x="360" y="180" text-anchor="middle" class="code" font-size="12.5">enum class</text>
  <text x="360" y="200" text-anchor="middle" class="code" font-size="12.5">TrafficLight</text>
  <text x="360" y="216" text-anchor="middle" class="muted" font-size="10.5">: unsigned char</text>

  <!-- boundary 1 -->
  <path class="edge" d="M270 172 H120" marker-end="url(#a)"/>
  <rect x="24" y="120" width="230" height="66" rx="9" fill="#fff" stroke="#dfe3ea"/>
  <text x="38" y="142" class="label" font-size="12.5" font-weight="700">① 独立作用域</text>
  <text x="38" y="162" class="code" font-size="11.5">TrafficLight::green</text>
  <text x="38" y="180" class="fail" font-size="11">裸写 green 不可见</text>

  <!-- boundary 2 -->
  <path class="edge" d="M360 222 V270" marker-end="url(#a)"/>
  <rect x="230" y="272" width="260" height="66" rx="9" fill="#fff" stroke="#dfe3ea"/>
  <text x="244" y="294" class="label" font-size="12.5" font-weight="700">② 不隐式转整数</text>
  <text x="244" y="314" class="code" font-size="11.5">int n = light;</text>
  <text x="392" y="314" class="fail" font-size="11">错误</text>
  <text x="244" y="331" class="code" font-size="11.5">static_cast&lt;int&gt;(light)</text>
  <text x="430" y="331" class="pass" font-size="11">显式放行</text>

  <!-- boundary 3 -->
  <path class="edge" d="M450 172 H600" marker-end="url(#a)"/>
  <rect x="466" y="120" width="234" height="66" rx="9" fill="#fff" stroke="#dfe3ea"/>
  <text x="480" y="142" class="label" font-size="12.5" font-weight="700">③ 跨类型不可比</text>
  <text x="480" y="162" class="code" font-size="11.5">light == Other::x</text>
  <text x="480" y="180" class="fail" font-size="11">底层值相同也不行</text>

  <text x="28" y="360" class="muted" font-size="12">指定底层类型服务于存储、序列化或外部协议；读取底层数值时的显式转换，正好提醒“正在离开枚举的类型边界”。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
