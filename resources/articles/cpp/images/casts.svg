<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 386" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #fbfcfe; stroke: #dfe3ea; stroke-width: 1.5; }
    .title { fill: #1f2933; font-weight: 700; }
    .head { fill: #5b6472; font-weight: 700; }
    .name { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2933; font-weight: 700; }
    .cell { fill: #1f2933; }
    .guard { fill: #2f6feb; }
    .muted { fill: #5b6472; }
    .risk { fill: #5b6472; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="718" height="384" rx="14" class="card"/>
  <text x="28" y="34" class="title" font-size="17">四种命名转换：一种审查语言，风险来源各不同</text>

  <text x="30"  y="64" class="head" font-size="12">转换（底色越深 = 越需额外小心）</text>
  <text x="230" y="64" class="head" font-size="12">意图</text>
  <text x="230" y="80" class="head" font-size="11" fill="#2f6feb">能检查 / 保证什么</text>
  <line x1="28" y1="88" x2="692" y2="88" stroke="#e6e9ef"/>

  <g>
    <rect x="28" y="94" width="664" height="62" rx="8" fill="#eaf6ef" stroke="#cfe8d9"/>
    <text x="42" y="120" class="name" font-size="12">static_cast</text>
    <text x="42" y="140" class="risk" font-size="10.5">风险低</text>
    <text x="230" y="116" class="cell" font-size="12.5">已知类型关系或明确数值转换</text>
    <text x="230" y="134" class="guard" font-size="12">编译期检查转换形式是否合法</text>
    <text x="230" y="150" class="muted" font-size="10.5">最常用；窄化仍由调用者自己负责</text>

    <rect x="28" y="164" width="664" height="62" rx="8" fill="#eef4ff" stroke="#cfe0fb"/>
    <text x="42" y="190" class="name" font-size="12">dynamic_cast</text>
    <text x="42" y="210" class="risk" font-size="10.5">风险中</text>
    <text x="230" y="186" class="cell" font-size="12.5">检查多态对象的真实类型</text>
    <text x="230" y="204" class="guard" font-size="12">指针形式失败时返回 nullptr</text>
    <text x="230" y="220" class="muted" font-size="10.5">源类型必须真的具有多态性（有虚函数）</text>

    <rect x="28" y="234" width="664" height="62" rx="8" fill="#fdf1ea" stroke="#f6ddc7"/>
    <text x="42" y="260" class="name" font-size="12">const_cast</text>
    <text x="42" y="280" class="risk" font-size="10.5">风险高</text>
    <text x="230" y="256" class="cell" font-size="12.5">改变 const / volatile 访问限定</text>
    <text x="230" y="274" class="guard" font-size="12">不改变底层对象本身是否为 const</text>
    <text x="230" y="290" class="muted" font-size="10.5">写入原本就 const 的对象是未定义行为</text>

    <rect x="28" y="304" width="664" height="62" rx="8" fill="#fdecea" stroke="#f4c7bf"/>
    <text x="42" y="330" class="name" font-size="12">reinterpret_cast</text>
    <text x="42" y="350" class="risk" font-size="10.5">风险很高</text>
    <text x="230" y="326" class="cell" font-size="12.5">处理受约束的底层表示</text>
    <text x="230" y="344" class="guard" font-size="12">不验证真实类型，解引用不保证安全</text>
    <text x="230" y="360" class="muted" font-size="10.5">通常只在往返保存后原样取回时才定义良好</text>
  </g>

  <text x="28" y="378" class="muted" font-size="11">看到转换先问：普通隐式转换够不够用？数据丢失是不是调用者明确接受的？</text>
</svg>
