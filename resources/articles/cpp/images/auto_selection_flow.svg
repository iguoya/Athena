<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .label { fill: #212529; }
    .muted { fill: #6c757d; }
    .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #212529; font-weight: 600; }
    .decision { fill: #cfe2ff; stroke: #0a58ca; stroke-width: 1.6; }
    .branch-yes { fill: #6c757d; font-weight: 700; }
    .arrow { stroke: #6c757d; stroke-width: 1.6; fill: none; }
    /* 结果卡：Bootstrap alert 标准配色 */
    .r-value { fill: #d1e7dd; stroke: #198754; stroke-width: 1.6; }
    .r-ref   { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.6; }
    .r-view  { fill: #cff4fc; stroke: #0a58ca; stroke-width: 1.6; }
    .t-value { fill: #0f5132; font-weight: 700; }
    .t-ref   { fill: #664d03; font-weight: 700; }
    .t-view  { fill: #055160; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="758" height="428" rx="14" class="card"/>

  <text x="28" y="34" class="title" font-size="16">选 auto / auto&amp; / const auto&amp;：先定意图，再定写法</text>

  <!-- 前提 -->
  <rect x="28" y="48" width="704" height="34" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="42" y="70" class="muted" font-size="12.5">前提：x 是已经存在、且在使用期间一直存活的普通对象（非代理引用）。</text>

  <!-- 判断 1 -->
  <polygon points="150,100 280,138 150,176 20,138" class="decision"/>
  <text x="150" y="133" text-anchor="middle" class="label" font-size="12.5">需要一份可以</text>
  <text x="150" y="150" text-anchor="middle" class="label" font-size="12.5">单独修改的值？</text>

  <path class="arrow" d="M280 138 H430" marker-end="url(#a)"/>
  <text x="330" y="130" class="branch-yes" font-size="12">是</text>
  <rect x="432" y="112" width="300" height="52" rx="9" class="r-value"/>
  <text x="448" y="135" class="code" font-size="13">auto copy = x;</text>
  <text x="448" y="154" class="t-value" font-size="11.5">独立副本 · 改 copy 不动 x · 有一次复制成本</text>

  <path class="arrow" d="M150 176 V210" marker-end="url(#a)"/>
  <text x="160" y="198" class="branch-yes" font-size="12">否</text>

  <!-- 判断 2 -->
  <polygon points="150,214 290,254 150,294 10,254" class="decision"/>
  <text x="150" y="249" text-anchor="middle" class="label" font-size="12.5">需要通过这个名字</text>
  <text x="150" y="266" text-anchor="middle" class="label" font-size="12.5">修改原对象？</text>

  <path class="arrow" d="M290 254 H430" marker-end="url(#a)"/>
  <text x="345" y="246" class="branch-yes" font-size="12">是</text>
  <rect x="432" y="228" width="300" height="52" rx="9" class="r-ref"/>
  <text x="448" y="251" class="code" font-size="13">auto&amp; ref = x;</text>
  <text x="448" y="270" class="t-ref" font-size="11.5">可写别名 · 改 ref 就是改 x · 要求 x 仍存活</text>

  <path class="arrow" d="M150 294 V330" marker-end="url(#a)"/>
  <text x="160" y="316" class="branch-yes" font-size="12">否</text>

  <!-- 结果 3 -->
  <rect x="60" y="332" width="672" height="52" rx="9" class="r-view"/>
  <text x="78" y="355" class="code" font-size="13">const auto&amp; view = x;</text>
  <text x="78" y="374" class="t-view" font-size="11.5">只读别名 · 不复制 · 只观察 x 的当前值，不能经 view 赋值 · 要求 x 仍存活</text>

  <text x="28" y="410" class="muted" font-size="12">“引用总是更快”不是规则：选型要同时权衡意图、复制成本和对象寿命。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
