<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    /* 不铺底色：能力与痛点只靠边框和标题文字的颜色区分，正文一律用中性灰，
       避免整幅图被两片色块切开。 */
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .axis { stroke: #adb5bd; stroke-width: 2; }
    .dot { fill: #0a58ca; }
    .era { fill: #0a58ca; font-weight: 700; }
    /* 加入的能力 = success 绿，暴露的痛点 = orange，取自 @athena_* 语义变量。
       痛点用 orange 而非 warning 黄：黄色文字在白底上对比度不足。 */
    .gain-card { fill: none; stroke: #198754; stroke-width: 1.4; }
    .gain { fill: #198754; font-weight: 700; }
    .pain-card { fill: none; stroke: #fd7e14; stroke-width: 1.4; }
    .pain { fill: #fd7e14; font-weight: 700; }
  </style>
  <rect x="1" y="1" width="958" height="418" rx="14" class="frame"/>

  <text x="28" y="36" class="title" font-size="17">从 C 到现在：每一步都在补一个具体的工程漏洞</text>
  <text x="28" y="60" class="muted" font-size="13">上排是“加入了什么能力”，下排是“它要解决、或因此暴露的痛点”。</text>

  <!-- 能力（上） -->
  <rect x="248" y="110" width="224" height="100" rx="9" class="gain-card"/>
  <text x="266" y="138" class="gain" font-size="13.5">构造函数、引用</text>
  <text x="266" y="164" class="muted" font-size="12">创建对象能表达</text>
  <text x="266" y="186" class="muted" font-size="12">更多意图</text>

  <rect x="488" y="86" width="300" height="124" rx="9" class="gain-card"/>
  <text x="506" y="114" class="gain" font-size="13.5">一次集中整顿</text>
  <text x="506" y="140" class="muted" font-size="12">· 新初始化写法：编译期拦住会丢信息的转换</text>
  <text x="506" y="162" class="muted" font-size="12">· auto：让编译器替你写类型</text>
  <text x="506" y="184" class="muted" font-size="12">· 移动语义：避免大对象反复深拷贝</text>
  <text x="506" y="206" class="muted" font-size="12">· enum class：把枚举关进自己的类型</text>

  <rect x="812" y="130" width="120" height="80" rx="9" class="gain-card"/>
  <text x="828" y="158" class="gain" font-size="13.5">继续推广</text>
  <text x="828" y="184" class="muted" font-size="12">同一套能力</text>
  <text x="828" y="202" class="muted" font-size="12">用到更多场合</text>

  <!-- 轴与年代 -->
  <line x1="48" y1="250" x2="912" y2="250" class="axis"/>
  <circle cx="120" cy="250" r="5" class="dot"/>
  <circle cx="360" cy="250" r="5" class="dot"/>
  <circle cx="646" cy="250" r="5" class="dot"/>
  <circle cx="872" cy="250" r="5" class="dot"/>
  <text x="120" y="238" text-anchor="middle" class="era" font-size="14">C</text>
  <text x="360" y="238" text-anchor="middle" class="era" font-size="14">C++98</text>
  <text x="646" y="238" text-anchor="middle" class="era" font-size="14">C++11（2011）</text>
  <text x="872" y="238" text-anchor="middle" class="era" font-size="14">C++14–20</text>

  <!-- 痛点（下） -->
  <rect x="28" y="276" width="200" height="110" rx="9" class="pain-card"/>
  <text x="46" y="304" class="pain" font-size="13.5">起点的代价</text>
  <text x="46" y="330" class="muted" font-size="12">不查数值溢出，</text>
  <text x="46" y="352" class="muted" font-size="12">变量不保证清零，于是</text>
  <text x="46" y="374" class="muted" font-size="12">“精度丢了”“读到垃圾值”</text>

  <rect x="248" y="276" width="224" height="88" rx="9" class="pain-card"/>
  <text x="266" y="304" class="pain" font-size="13.5">规矩也变复杂</text>
  <text x="266" y="330" class="muted" font-size="12">初始化写法分裂；</text>
  <text x="266" y="352" class="muted" font-size="12">一种强转混多种意图</text>

  <rect x="488" y="276" width="300" height="70" rx="9" class="pain-card"/>
  <text x="506" y="304" class="pain" font-size="13.5">思路：把问题提前</text>
  <text x="506" y="330" class="muted" font-size="12">原来到运行期才暴露的问题，尽量挪到编译期</text>

  <text x="822" y="304" class="muted" font-size="12">要建立的</text>
  <text x="822" y="326" class="muted" font-size="12">判断没有变</text>
</svg>
