<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<!-- 原生 640px 画布，正文 24px（18pt）。填充色表达语义分组，不作纯文字背景。 -->
<rect width="640" height="640" rx="20" fill="#f8fafc"/>
<text x="28" y="46" font-size="30" fill="#1e293b" font-weight="700">从表达能力到判断依据</text>
<text x="28" y="84" font-size="24" fill="#334155" font-weight="400">与本章有关的三个演进阶段</text>
<path d="M51 139 L51 559" stroke="#94a3b8" stroke-width="2" fill="none"/>
<circle cx="51" cy="150" r="9" fill="#285a91"/>
<rect x="78" y="120" width="534" height="152" rx="14" fill="#e6effa"/>
<text x="98" y="153" font-size="24" fill="#285a91" font-weight="700">01 · 早期 C++</text>
<text x="98" y="188" font-size="26" fill="#1e293b" font-weight="700">对象与引用</text>
<text x="98" y="222" font-size="24" fill="#334155" font-weight="400">构造函数表达对象的建立</text>
<text x="98" y="254" font-size="24" fill="#334155" font-weight="400">引用表达对已有对象的使用</text>
<circle cx="51" cy="318" r="9" fill="#27674f"/>
<rect x="78" y="288" width="534" height="152" rx="14" fill="#e4f2ec"/>
<text x="98" y="321" font-size="24" fill="#27674f" font-weight="700">02 · C++11</text>
<text x="98" y="356" font-size="26" fill="#1e293b" font-weight="700">推导与资源转移</text>
<text x="98" y="390" font-size="24" fill="#334155" font-weight="400">类型推导、列表初始化</text>
<text x="98" y="422" font-size="24" fill="#334155" font-weight="400">移动语义、作用域枚举</text>
<circle cx="51" cy="486" r="9" fill="#684aa0"/>
<rect x="78" y="456" width="534" height="152" rx="14" fill="#efeafa"/>
<text x="98" y="489" font-size="24" fill="#684aa0" font-weight="700">03 · C++14—20</text>
<text x="98" y="524" font-size="26" fill="#1e293b" font-weight="700">继续完善表达</text>
<text x="98" y="558" font-size="24" fill="#334155" font-weight="400">扩展类型推导的使用方式</text>
<text x="98" y="590" font-size="24" fill="#334155" font-weight="400">改进结果构造与初始化</text>
</svg>
