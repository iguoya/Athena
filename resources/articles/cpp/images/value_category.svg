<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #fbfcfe; stroke: #dfe3ea; stroke-width: 1.5; }
    .title { fill: #1f2933; font-weight: 700; }
    .q { fill: #2f6feb; font-weight: 700; }
    .label { fill: #1f2933; }
    .muted { fill: #5b6472; }
    .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2933; }
    .edge { stroke: #9aa4b2; stroke-width: 1.6; fill: none; }
    .brace { stroke: #b6a24e; stroke-width: 2; fill: none; }
    .yn { fill: #5b6472; font-style: italic; }
  </style>
  <rect x="1" y="1" width="718" height="428" rx="14" class="card"/>
  <text x="28" y="34" class="title" font-size="17">值类别：属于表达式，用两个判据定位</text>

  <!-- root -->
  <rect x="300" y="48" width="120" height="32" rx="8" fill="#eef1f6" stroke="#dfe3ea"/>
  <text x="360" y="69" text-anchor="middle" class="label" font-size="13">一个表达式</text>
  <path class="edge" d="M360 80 V96"/>

  <!-- Q1 -->
  <text x="360" y="112" text-anchor="middle" class="q" font-size="13.5">有稳定身份（之后还能找到）吗？</text>
  <path class="edge" d="M360 120 V134 H210 V158" marker-end="url(#a)"/>
  <path class="edge" d="M360 120 V134 H565 V214" marker-end="url(#a)"/>
  <text x="286" y="150" class="yn" font-size="11.5">是</text>
  <text x="470" y="150" class="yn" font-size="11.5">否</text>

  <!-- Q2 (left branch) -->
  <text x="210" y="176" text-anchor="middle" class="q" font-size="13">资源允许被搬走吗？</text>
  <path class="edge" d="M210 184 V198 H120 V222" marker-end="url(#a)"/>
  <path class="edge" d="M210 184 V198 H300 V222" marker-end="url(#a)"/>
  <text x="150" y="214" class="yn" font-size="11.5">否</text>
  <text x="264" y="214" class="yn" font-size="11.5">是</text>

  <!-- leaves -->
  <rect x="40" y="224" width="160" height="96" rx="9" fill="#eef4ff" stroke="#c7dbff"/>
  <text x="120" y="248" text-anchor="middle" class="label" font-size="14" font-weight="700">左值 lvalue</text>
  <text x="120" y="270" text-anchor="middle" class="muted" font-size="11.5">有身份，不让搬</text>
  <text x="120" y="296" text-anchor="middle" class="code" font-size="12">具名变量 name</text>

  <rect x="220" y="224" width="160" height="96" rx="9" fill="#fdf1ea" stroke="#f6d4bd"/>
  <text x="300" y="248" text-anchor="middle" class="label" font-size="14" font-weight="700">将亡值 xvalue</text>
  <text x="300" y="270" text-anchor="middle" class="muted" font-size="11.5">有身份，资源可复用</text>
  <text x="300" y="296" text-anchor="middle" class="code" font-size="12">std::move(name)</text>

  <rect x="480" y="224" width="180" height="96" rx="9" fill="#eaf6ef" stroke="#bfe3cd"/>
  <text x="570" y="248" text-anchor="middle" class="label" font-size="14" font-weight="700">纯右值 prvalue</text>
  <text x="570" y="270" text-anchor="middle" class="muted" font-size="11.5">无身份，用于初始化</text>
  <text x="570" y="296" text-anchor="middle" class="code" font-size="12">string("tmp")</text>

  <!-- braces -->
  <path class="brace" d="M40 334 V342 H380 V334"/>
  <text x="210" y="362" text-anchor="middle" class="label" font-size="12.5">glvalue（有身份）</text>

  <path class="brace" d="M220 344 V352 H660 V344"/>
  <text x="440" y="372" text-anchor="middle" class="label" font-size="12.5">rvalue（可绑定到 T&amp;&amp;）</text>

  <text x="40" y="400" class="muted" font-size="12">std::move 不搬运，只把表达式变成将亡值；真正的资源转移发生在之后的移动构造 / 移动赋值里。</text>
  <text x="40" y="419" class="muted" font-size="12">重载解析据此在 string&amp; / const string&amp; / string&amp;&amp; 之间选择。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
