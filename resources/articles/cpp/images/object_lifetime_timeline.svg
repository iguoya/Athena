<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #212529; }
    .t { font-size: 17px; fill: #212529; }
    .s { font-size: 15px; fill: #6c757d; }
    .code { font-size: 16px; font-family: ui-monospace, Menlo, monospace; fill: #343a40; }
  </style>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="32" y="42" class="title">同一个函数里，三个对象各自活多久</text>

  <!-- 时间轴 -->
  <line x1="120" y1="368" x2="836" y2="368" stroke="#adb5bd" stroke-width="2"/>
  <polygon points="836,368 826,363 826,373" fill="#adb5bd"/>
  <text x="120" y="394" class="s">函数开始</text>
  <text x="770" y="394" class="s">函数返回</text>

  <!-- 块作用域对象 -->
  <text x="32" y="100" class="t">块内对象</text>
  <text x="32" y="124" class="s">{ ... }</text>
  <rect x="150" y="80" width="200" height="40" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.6"/>
  <text x="250" y="106" class="t" text-anchor="middle">存在</text>
  <line x1="150" y1="72" x2="150" y2="368" stroke="#198754" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="350" y1="72" x2="350" y2="368" stroke="#198754" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="150" y="66" class="s" text-anchor="middle">进入块</text>
  <text x="350" y="66" class="s" text-anchor="middle">离开块 → 析构</text>

  <!-- 临时对象 -->
  <text x="32" y="190" class="t">语句里的临时对象</text>
  <rect x="404" y="170" width="46" height="40" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6"/>
  <line x1="450" y1="162" x2="450" y2="368" stroke="#997404" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="470" y="196" class="t">分号处（完整表达式末尾）就结束</text>
  <text x="404" y="158" class="s">创建</text>

  <!-- const 引用延长 -->
  <text x="32" y="270" class="t">被 const 引用绑定的临时对象</text>
  <rect x="500" y="250" width="290" height="40" rx="8" fill="#cfe2ff" stroke="#0a58ca" stroke-width="1.6"/>
  <text x="645" y="276" class="t" text-anchor="middle">寿命延长到 kept 的作用域结束</text>
  <line x1="500" y1="242" x2="500" y2="368" stroke="#0a58ca" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="790" y1="242" x2="790" y2="368" stroke="#0a58ca" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="500" y="238" class="s" text-anchor="middle">绑定</text>

  <text x="32" y="330" class="s">绿 = 有名字的局部对象　黄 = 没有名字的临时对象　蓝 = 被 const 引用延长的临时对象</text>
</svg>
