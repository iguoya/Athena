<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #fbfcfe; stroke: #dfe3ea; stroke-width: 1.5; }
    .panel { fill: #f4f7fc; stroke: #dbe2ee; stroke-width: 1.2; }
    .title { fill: #1f2933; font-weight: 700; }
    .sub { fill: #2f6feb; font-weight: 700; }
    .label { fill: #1f2933; }
    .muted { fill: #5b6472; }
    .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2933; }
    .arrow { stroke: #9aa4b2; stroke-width: 1.6; fill: none; }
  </style>
  <rect x="1" y="1" width="718" height="398" rx="14" class="card"/>
  <text x="28" y="36" class="title" font-size="17">auto 与 decltype 回答的是不同的问题</text>

  <!-- auto column -->
  <rect x="24" y="54" width="330" height="320" rx="11" class="panel"/>
  <text x="42" y="82" class="sub" font-size="15">auto ·「声明一个什么样的新变量」</text>

  <rect x="42" y="98" width="294" height="34" rx="7" fill="#fff" stroke="#dfe3ea"/>
  <text x="54" y="120" class="code" font-size="12.5">int x = 42;  int&amp; r = x;</text>

  <path class="arrow" d="M120 140 V166" marker-end="url(#a)"/>
  <path class="arrow" d="M250 140 V166" marker-end="url(#a)"/>

  <rect x="42" y="168" width="140" height="80" rx="8" fill="#eef4ff" stroke="#c7dbff"/>
  <text x="112" y="190" text-anchor="middle" class="code" font-size="12.5">auto c = r;</text>
  <text x="112" y="212" text-anchor="middle" class="muted" font-size="11.5">剥掉 &amp; 和顶层 const</text>
  <text x="112" y="232" text-anchor="middle" class="label" font-size="12">→ int，独立副本</text>

  <rect x="196" y="168" width="140" height="80" rx="8" fill="#eef4ff" stroke="#c7dbff"/>
  <text x="266" y="190" text-anchor="middle" class="code" font-size="12.5">auto&amp; a = r;</text>
  <text x="266" y="212" text-anchor="middle" class="muted" font-size="11.5">显式写下 &amp;</text>
  <text x="266" y="232" text-anchor="middle" class="label" font-size="12">→ int&amp;，共享对象</text>

  <text x="42" y="280" class="muted" font-size="12">先看旁边有没有 &amp; / const，</text>
  <text x="42" y="300" class="muted" font-size="12">再看初始化表达式。</text>
  <text x="42" y="326" class="muted" font-size="12">结构化绑定同一规则：</text>
  <text x="42" y="346" class="code" font-size="11.5">auto [n,s] = p;   // 副本</text>
  <text x="42" y="364" class="code" font-size="11.5">auto&amp; [n,s] = p;  // 别名</text>

  <!-- decltype column -->
  <rect x="366" y="54" width="330" height="320" rx="11" class="panel"/>
  <text x="384" y="82" class="sub" font-size="15">decltype ·「这个名字/表达式的精确类型」</text>

  <rect x="384" y="98" width="294" height="34" rx="7" fill="#fff" stroke="#dfe3ea"/>
  <text x="396" y="120" class="code" font-size="12.5">int value = 7;</text>

  <path class="arrow" d="M460 140 V176" marker-end="url(#a)"/>
  <path class="arrow" d="M600 140 V176" marker-end="url(#a)"/>

  <rect x="384" y="178" width="150" height="92" rx="8" fill="#eef4ff" stroke="#c7dbff"/>
  <text x="459" y="200" text-anchor="middle" class="code" font-size="12">decltype(value)</text>
  <text x="459" y="222" text-anchor="middle" class="muted" font-size="11.5">未加括号的名字</text>
  <text x="459" y="240" text-anchor="middle" class="muted" font-size="11.5">取声明类型</text>
  <text x="459" y="260" text-anchor="middle" class="label" font-size="12.5">→ int</text>

  <rect x="546" y="178" width="150" height="92" rx="8" fill="#fdf1ea" stroke="#f6d4bd"/>
  <text x="621" y="200" text-anchor="middle" class="code" font-size="12">decltype((value))</text>
  <text x="621" y="222" text-anchor="middle" class="muted" font-size="11.5">多一层括号 →</text>
  <text x="621" y="240" text-anchor="middle" class="muted" font-size="11.5">左值表达式</text>
  <text x="621" y="260" text-anchor="middle" class="label" font-size="12.5">→ int&amp;</text>

  <text x="384" y="300" class="muted" font-size="12">对一般表达式，decltype 用引用类型</text>
  <text x="384" y="320" class="muted" font-size="12">保留值类别：</text>
  <text x="384" y="342" class="code" font-size="11.5">左值 → T&amp;   将亡值 → T&amp;&amp;   纯右值 → T</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
