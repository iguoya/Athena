<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="700" rx="24" fill="#f8fafc"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#1e293b">读代码时的判断流程</text>
  <text x="40" y="96" font-size="28" fill="#475569">五个检查点形成预期，再让证据推动回查</text>

  <rect x="40" y="132" width="190" height="92" rx="46" fill="#fff3cd" stroke="#d99b08" stroke-width="3"/>
  <text x="135" y="169" text-anchor="middle" font-size="27" font-weight="700" fill="#664d03">看到一段</text>
  <text x="135" y="202" text-anchor="middle" font-size="27" font-weight="700" fill="#664d03">陌生代码</text>

  <path d="M230 178 H278" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="286" y="126" width="182" height="104" rx="18" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/>
  <text x="377" y="166" text-anchor="middle" font-size="29" font-weight="800" fill="#084298">1 · 认类型</text>
  <text x="377" y="204" text-anchor="middle" font-size="25" fill="#334155">约束了什么</text>

  <path d="M468 178 H516" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="524" y="126" width="182" height="104" rx="18" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
  <text x="615" y="166" text-anchor="middle" font-size="29" font-weight="800" fill="#0f5132">2 · 看初始化</text>
  <text x="615" y="204" text-anchor="middle" font-size="25" fill="#334155">状态可靠吗</text>

  <path d="M706 178 H754" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="762" y="126" width="158" height="104" rx="18" fill="#e8ddf8" stroke="#6f42c1" stroke-width="2"/>
  <text x="841" y="166" text-anchor="middle" font-size="29" font-weight="800" fill="#59359a">3 · 查有效期</text>
  <text x="841" y="204" text-anchor="middle" font-size="25" fill="#334155">对象还在吗</text>

  <path d="M841 230 V280 H694" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="500" y="266" width="186" height="104" rx="18" fill="#cff4fc" stroke="#0d6efd" stroke-width="2"/>
  <text x="593" y="306" text-anchor="middle" font-size="29" font-weight="800" fill="#055160">4 · 辨表达式</text>
  <text x="593" y="344" text-anchor="middle" font-size="25" fill="#334155">怎样参与操作</text>

  <path d="M500 318 H452" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="258" y="266" width="186" height="104" rx="18" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="351" y="306" text-anchor="middle" font-size="29" font-weight="800" fill="#842029">5 · 找转换</text>
  <text x="351" y="344" text-anchor="middle" font-size="25" fill="#334155">信息丢失了吗</text>

  <path d="M258 318 H210 V430 H278" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="286" y="392" width="184" height="90" rx="18" fill="#e6effa" stroke="#285a91" stroke-width="3"/>
  <text x="378" y="428" text-anchor="middle" font-size="29" font-weight="800" fill="#285a91">形成预期</text>
  <text x="378" y="462" text-anchor="middle" font-size="25" fill="#334155">说明依据与前提</text>

  <path d="M470 437 H518" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="526" y="392" width="184" height="90" rx="18" fill="#e4f2ec" stroke="#27674f" stroke-width="3"/>
  <text x="618" y="428" text-anchor="middle" font-size="29" font-weight="800" fill="#27674f">取得证据</text>
  <text x="618" y="462" text-anchor="middle" font-size="25" fill="#334155">编译、运行、诊断</text>

  <path d="M710 437 H758" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <polygon points="836,382 922,437 836,492 750,437" fill="#fff3cd" stroke="#d99b08" stroke-width="3"/>
  <text x="836" y="427" text-anchor="middle" font-size="27" font-weight="800" fill="#664d03">符合</text>
  <text x="836" y="460" text-anchor="middle" font-size="27" font-weight="800" fill="#664d03">预期？</text>

  <path d="M836 492 V568 H135 V232" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="552" text-anchor="middle" font-size="24" font-weight="700" fill="#b02a37">不符合：回查规则、前提与对象有效期</text>

  <path d="M922 437 H942 V612 H710" stroke="#198754" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <rect x="432" y="580" width="270" height="78" rx="18" fill="#d1e7dd" stroke="#198754" stroke-width="3"/>
  <text x="567" y="613" text-anchor="middle" font-size="29" font-weight="800" fill="#0f5132">暂时接受判断</text>
  <text x="567" y="645" text-anchor="middle" font-size="24" fill="#334155">仍不能由一次运行证明总是正确</text>
</svg>
