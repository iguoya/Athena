<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .dot { fill: #0a58ca; }
    .num { fill: #ffffff; font-weight: 700; }
    /* 检查步骤 = 中性白卡，序号用 primary 蓝标出顺序。 */
    .step { fill: #ffffff; stroke: #ced4da; stroke-width: 1.3; }
    .t-step { fill: #212529; font-weight: 700; }
    .arrow { fill: #adb5bd; }
    .flow { stroke: #adb5bd; stroke-width: 1.6; fill: none; }
    /* 闭环节点 = surface_subtle 底；最后一环用 warning 黄强调
       “预期和结果对不上的地方最该记住”，取自 @athena_warning。 */
    .node { fill: #f8f9fa; stroke: #ced4da; stroke-width: 1.3; }
    .t-node { fill: #0a58ca; font-weight: 700; }
    .keep { fill: #fff3cd; stroke: #ffc107; stroke-width: 1.4; }
    .t-keep { fill: #664d03; font-weight: 700; }
    .d-keep { fill: #664d03; }
    .loop { stroke: #0a58ca; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .loop-head { fill: #0a58ca; }
  </style>
  <rect x="1" y="1" width="958" height="382" rx="14" class="frame"/>

  <text x="28" y="34" class="title" font-size="16">拿到一段陌生代码，按这个顺序问自己</text>
  <text x="28" y="55" class="muted" font-size="11.5">五步走完得到的是一个预期，不是答案；答案要靠真实程序给。</text>

  <!-- 五步检查链 -->
  <rect x="28" y="82" width="160" height="84" rx="8" class="step"/>
  <circle cx="46" cy="104" r="10" class="dot"/>
  <text x="46" y="108" text-anchor="middle" class="num" font-size="11">1</text>
  <text x="62" y="108" class="t-step" font-size="12">认类型</text>
  <text x="42" y="132" class="muted" font-size="10.5">类型是什么；</text>
  <text x="42" y="150" class="muted" font-size="10.5">const、引用怎么修饰</text>
  <line x1="192" y1="124" x2="204" y2="124" class="flow"/>
  <polygon points="204,120 212,124 204,128" class="arrow"/>

  <rect x="214" y="82" width="160" height="84" rx="8" class="step"/>
  <circle cx="232" cy="104" r="10" class="dot"/>
  <text x="232" y="108" text-anchor="middle" class="num" font-size="11">2</text>
  <text x="248" y="108" class="t-step" font-size="12">看初始化</text>
  <text x="228" y="132" class="muted" font-size="10.5">值进去会不会丢；</text>
  <text x="228" y="150" class="muted" font-size="10.5">有没有读到没写过的</text>
  <line x1="378" y1="124" x2="390" y2="124" class="flow"/>
  <polygon points="390,120 398,124 390,128" class="arrow"/>

  <rect x="400" y="82" width="160" height="84" rx="8" class="step"/>
  <circle cx="418" cy="104" r="10" class="dot"/>
  <text x="418" y="108" text-anchor="middle" class="num" font-size="11">3</text>
  <text x="434" y="108" class="t-step" font-size="12">判断表达式</text>
  <text x="414" y="132" class="muted" font-size="10.5">持久对象，还是</text>
  <text x="414" y="150" class="muted" font-size="10.5">转瞬即逝的临时结果</text>
  <line x1="564" y1="124" x2="576" y2="124" class="flow"/>
  <polygon points="576,120 584,124 576,128" class="arrow"/>

  <rect x="586" y="82" width="160" height="84" rx="8" class="step"/>
  <circle cx="604" cy="104" r="10" class="dot"/>
  <text x="604" y="108" text-anchor="middle" class="num" font-size="11">4</text>
  <text x="620" y="108" class="t-step" font-size="12">确认转换</text>
  <text x="600" y="132" class="muted" font-size="10.5">跨类型时的检查</text>
  <text x="600" y="150" class="muted" font-size="10.5">落在哪一层</text>
  <line x1="750" y1="124" x2="762" y2="124" class="flow"/>
  <polygon points="762,120 770,124 762,128" class="arrow"/>

  <rect x="772" y="82" width="160" height="84" rx="8" class="step"/>
  <circle cx="790" cy="104" r="10" class="dot"/>
  <text x="790" y="108" text-anchor="middle" class="num" font-size="11">5</text>
  <text x="806" y="108" class="t-step" font-size="12">想到枚举</text>
  <text x="786" y="132" class="muted" font-size="10.5">固定状态值不值得</text>
  <text x="786" y="150" class="muted" font-size="10.5">单独立一个类型</text>

  <!-- 闭环 -->
  <text x="28" y="200" class="muted" font-size="11.5">这套判断不是终点——它的用处是先形成预期，再拿真实程序去验证：</text>

  <rect x="40" y="222" width="190" height="78" rx="9" class="node"/>
  <text x="56" y="246" class="t-node" font-size="12.5">形成预期</text>
  <text x="56" y="268" class="muted" font-size="10.5">按上面的判断，先说出</text>
  <text x="56" y="286" class="muted" font-size="10.5">你觉得会发生什么</text>
  <line x1="234" y1="261" x2="250" y2="261" class="flow"/>
  <polygon points="250,257 258,261 250,265" class="arrow"/>

  <rect x="270" y="222" width="190" height="78" rx="9" class="node"/>
  <text x="286" y="246" class="t-node" font-size="12.5">运行实验</text>
  <text x="286" y="268" class="muted" font-size="10.5">打开对应的成员函数，</text>
  <text x="286" y="286" class="muted" font-size="10.5">看真实源码与输出</text>
  <line x1="464" y1="261" x2="480" y2="261" class="flow"/>
  <polygon points="480,257 488,261 480,265" class="arrow"/>

  <rect x="500" y="222" width="190" height="78" rx="9" class="node"/>
  <text x="516" y="246" class="t-node" font-size="12.5">观察结果</text>
  <text x="516" y="268" class="muted" font-size="10.5">实际发生了什么，</text>
  <text x="516" y="286" class="muted" font-size="10.5">和你说的一样吗</text>
  <line x1="694" y1="261" x2="710" y2="261" class="flow"/>
  <polygon points="710,257 718,261 710,265" class="arrow"/>

  <rect x="730" y="222" width="190" height="78" rx="9" class="keep"/>
  <text x="746" y="246" class="t-keep" font-size="12.5">对照修正</text>
  <text x="746" y="268" class="d-keep" font-size="10.5">对不上的地方，</text>
  <text x="746" y="286" class="d-keep" font-size="10.5">就是最该记住的内容</text>

  <!-- 回到起点 -->
  <path d="M 920 300 L 920 330 Q 920 338 912 338 L 48 338 Q 40 338 40 330 L 40 310" class="loop"/>
  <polygon points="35,312 45,312 40,302" class="loop-head"/>
  <text x="480" y="366" text-anchor="middle" class="muted" font-size="11">修正过的理解会让下一次预期更准——这一章要反复做的就是这件事</text>
</svg>
