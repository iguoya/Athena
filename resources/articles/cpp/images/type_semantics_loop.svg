<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<!-- 原生 640px 画布，正文 24px（18pt）。填充色表达语义分组，不作纯文字背景。 -->
<rect width="640" height="640" rx="20" fill="#f8fafc"/>
<text x="28" y="46" font-size="30" fill="#1e293b" font-weight="700">读代码时的五个检查点</text>
<rect x="28" y="72" width="584" height="66" rx="14" fill="#e6effa"/>
<text x="44" y="100" font-size="24" fill="#285a91" font-weight="700">01</text>
<text x="95" y="100" font-size="24" fill="#1e293b" font-weight="700">认类型</text>
<text x="95" y="128" font-size="24" fill="#334155" font-weight="400">类型表达什么约束</text>
<rect x="28" y="148" width="584" height="66" rx="14" fill="#eef2f6"/>
<text x="44" y="176" font-size="24" fill="#285a91" font-weight="700">02</text>
<text x="95" y="176" font-size="24" fill="#1e293b" font-weight="700">看初始化</text>
<text x="95" y="204" font-size="24" fill="#334155" font-weight="400">是否建立了可用的初始状态</text>
<rect x="28" y="224" width="584" height="66" rx="14" fill="#e6effa"/>
<text x="44" y="252" font-size="24" fill="#285a91" font-weight="700">03</text>
<text x="95" y="252" font-size="24" fill="#1e293b" font-weight="700">查有效期</text>
<text x="95" y="280" font-size="24" fill="#334155" font-weight="400">引用所指的对象是否仍然有效</text>
<rect x="28" y="300" width="584" height="66" rx="14" fill="#eef2f6"/>
<text x="44" y="328" font-size="24" fill="#285a91" font-weight="700">04</text>
<text x="95" y="328" font-size="24" fill="#1e293b" font-weight="700">辨表达式</text>
<text x="95" y="356" font-size="24" fill="#334155" font-weight="400">类型和值类别怎样参与操作</text>
<rect x="28" y="376" width="584" height="66" rx="14" fill="#e6effa"/>
<text x="44" y="404" font-size="24" fill="#285a91" font-weight="700">05</text>
<text x="95" y="404" font-size="24" fill="#1e293b" font-weight="700">找转换</text>
<text x="95" y="432" font-size="24" fill="#334155" font-weight="400">哪些信息与含义需要再次确认</text>
<text x="28" y="498" font-size="24" fill="#27674f" font-weight="700">形成预期 → 编译与运行 → 回查修正</text>
<path d="M28 521 L612 521" stroke="#94a3b8" stroke-width="2" fill="none"/>
<text x="28" y="562" font-size="24" fill="#334155" font-weight="400">以语言规则为依据，以实验为证据。</text>
<text x="28" y="604" font-size="24" fill="#334155" font-weight="400">一次运行正常，不能证明总是正确。</text>
</svg>
