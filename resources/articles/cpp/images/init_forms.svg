<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #212529; }
    .head { font-size: 15px; font-weight: 700; fill: #6c757d; }
    .t { font-size: 15px; fill: #212529; }
    .s { font-size: 14px; fill: #6c757d; }
    .code { font-size: 16px; font-family: ui-monospace, Menlo, monospace; fill: #212529; }
    .verdict { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="32" y="40" class="title">同一个 3.75 进入 int：谁来检查「信息会不会丢」</text>

  <text x="32" y="78" class="head">写法</text>
  <text x="330" y="78" class="head">它提供什么保证</text>
  <text x="638" y="78" class="head">遇到窄化时</text>
  <line x1="32" y1="90" x2="868" y2="90" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- 直接初始化 -->
  <text x="32" y="124" class="code">int direct(7);</text>
  <text x="32" y="146" class="s">直接初始化</text>
  <text x="330" y="124" class="t">按参数调用构造，允许有损转换</text>
  <text x="330" y="146" class="s">截断由你承担</text>
  <rect x="630" y="102" width="238" height="52" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6"/>
  <text x="749" y="134" class="verdict" fill="#842029" text-anchor="middle">放行 · 3.75 变成 3</text>

  <!-- 拷贝初始化 -->
  <text x="32" y="198" class="code">int copied = 8;</text>
  <text x="32" y="220" class="s">拷贝初始化</text>
  <text x="330" y="198" class="t">同样允许有损转换</text>
  <text x="330" y="220" class="s">还会被 explicit 构造函数拒绝</text>
  <rect x="630" y="176" width="238" height="52" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6"/>
  <text x="749" y="208" class="verdict" fill="#842029" text-anchor="middle">放行 · 3.75 变成 3</text>

  <!-- 列表初始化 -->
  <text x="32" y="272" class="code">int listed{9};</text>
  <text x="32" y="294" class="s">列表初始化</text>
  <text x="330" y="272" class="t">把「会不会丢信息」交给编译器</text>
  <text x="330" y="294" class="s">这是它和上面两种的真正区别</text>
  <rect x="630" y="250" width="238" height="52" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.6"/>
  <text x="749" y="282" class="verdict" fill="#0f5132" text-anchor="middle">编译失败 · 拒绝窄化</text>

  <!-- 值初始化 -->
  <text x="32" y="346" class="code">int zero{};</text>
  <text x="32" y="368" class="s">值初始化</text>
  <text x="330" y="346" class="t">保证得到 0，而不是残留的垃圾值</text>
  <text x="330" y="368" class="s">对照：int uninit; 读它是未定义行为</text>
  <rect x="630" y="324" width="238" height="52" rx="8" fill="#cfe2ff" stroke="#0a58ca" stroke-width="1.6"/>
  <text x="749" y="356" class="verdict" fill="#052c65" text-anchor="middle">不涉及转换 · 值为 0</text>

  <line x1="32" y1="398" x2="868" y2="398" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="32" y="428" class="t">四行都得到一个普通的 int。差别不在括号长相，在谁来检查信息丢失。</text>
  <text x="32" y="452" class="s">第三处边界是 explicit：它只挡住不写类型名的隐式转换，写出 ExplicitNumber{3} 仍然可以。</text>
</svg>
