<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .node-title { fill: #212529; font-weight: 700; }
    .node-sub { fill: #495057; }
    .node-grade { fill: #6c757d; }
    /* 填充色只编码"属于哪条线"，对应大纲心智模型：对象看类型/状态/生命周期，
       表达式看类型/值类别，另有一条管类型边界谁来守。
       难度与掌握目标走文字通道，不挤进颜色——大纲那张活的路线图用颜色编码
       掌握目标，两边不共用同一个编码通道。 */
    .n-object { fill: #cfe2ff; stroke: #0a58ca; stroke-width: 1.8; }
    .n-express { fill: #d5f5ec; stroke: #20c997; stroke-width: 1.8; }
    .n-type { fill: #f1f3f5; stroke: #adb5bd; stroke-width: 1.8; }
    .edge { stroke: #6c757d; stroke-width: 1.8; fill: none; }
    .edge-label { fill: #495057; }
  </style>
  <rect x="1" y="1" width="918" height="446" rx="14" class="frame"/>

  <text x="30" y="34" class="title" font-size="17">类型与表达式：七个知识点怎样连成一条线</text>
  <text x="30" y="56" class="muted" font-size="12.5">箭头是先修关系，顺着箭头学；每个节点第三行是难度与要学到的程度。</text>

  <!-- 初始化：唯一的总起点 -->
  <rect x="36" y="80" width="196" height="84" rx="10" class="n-object"/>
  <text x="134" y="105" text-anchor="middle" class="node-title" font-size="14">初始化</text>
  <text x="134" y="125" text-anchor="middle" class="node-sub" font-size="11.5">对象怎样取得初始状态</text>
  <text x="134" y="147" text-anchor="middle" class="node-grade" font-size="11">难度 2 / 5 · 需要精通</text>

  <!-- 对象生命周期 -->
  <rect x="272" y="80" width="206" height="84" rx="10" class="n-object"/>
  <text x="375" y="105" text-anchor="middle" class="node-title" font-size="14">对象生命周期</text>
  <text x="375" y="125" text-anchor="middle" class="node-sub" font-size="11.5">何时开始存在、何时结束</text>
  <text x="375" y="147" text-anchor="middle" class="node-grade" font-size="11">难度 3 / 5 · 需要精通</text>

  <!-- 值类别 -->
  <rect x="518" y="80" width="176" height="84" rx="10" class="n-express"/>
  <text x="606" y="105" text-anchor="middle" class="node-title" font-size="14">值类别</text>
  <text x="606" y="125" text-anchor="middle" class="node-sub" font-size="11.5">左值 / 纯右值 / 将亡值</text>
  <text x="606" y="147" text-anchor="middle" class="node-grade" font-size="11">难度 4 / 5 · 必须掌握</text>

  <!-- decltype：两个前置（类型推导、值类别），排在最右 -->
  <rect x="748" y="134" width="136" height="84" rx="10" class="n-express"/>
  <text x="816" y="159" text-anchor="middle" class="node-title" font-size="14">decltype</text>
  <text x="816" y="179" text-anchor="middle" class="node-sub" font-size="11.5">按表达式取类型</text>
  <text x="816" y="201" text-anchor="middle" class="node-grade" font-size="11">难度 4 / 5 · 一般了解</text>

  <!-- 类型推导 -->
  <rect x="272" y="200" width="206" height="84" rx="10" class="n-express"/>
  <text x="375" y="225" text-anchor="middle" class="node-title" font-size="14">类型推导</text>
  <text x="375" y="245" text-anchor="middle" class="node-sub" font-size="11.5">auto 补类型，意图仍归你</text>
  <text x="375" y="267" text-anchor="middle" class="node-grade" font-size="11">难度 3 / 5 · 需要精通</text>

  <!-- 类型转换：排在初始化正下方，边最短 -->
  <rect x="36" y="200" width="196" height="84" rx="10" class="n-type"/>
  <text x="134" y="225" text-anchor="middle" class="node-title" font-size="14">类型转换</text>
  <text x="134" y="245" text-anchor="middle" class="node-sub" font-size="11.5">意图与检查在哪一层</text>
  <text x="134" y="267" text-anchor="middle" class="node-grade" font-size="11">难度 2 / 5 · 必须掌握</text>

  <!-- enum class：没有前置，独立起点 -->
  <rect x="36" y="320" width="196" height="84" rx="10" class="n-type"/>
  <text x="134" y="345" text-anchor="middle" class="node-title" font-size="14">enum class</text>
  <text x="134" y="365" text-anchor="middle" class="node-sub" font-size="11.5">一组状态值得有独立类型</text>
  <text x="134" y="387" text-anchor="middle" class="node-grade" font-size="11">难度 1 / 5 · 必须掌握</text>

  <!-- 初始化 → 对象生命周期 -->
  <path class="edge" d="M232 106 H272" marker-end="url(#a)"/>
  <!-- 初始化 → 类型推导 -->
  <path class="edge" d="M232 128 H252 V232 H272" marker-end="url(#a)"/>
  <!-- 初始化 → 类型转换 -->
  <path class="edge" d="M134 164 V200" marker-end="url(#a)"/>
  <!-- 对象生命周期 → 值类别 -->
  <path class="edge" d="M478 112 H518" marker-end="url(#a)"/>
  <!-- 值类别 → decltype -->
  <path class="edge" d="M694 112 H721 V156 H748" marker-end="url(#a)"/>
  <!-- 类型推导 → decltype -->
  <path class="edge" d="M478 232 H721 V188 H748" marker-end="url(#a)"/>

  <text x="504" y="268" class="edge-label" font-size="11">decltype 的规则要用值类别说明，值类别要先知道临时对象何时销毁。</text>
  <text x="36" y="424" class="edge-label" font-size="11">enum class 没有前置，随时可以先学。</text>

  <!-- 图例 -->
  <rect x="504" y="288" width="380" height="116" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
  <rect x="520" y="304" width="16" height="12" rx="3" class="n-object"/>
  <text x="544" y="315" class="muted" font-size="11.5">对象：怎样建立、活多久</text>
  <rect x="520" y="326" width="16" height="12" rx="3" class="n-express"/>
  <text x="544" y="337" class="muted" font-size="11.5">表达式：怎样参与传递、绑定与重载</text>
  <rect x="520" y="348" width="16" height="12" rx="3" class="n-type"/>
  <text x="544" y="359" class="muted" font-size="11.5">类型边界：谁来替你挡住误用</text>
  <text x="520" y="384" class="muted" font-size="11">需要精通 &gt; 必须掌握 &gt; 一般了解；难度高不代表可以不掌握。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
