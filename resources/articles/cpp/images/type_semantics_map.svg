<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .node-title { fill: #212529; font-weight: 700; }
    .node-sub { fill: #495057; }
    /* 三条线各一个色相，对应大纲的心智模型：对象看类型/状态/生命周期，
       表达式看类型/值类别，另有一条管类型边界谁来守。
       这里只编码"属于哪条线"，不编码难度或掌握目标——那是大纲里那张
       活的知识点路线图的事，两张图不共用一套视觉编码。 */
    .n-object { fill: #cfe2ff; stroke: #0a58ca; stroke-width: 1.8; }
    .n-express { fill: #d5f5ec; stroke: #20c997; stroke-width: 1.8; }
    .n-type { fill: #f1f3f5; stroke: #adb5bd; stroke-width: 1.8; }
    .edge { stroke: #6c757d; stroke-width: 1.8; fill: none; }
    .edge-label { fill: #495057; }
  </style>
  <rect x="1" y="1" width="918" height="438" rx="14" class="frame"/>

  <text x="30" y="36" class="title" font-size="17">类型与表达式：七个知识点怎样连成一条线</text>
  <text x="30" y="58" class="muted" font-size="12.5">箭头是先修关系：顺着箭头学，跳着学会在后面卡住。</text>

  <!-- 初始化：唯一的总起点 -->
  <rect x="36" y="82" width="196" height="64" rx="10" class="n-object"/>
  <text x="134" y="109" text-anchor="middle" class="node-title" font-size="14">初始化</text>
  <text x="134" y="130" text-anchor="middle" class="node-sub" font-size="11.5">对象怎样取得初始状态</text>

  <!-- 对象生命周期 -->
  <rect x="272" y="82" width="206" height="64" rx="10" class="n-object"/>
  <text x="375" y="109" text-anchor="middle" class="node-title" font-size="14">对象生命周期</text>
  <text x="375" y="130" text-anchor="middle" class="node-sub" font-size="11.5">何时开始存在、何时结束</text>

  <!-- 值类别 -->
  <rect x="518" y="82" width="176" height="64" rx="10" class="n-express"/>
  <text x="606" y="109" text-anchor="middle" class="node-title" font-size="14">值类别</text>
  <text x="606" y="130" text-anchor="middle" class="node-sub" font-size="11.5">左值 / 纯右值 / 将亡值</text>

  <!-- decltype：两个前置（类型推导、值类别），排在最右 -->
  <rect x="748" y="126" width="136" height="64" rx="10" class="n-express"/>
  <text x="816" y="153" text-anchor="middle" class="node-title" font-size="14">decltype</text>
  <text x="816" y="174" text-anchor="middle" class="node-sub" font-size="11.5">按表达式取类型</text>

  <!-- 类型推导 -->
  <rect x="272" y="182" width="206" height="64" rx="10" class="n-express"/>
  <text x="375" y="209" text-anchor="middle" class="node-title" font-size="14">类型推导</text>
  <text x="375" y="230" text-anchor="middle" class="node-sub" font-size="11.5">auto 补类型，意图仍归你</text>

  <!-- 类型转换：排在初始化正下方，边最短 -->
  <rect x="36" y="182" width="196" height="64" rx="10" class="n-type"/>
  <text x="134" y="209" text-anchor="middle" class="node-title" font-size="14">类型转换</text>
  <text x="134" y="230" text-anchor="middle" class="node-sub" font-size="11.5">意图与检查在哪一层</text>

  <!-- enum class：没有前置，独立起点 -->
  <rect x="36" y="282" width="196" height="64" rx="10" class="n-type"/>
  <text x="134" y="309" text-anchor="middle" class="node-title" font-size="14">enum class</text>
  <text x="134" y="330" text-anchor="middle" class="node-sub" font-size="11.5">一组状态值得有独立类型</text>

  <!-- 初始化 → 对象生命周期 -->
  <path class="edge" d="M232 108 H272" marker-end="url(#a)"/>
  <!-- 初始化 → 类型推导 -->
  <path class="edge" d="M232 124 H252 V214 H272" marker-end="url(#a)"/>
  <!-- 初始化 → 类型转换 -->
  <path class="edge" d="M134 146 V182" marker-end="url(#a)"/>
  <!-- 对象生命周期 → 值类别 -->
  <path class="edge" d="M478 114 H518" marker-end="url(#a)"/>
  <!-- 值类别 → decltype -->
  <path class="edge" d="M694 114 H721 V146 H748" marker-end="url(#a)"/>
  <!-- 类型推导 → decltype -->
  <path class="edge" d="M478 214 H721 V170 H748" marker-end="url(#a)"/>

  <text x="504" y="250" class="edge-label" font-size="11">decltype 的规则要用值类别说明，值类别要先知道临时对象何时销毁。</text>
  <text x="36" y="370" class="edge-label" font-size="11">enum class 没有前置，随时可以先学。</text>

  <!-- 图例 -->
  <rect x="504" y="270" width="380" height="88" rx="10" fill="#f8f9fa" stroke="#dee2e6"/>
  <rect x="520" y="286" width="16" height="12" rx="3" class="n-object"/>
  <text x="544" y="297" class="muted" font-size="11.5">对象：怎样建立、活多久</text>
  <rect x="520" y="308" width="16" height="12" rx="3" class="n-express"/>
  <text x="544" y="319" class="muted" font-size="11.5">表达式：怎样参与传递、绑定与重载</text>
  <rect x="520" y="330" width="16" height="12" rx="3" class="n-type"/>
  <text x="544" y="341" class="muted" font-size="11.5">类型边界：谁来替你挡住误用</text>

  <text x="30" y="408" class="muted" font-size="11.5">难度与掌握目标不画在这里——那在「教学大纲」的知识点路线图上，它还会显示你当前的熟练度。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
