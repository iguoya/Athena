<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .card-title { font-weight: 700; }
    .row-key { fill: #212529; font-weight: 700; }
    .row-val { fill: #495057; }
    /* 与 type_semantics_map.svg 同一套视觉语言：蓝=对象，青=表达式。 */
    .c-object { fill: #cfe2ff; stroke: #0a58ca; stroke-width: 1.8; }
    .c-express { fill: #d5f5ec; stroke: #20c997; stroke-width: 1.8; }
    .edge { stroke: #6c757d; stroke-width: 1.8; fill: none; }
    .edge-label { fill: #495057; }
  </style>
  <rect x="1" y="1" width="918" height="398" rx="14" class="frame"/>

  <text x="30" y="34" class="title" font-size="17">对象与表达式：先分清，再看联系</text>
  <text x="30" y="56" class="muted" font-size="12.5">多个表达式可以指向同一个对象——写法不同，不一定意味着多出了一份对象。</text>

  <!-- 对象 -->
  <rect x="30" y="78" width="330" height="196" rx="12" class="c-object"/>
  <text x="52" y="108" class="card-title" fill="#052c65" font-size="14.5">对象 · 承载状态的实体</text>
  <text x="52" y="142" class="row-key" font-size="12.5">类型</text>
  <text x="132" y="142" class="row-val" font-size="12.5">允许哪些操作，编译器能查什么</text>
  <text x="52" y="180" class="row-key" font-size="12.5">状态</text>
  <text x="132" y="180" class="row-val" font-size="12.5">是否已初始化，此刻承载什么</text>
  <text x="52" y="218" class="row-key" font-size="12.5">生命周期</text>
  <text x="132" y="218" class="row-val" font-size="12.5">何时开始、何时结束，此刻是否有效</text>
  <text x="52" y="252" class="muted" font-size="11.5">三样都要看，缺一样就判断不了这次访问安不安全。</text>

  <!-- 表达式 -->
  <rect x="560" y="78" width="330" height="196" rx="12" class="c-express"/>
  <text x="582" y="108" class="card-title" fill="#0f5132" font-size="14.5">表达式 · 参与求值的代码</text>
  <text x="582" y="142" class="row-key" font-size="12.5">类型</text>
  <text x="662" y="142" class="row-val" font-size="12.5">产生或指向什么类型的结果</text>
  <text x="582" y="180" class="row-key" font-size="12.5">值类别</text>
  <text x="662" y="180" class="row-val" font-size="12.5">左值 / 纯右值 / 将亡值</text>
  <text x="662" y="212" class="row-val" font-size="12.5">决定能绑定到哪种引用、选中哪个重载</text>
  <text x="582" y="252" class="muted" font-size="11.5">只有两样，没有"生命周期"这一项——那是对象的属性。</text>

  <!-- 两者的联系：两条都是表达式作用于对象 -->
  <path class="edge" d="M560 150 H370" marker-end="url(#a)"/>
  <text x="465" y="140" text-anchor="middle" class="edge-label" font-size="11.5">指向已有对象</text>
  <path class="edge" d="M560 206 H370" marker-end="url(#a)"/>
  <text x="465" y="196" text-anchor="middle" class="edge-label" font-size="11.5">提供初始化的值</text>

  <!-- 最容易混的两处 -->
  <rect x="30" y="292" width="860" height="90" rx="12" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="52" y="318" class="title" font-size="12.5">这两样必须分别判断，不能互相推断</text>
  <text x="52" y="344" class="row-val" font-size="12.5">值类别不等于对象寿命</text>
  <text x="470" y="344" class="row-val" font-size="12.5">允许移动不等于真的发生了移动</text>
  <text x="52" y="368" class="muted" font-size="11.5">判断值类别还要看类型、可用操作和使用场景；生命周期只说明对象此刻是否有效。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
