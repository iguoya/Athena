<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<!-- 原生 640px 画布，正文 24px（18pt）。填充色表达语义分组，不作纯文字背景。 -->
<rect width="640" height="640" rx="20" fill="#f8fafc"/>
<text x="28" y="46" font-size="30" fill="#1e293b" font-weight="700">对象与表达式：分清，再联系</text>
<rect x="28" y="72" width="584" height="154" rx="14" fill="#e6effa"/>
<text x="48" y="108" font-size="26" fill="#285a91" font-weight="700">对象 · 承载状态的实体</text>
<text x="48" y="146" font-size="24" fill="#334155" font-weight="400">类型：允许哪些操作</text>
<text x="48" y="178" font-size="24" fill="#334155" font-weight="400">状态：是否初始化、当前承载什么</text>
<text x="48" y="210" font-size="24" fill="#334155" font-weight="400">生命周期：何时有效</text>
<path d="M48 334 L48 228" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M590 334 L590 228" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M42 240 L48 228 L54 240 M584 240 L590 228 L596 240" fill="none" stroke="#94a3b8" stroke-width="2"/>
<text x="70" y="286" font-size="24" fill="#285a91" font-weight="400">指向已有对象</text>
<text x="332" y="286" font-size="24" fill="#684aa0" font-weight="400">提供初始化的值</text>
<rect x="28" y="338" width="584" height="144" rx="14" fill="#efeafa"/>
<text x="48" y="376" font-size="26" fill="#684aa0" font-weight="700">表达式 · 参与求值的代码</text>
<text x="48" y="418" font-size="24" fill="#334155" font-weight="400">类型 ＋ 值类别</text>
<text x="48" y="454" font-size="24" fill="#334155" font-weight="400">参与引用绑定、重载选择等规则</text>
<text x="28" y="534" font-size="26" fill="#1e293b" font-weight="700">两个问题需要分别判断</text>
<text x="28" y="574" font-size="24" fill="#334155" font-weight="400">值类别不等于对象寿命。</text>
<text x="28" y="608" font-size="24" fill="#334155" font-weight="400">允许移动，也不保证实际发生移动。</text>
</svg>
