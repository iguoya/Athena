<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    /* 不铺底色：分组和层级只用细线框与文字颜色表达，版面更安静。 */
    .frame { fill: #ffffff; stroke: #dee2e6; stroke-width: 1.5; }
    .title { fill: #212529; font-weight: 700; }
    .muted { fill: #6c757d; }
    .card { fill: none; stroke: #ced4da; stroke-width: 1.3; }
    .group { fill: none; stroke: #dee2e6; stroke-width: 1.3; stroke-dasharray: 5 4; }
    /* 对象一侧 = primary 蓝，表达式一侧 = purple，取自 @athena_* 语义变量。 */
    .obj { fill: #0a58ca; font-weight: 700; }
    .expr { fill: #6f42c1; font-weight: 700; }
    .link { stroke: #adb5bd; stroke-width: 1.6; fill: none; }
    .arrow { fill: #adb5bd; }
  </style>
  <rect x="1" y="1" width="958" height="410" rx="14" class="frame"/>

  <text x="28" y="36" class="title" font-size="17">整章压缩成两句话</text>
  <text x="28" y="59" class="muted" font-size="13">初始化、类型推导、值类别、类型转换、枚举，全都是这两句话的推论。</text>

  <!-- 左：对象 -->
  <rect x="28" y="80" width="440" height="300" rx="10" class="group"/>
  <text x="48" y="108" class="obj" font-size="15">一个对象有三个属性</text>

  <rect x="48" y="122" width="400" height="76" rx="8" class="card"/>
  <text x="66" y="148" class="obj" font-size="14">类型</text>
  <text x="66" y="170" class="muted" font-size="12.5">它是什么，能对它做哪些操作，编译器能替你检查什么。</text>
  <text x="66" y="188" class="muted" font-size="12.5">const 是类型的一部分，不是贴在旁边的标签。</text>

  <rect x="48" y="208" width="400" height="76" rx="8" class="card"/>
  <text x="66" y="234" class="obj" font-size="14">值</text>
  <text x="66" y="256" class="muted" font-size="12.5">此刻它存着什么。</text>
  <text x="66" y="274" class="muted" font-size="12.5">值怎么第一次进去，就是初始化要回答的问题。</text>

  <rect x="48" y="294" width="400" height="76" rx="8" class="card"/>
  <text x="66" y="320" class="obj" font-size="14">生命周期</text>
  <text x="66" y="342" class="muted" font-size="12.5">什么时候诞生、什么时候消失、谁负责结束它。</text>
  <text x="66" y="360" class="muted" font-size="12.5">引用和临时结果的多数事故，根子都在这一条。</text>

  <!-- 右：表达式 -->
  <rect x="492" y="80" width="440" height="300" rx="10" class="group"/>
  <text x="512" y="108" class="expr" font-size="15">一个表达式有两个属性</text>

  <rect x="512" y="122" width="400" height="76" rx="8" class="card"/>
  <text x="530" y="148" class="expr" font-size="14">类型</text>
  <text x="530" y="170" class="muted" font-size="12.5">这个表达式算出来的结果是什么。</text>
  <text x="530" y="188" class="muted" font-size="12.5">和对象的类型是同一个概念。</text>

  <rect x="512" y="208" width="400" height="162" rx="8" class="card"/>
  <text x="530" y="234" class="expr" font-size="14">值类别</text>
  <text x="530" y="256" class="muted" font-size="12.5">能拿这个结果做什么：</text>
  <text x="530" y="278" class="muted" font-size="12.5">· 能不能取它的地址</text>
  <text x="530" y="300" class="muted" font-size="12.5">· 能绑到哪一种引用上</text>
  <text x="530" y="322" class="muted" font-size="12.5">· 能不能把它的资源搬走</text>
  <text x="530" y="352" class="expr" font-size="12.5">有名字 ≠ 不能被搬走——这是最反直觉的一点。</text>

</svg>
