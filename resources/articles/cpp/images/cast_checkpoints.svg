<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #212529; }
    .head { font-size: 15px; font-weight: 700; fill: #6c757d; }
    .name { font-size: 16px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; fill: #212529; }
    .t { font-size: 15px; fill: #212529; }
    .s { font-size: 14px; fill: #6c757d; }
    .who { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="32" y="40" class="title">五种转换，差别在「编译器替你把关到哪一步」</text>

  <text x="32" y="76" class="head">怎么写出来的</text>
  <text x="268" y="76" class="head">你在声明什么意图</text>
  <text x="596" y="76" class="head">谁来检查</text>
  <line x1="32" y1="88" x2="868" y2="88" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- 隐式转换 -->
  <text x="32" y="122" class="name">（不写）</text>
  <text x="32" y="144" class="s">隐式转换</text>
  <text x="268" y="122" class="t">你什么也没声明，它自己发生了</text>
  <text x="268" y="144" class="s">传参、赋值、算术提升时随处可见</text>
  <rect x="588" y="100" width="280" height="54" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1.6"/>
  <text x="604" y="122" class="who" fill="#842029">不检查，而且不显眼</text>
  <text x="604" y="143" class="s">代码里搜不到，最难复查</text>

  <!-- static_cast -->
  <text x="32" y="196" class="name">static_cast</text>
  <text x="32" y="218" class="s">最常用的一种</text>
  <text x="268" y="196" class="t">这两个类型确实相关，按规则转过去</text>
  <text x="268" y="218" class="s">数值类型之间、继承体系里向上转</text>
  <rect x="588" y="174" width="280" height="54" rx="8" fill="#cfe2ff" stroke="#0a58ca" stroke-width="1.6"/>
  <text x="604" y="196" class="who" fill="#052c65">编译期：类型关系</text>
  <text x="604" y="217" class="s">范围与精度仍由你保证</text>

  <!-- dynamic_cast -->
  <text x="32" y="270" class="name">dynamic_cast</text>
  <text x="32" y="292" class="s">唯一会真查的一种</text>
  <text x="268" y="270" class="t">我不确定它到底是哪个派生类，帮我查</text>
  <text x="268" y="292" class="s">多态类型的向下转换</text>
  <rect x="588" y="248" width="280" height="54" rx="8" fill="#d1e7dd" stroke="#198754" stroke-width="1.6"/>
  <text x="604" y="270" class="who" fill="#0f5132">运行期：真实类型</text>
  <text x="604" y="291" class="s">失败给 nullptr 或抛异常，有开销</text>

  <!-- const_cast -->
  <text x="32" y="344" class="name">const_cast</text>
  <text x="32" y="366" class="s">改的是访问路径</text>
  <text x="268" y="344" class="t">这条路径上的 const 由我负责去掉</text>
  <text x="268" y="366" class="s">对接不带 const 的旧接口</text>
  <rect x="588" y="322" width="280" height="54" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6"/>
  <text x="604" y="344" class="who" fill="#664d03">不检查：前提你担保</text>
  <text x="604" y="365" class="s">对象本来是 const 就是未定义行为</text>

  <!-- reinterpret_cast -->
  <text x="32" y="418" class="name">reinterpret_cast</text>
  <text x="32" y="440" class="s">最后才考虑</text>
  <text x="268" y="418" class="t">把这段内存按另一种类型重新解释</text>
  <text x="268" y="440" class="s">和硬件、协议字节打交道</text>
  <rect x="588" y="396" width="280" height="54" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6"/>
  <text x="604" y="418" class="who" fill="#664d03">不检查：连关系都不看</text>
  <text x="604" y="439" class="s">平台相关，最容易出错</text>

  <line x1="32" y1="472" x2="868" y2="472" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="32" y="502" class="t">底色 = 编译器替你把关到哪一步：蓝 编译期查类型关系 · 绿 运行期查真实类型 · 黄 不查但意图写在代码里 · 红 不查且代码里看不见</text>
  <text x="32" y="532" class="s">四种命名转换各自写出来，为的就是让意图留在代码里、能被搜索到——C 风格的 (int)x 会自己挑一种，读的人看不出是哪种。</text>
</svg>
