<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <rect width="960" height="640" rx="24" fill="#f8fafc"/>
  <text x="40" y="58" font-size="38" font-weight="800" fill="#1e293b">六类“看起来没问题”的风险</text>
  <text x="40" y="96" font-size="28" fill="#475569">从现象回到类型、对象、表达式与边界</text>

  <path d="M480 320 L255 190 M480 320 L705 190 M480 320 L230 335 M480 320 L730 335 M480 320 L255 490 M480 320 L705 490"
        fill="none" stroke="#94a3b8" stroke-width="3"/>

  <circle cx="480" cy="320" r="104" fill="#fff3cd" stroke="#d99b08" stroke-width="3"/>
  <text x="480" y="306" text-anchor="middle" font-size="31" font-weight="800" fill="#664d03">代码能够通过</text>
  <text x="480" y="345" text-anchor="middle" font-size="28" fill="#664d03">仍需继续判断</text>

  <g>
    <rect x="48" y="126" width="300" height="118" rx="18" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
    <text x="72" y="168" font-size="30" font-weight="700" fill="#842029">信息丢失</text>
    <text x="72" y="207" font-size="27" fill="#334155">范围、符号、精度改变</text>

    <rect x="612" y="126" width="300" height="118" rx="18" fill="#cff4fc" stroke="#0d6efd" stroke-width="2"/>
    <text x="636" y="168" font-size="30" font-weight="700" fill="#055160">初始状态不可靠</text>
    <text x="636" y="207" font-size="27" fill="#334155">读取尚未正确建立的值</text>

    <rect x="28" y="276" width="300" height="118" rx="18" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/>
    <text x="52" y="318" font-size="30" font-weight="700" fill="#084298">改到副本</text>
    <text x="52" y="357" font-size="27" fill="#334155">真实意图是访问原对象</text>

    <rect x="632" y="276" width="300" height="118" rx="18" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
    <text x="656" y="318" font-size="30" font-weight="700" fill="#842029">悬垂访问</text>
    <text x="656" y="357" font-size="27" fill="#334155">引用活得比对象更久</text>

    <rect x="48" y="426" width="300" height="118" rx="18" fill="#d1e7dd" stroke="#198754" stroke-width="2"/>
    <text x="72" y="468" font-size="30" font-weight="700" fill="#0f5132">隐藏复制</text>
    <text x="72" y="507" font-size="27" fill="#334155">时间与内存代价被忽略</text>

    <rect x="612" y="426" width="300" height="118" rx="18" fill="#e8ddf8" stroke="#6f42c1" stroke-width="2"/>
    <text x="636" y="468" font-size="30" font-weight="700" fill="#59359a">含义混用</text>
    <text x="636" y="507" font-size="27" fill="#334155">整数、枚举、转换无边界</text>
  </g>

  <text x="480" y="600" text-anchor="middle" font-size="28" font-weight="700" fill="#285a91">先识别风险，再寻找能够证明判断的语言规则</text>
</svg>
