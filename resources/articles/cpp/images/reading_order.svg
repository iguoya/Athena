<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system, 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif">
  <style>
    .card { fill: #fbfcfe; stroke: #dfe3ea; stroke-width: 1.5; }
    .title { fill: #1f2933; font-weight: 700; }
    .step { fill: #eef4ff; stroke: #c7dbff; stroke-width: 1.3; }
    .num { fill: #2f6feb; font-weight: 700; }
    .label { fill: #1f2933; }
    .muted { fill: #5b6472; }
    .code { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2933; }
    .edge { stroke: #9aa4b2; stroke-width: 1.8; fill: none; }
  </style>
  <rect x="1" y="1" width="718" height="298" rx="14" class="card"/>
  <text x="28" y="36" class="title" font-size="17">读一段陌生声明或表达式，重复这个顺序</text>

  <g>
    <rect x="24"  y="60" width="128" height="150" rx="10" class="step"/>
    <text x="40" y="86" class="num" font-size="15">1</text>
    <text x="40" y="112" class="label" font-size="12.5">找类型</text>
    <text x="40" y="134" class="muted" font-size="11">标出</text>
    <text x="40" y="152" class="code" font-size="12">const</text>
    <text x="40" y="170" class="code" font-size="12">&amp;  &amp;&amp;</text>

    <rect x="172" y="60" width="128" height="150" rx="10" class="step"/>
    <text x="188" y="86" class="num" font-size="15">2</text>
    <text x="188" y="112" class="label" font-size="12.5">看初始化形式</text>
    <text x="188" y="134" class="muted" font-size="11">窄化检查</text>
    <text x="188" y="152" class="muted" font-size="11">explicit 边界</text>

    <rect x="320" y="60" width="128" height="150" rx="10" class="step"/>
    <text x="336" y="86" class="num" font-size="15">3</text>
    <text x="336" y="112" class="label" font-size="12.5">判断值类别</text>
    <text x="336" y="134" class="muted" font-size="11">引用绑定</text>
    <text x="336" y="152" class="muted" font-size="11">重载选择</text>

    <rect x="468" y="60" width="128" height="150" rx="10" class="step"/>
    <text x="484" y="86" class="num" font-size="15">4</text>
    <text x="484" y="112" class="label" font-size="12.5">遇到转换</text>
    <text x="484" y="134" class="muted" font-size="11">确认用哪一种</text>
    <text x="484" y="152" class="muted" font-size="11">检查机制</text>

    <rect x="616" y="60" width="80" height="150" rx="10" class="step"/>
    <text x="632" y="86" class="num" font-size="15">5</text>
    <text x="632" y="112" class="label" font-size="12.5">有限</text>
    <text x="632" y="130" class="label" font-size="12.5">状态？</text>
    <text x="632" y="154" class="muted" font-size="11">建独立</text>
    <text x="632" y="170" class="muted" font-size="11">枚举</text>
  </g>

  <path class="edge" d="M152 135 H172" marker-end="url(#a)"/>
  <path class="edge" d="M300 135 H320" marker-end="url(#a)"/>
  <path class="edge" d="M448 135 H468" marker-end="url(#a)"/>
  <path class="edge" d="M596 135 H616" marker-end="url(#a)"/>

  <text x="28" y="252" class="muted" font-size="12.5">这套顺序不替你背语言规则，而是把模糊直觉拆成可查证的问题：</text>
  <text x="28" y="274" class="muted" font-size="12.5">先用思想组织观察，再用实验修正思想——预测和结果冲突时，冲突本身最值得记录。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
</svg>
