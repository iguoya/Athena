<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #212529; }
    .sub { font-size: 16px; font-weight: 700; fill: #6c757d; }
    .t { font-size: 15px; fill: #212529; }
    .s { font-size: 14px; fill: #6c757d; }
    .code { font-size: 15px; font-family: ui-monospace, Menlo, monospace; fill: #212529; }
    .res { font-size: 16px; font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
    .arrow { stroke: #6c757d; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="32" y="40" class="title">同一个 ref，两种立场，两个答案</text>

  <!-- 共同的声明 -->
  <rect x="290" y="58" width="320" height="58" rx="9" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="450" y="82" class="code" text-anchor="middle">const int  fixed = 7;</text>
  <text x="450" y="104" class="code" text-anchor="middle">const int&amp; ref   = fixed;</text>

  <path class="arrow" d="M330 116 L210 150" marker-end="url(#a)"/>
  <path class="arrow" d="M570 116 L690 150" marker-end="url(#a)"/>

  <!-- 左：auto -->
  <rect x="32" y="154" width="380" height="176" rx="10" fill="#fff3cd" stroke="#ffc107" stroke-width="1.6"/>
  <text x="52" y="182" class="sub" fill="#664d03">auto copy = ref;</text>
  <text x="52" y="210" class="t">问的是：我要声明一个什么样的新变量？</text>
  <text x="52" y="240" class="s">新变量默认是独立的、可写的一份，</text>
  <text x="52" y="262" class="s">所以引用和顶层 const 都被丢掉。</text>
  <rect x="52" y="278" width="340" height="38" rx="8" fill="#ffffff" stroke="#ffc107" stroke-width="1.4"/>
  <text x="222" y="304" class="res" fill="#664d03" text-anchor="middle">int　（独立副本，可写）</text>

  <!-- 右：decltype -->
  <rect x="488" y="154" width="380" height="176" rx="10" fill="#cfe2ff" stroke="#0a58ca" stroke-width="1.6"/>
  <text x="508" y="182" class="sub" fill="#052c65">decltype(ref)</text>
  <text x="508" y="210" class="t">问的是：ref 按语言规则是什么类型？</text>
  <text x="508" y="240" class="s">如实转述这个实体本来的样子，</text>
  <text x="508" y="262" class="s">连你不想要的部分也一并带上。</text>
  <rect x="508" y="278" width="340" height="38" rx="8" fill="#ffffff" stroke="#0a58ca" stroke-width="1.4"/>
  <text x="678" y="304" class="res" fill="#052c65" text-anchor="middle">const int&amp;　（原样保留）</text>

  <line x1="32" y1="356" x2="868" y2="356" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="32" y="386" class="title" font-size="18">decltype 内部又分两条规则</text>

  <rect x="32" y="402" width="250" height="56" rx="9" fill="#e7f1ff" stroke="#0a58ca" stroke-width="1.4"/>
  <text x="157" y="426" class="code" text-anchor="middle">decltype(value)</text>
  <text x="157" y="448" class="s" text-anchor="middle">未加括号的名字</text>
  <path class="arrow" d="M282 430 H352" marker-end="url(#a)"/>
  <text x="362" y="436" class="t">取它的声明类型　→　<tspan class="res" fill="#052c65">int</tspan></text>

  <rect x="32" y="470" width="250" height="56" rx="9" fill="#e7f1ff" stroke="#0a58ca" stroke-width="1.4"/>
  <text x="157" y="494" class="code" text-anchor="middle">decltype((value))</text>
  <text x="157" y="516" class="s" text-anchor="middle">括号让它成为表达式</text>
  <path class="arrow" d="M282 498 H352" marker-end="url(#a)"/>
  <text x="362" y="492" class="t">按值类别取类型：左值 <tspan class="res" fill="#052c65">T&amp;</tspan>　将亡值 <tspan class="res" fill="#052c65">T&amp;&amp;</tspan>　纯右值 <tspan class="res" fill="#052c65">T</tspan></text>
  <text x="362" y="516" class="s">所以 decltype((value)) 是 int&amp; —— 一对括号改的是语义，不是排版。</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
