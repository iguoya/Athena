[package]
name = "athena-math"
version = "0.1.0"
description = "Athena 数学自学独立应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_math_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled：自带 SQLite 源码一起编，不依赖目标机器上有没有 libsqlite3。
# Windows 上没有系统 sqlite3，链系统库这条路走不通（ADR 0047）。
rusqlite = { version = "0.32", features = ["bundled"] }
dirs-next = "2"
tts = "0.26.3"

[profile.dev]
debug = 1
