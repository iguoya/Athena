[package]
name = "athena-microcontroller"
version = "0.1.0"
description = "Athena 硬件实验台 独立学习应用"
authors = ["Athena"]
edition = "2021"

[lib]
name = "athena_microcontroller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs-next = "2"
# 串口枚举与收发：帧格式实验直接看真实字节。
serialport = "4"
