[package]
name = "lumi"
version = "0.1.0"
description = "拾阶 · Ascent 英语学习"
edition = "2021"

[lib]
name = "lumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
