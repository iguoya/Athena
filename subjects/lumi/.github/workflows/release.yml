# Build a signed Windows installer on every push to master and publish it as a GitHub Release.
# The installed app checks the latest release on launch and updates itself (ADR 0018).
name: Release

on:
  push:
    branches: [master]
    paths-ignore: ["adr/**", "archive/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check signing key
        id: key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set, so no release is built. See ADR 0018."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ready == 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: src-tauri

      - name: Install dependencies
        if: steps.key.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Every build gets a higher version so the updater sees it as new.
      - name: Set version
        if: steps.key.outputs.ready == 'true'
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - uses: tauri-apps/tauri-action@v0
        if: steps.key.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Lumi v__VERSION__
          releaseBody: 自动构建，提交 ${{ github.sha }}
          releaseDraft: false
          prerelease: false
