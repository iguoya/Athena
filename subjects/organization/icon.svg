<?xml version="1.0" encoding="UTF-8"?>
<!--
  organization（计算机组成原理）的应用图标：冯·诺依曼结构——运算器与控制器组成的 CPU、
  存储器、输入输出经总线相连，是组成原理教材第一章的标志画面。本应用自绘，无第三方素材。
  改完跑 `launcher icons` 重新生成 icon.renders 声明的位图（ADR 0065 三处同源）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92400E"/>
      <stop offset="0.55" stop-color="#B45309"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <!-- 总线与三条支线 -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <line x1="104" y1="304" x2="408" y2="304"/>
    <line x1="256" y1="246" x2="256" y2="304"/>
    <line x1="170" y1="304" x2="170" y2="340"/>
    <line x1="342" y1="304" x2="342" y2="340"/>
  </g>
  <!-- CPU：运算器 + 控制器 -->
  <rect x="136" y="104" width="240" height="142" rx="24" fill="#FFFFFF"/>
  <rect x="160" y="128" width="88" height="94" rx="12" fill="#FCD34D"/>
  <rect x="264" y="128" width="88" height="94" rx="12" fill="#FDBA74"/>
  <!-- 运算器里的加号，控制器里的时钟脉冲 -->
  <g stroke="#92400E" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="204" y1="152" x2="204" y2="198"/>
    <line x1="181" y1="175" x2="227" y2="175"/>
    <polyline points="276,190 290,190 290,160 310,160 310,190 326,190 326,160 340,160" stroke-linejoin="round"/>
  </g>
  <!-- 存储器：一格格存储单元 -->
  <rect x="100" y="340" width="140" height="84" rx="18" fill="#FFFFFF"/>
  <g stroke="#D97706" stroke-width="10" stroke-linecap="round">
    <line x1="124" y1="362" x2="216" y2="362"/>
    <line x1="124" y1="382" x2="216" y2="382"/>
    <line x1="124" y1="402" x2="216" y2="402"/>
  </g>
  <!-- 输入输出：双向箭头 -->
  <rect x="272" y="340" width="140" height="84" rx="18" fill="#FFFFFF"/>
  <g stroke="#B45309" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="300" y1="382" x2="384" y2="382"/>
    <polyline points="316,366 300,382 316,398"/>
    <polyline points="368,366 384,382 368,398"/>
  </g>
</svg>
