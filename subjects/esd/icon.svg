<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 嵌入式系统设计师应用图标:圆角底 + 芯片与信号,与「嵌入式」意象一致(仓库 ADR 0065,与 softcert 图标同风格)。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8A6D"/>
      <stop offset="0.55" stop-color="#10A37F"/>
      <stop offset="1" stop-color="#2BB886"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7F5EA"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <!-- 四边引脚 -->
  <g stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="18" stroke-linecap="round">
    <line x1="216" y1="132" x2="216" y2="176"/>
    <line x1="296" y1="132" x2="296" y2="176"/>
    <line x1="216" y1="336" x2="216" y2="380"/>
    <line x1="296" y1="336" x2="296" y2="380"/>
    <line x1="132" y1="216" x2="176" y2="216"/>
    <line x1="132" y1="296" x2="176" y2="296"/>
    <line x1="336" y1="216" x2="380" y2="216"/>
    <line x1="336" y1="296" x2="380" y2="296"/>
  </g>
  <!-- 芯片主体 -->
  <rect x="176" y="176" width="160" height="160" rx="28" fill="url(#chip)"/>
  <rect x="176" y="176" width="160" height="160" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10"/>
  <!-- 晶圆内芯 -->
  <rect x="226" y="226" width="60" height="60" rx="12" fill="none" stroke="#0E8A6D" stroke-width="16"/>
</svg>
