name: athena_driver
description: 驾考学习（科目一与科目四）
publish_to: "none"
version: 8.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  clock: ^1.1.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  image: ^4.10.1
  path: ^1.9.1
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - icon.png
    - content/curriculum.json
    - content/sources/catalog.json
    - content/signs.json
    - content/markings.json
    - content/gauges.json
    - content/henan.json
    - content/license_notes.json
    - content/gestures.json
    - content/cheatsheet.json
    - content/notes.json
    - content/subject2.json
    - content/questions/subject1.json
    - content/questions/subject2.json
    - content/questions/subject4.json
    - content/images/subject1/
    - content/images/subject4/
